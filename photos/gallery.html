<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Galerie — Journal</title><style>
*{box-sizing:border-box}html{background:#fff}body{margin:0;font-family:Arial,sans-serif;color:#777;background:#fff}button,a{-webkit-tap-highlight-color:transparent}#back{position:fixed;right:16px;bottom:16px;z-index:10;width:40px;height:40px;display:grid;place-items:center;border:1px solid #e2e2e2;border-radius:5px;background:rgba(255,255,255,.94);color:#999;text-decoration:none;font-size:24px;font-weight:200}#grid{padding:52px 4vw 80px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;align-items:center} .tile{border:0;background:#fff;padding:0;cursor:zoom-in;display:flex;justify-content:center;align-items:center;min-width:0;min-height:110px}.tile img{display:block;width:100%;height:auto;max-height:240px;object-fit:contain}.tile img:not([src]){background:#f9f9f9;height:130px}#viewer{position:fixed;inset:0;z-index:20;background:#fff;display:none;align-items:center;justify-content:center;padding:5vmin}#viewer.open{display:flex}#large{max-width:100%;max-height:100%;object-fit:contain}#close{position:fixed;right:16px;bottom:16px;width:40px;height:40px;border:1px solid #e2e2e2;border-radius:5px;background:#fff;color:#999;font-size:25px;cursor:pointer}body.viewing{overflow:hidden}@media(max-width:900px){#grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}}@media(max-width:550px){#grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:35px 12px 70px}.tile{min-height:70px}.tile img:not([src]){height:90px}}
