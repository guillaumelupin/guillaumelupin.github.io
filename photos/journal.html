<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
}

#journal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.photo {
    position: absolute;
    display: block;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}


/* ================================
   FULLSCREEN
================================ */

#fullscreen {
    position: fixed;

    top: 12px;
    right: 12px;

    width: 28px;
    height: 28px;

    padding: 0;

    border: none;

    background: transparent;

    opacity: 0.14;

    z-index: 1000;

    cursor: pointer;

    transition: opacity 0.4s;
}

#fullscreen:hover {
    opacity: 0.4;
}

#fullscreen svg {
    width: 18px;
    height: 18px;
}

:fullscreen #fullscreen {
    opacity: 0;
}

</style>

</head>

<body>

<div id="journal"></div>

<button id="fullscreen"
        aria-label="Fullscreen">

<svg viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5">

<path d="M4 9V4h5"/>
<path d="M20 9V4h-5"/>
<path d="M4 15v5h5"/>
<path d="M20 15v5h-5"/>

</svg>

</button>


<script>


/* =========================================
   SETTINGS
========================================= */

const API =
"https://api.github.com/repos/" +
"guillaumelupin/" +
"guillaumelupin.github.io/" +
"contents/photos/journal?ref=main";


const MAX_PHOTOS = 3;


/*
   Each image lives independently
   for 4–12 seconds AFTER appearing.
*/

const MIN_LIFETIME = 4000;
const MAX_LIFETIME = 12000;


/*
   Time between random events.
*/

const MOBILE_MIN_DELAY = 1800;
const MOBILE_MAX_DELAY = 4500;

const DESKTOP_MIN_DELAY = 2000;
const DESKTOP_MAX_DELAY = 6000;


/*
   Base overlap probability.
*/

const BASE_OVERLAP_CHANCE = 0.15;


/*
   When attempting to create the third
   photo, overlap becomes more acceptable.
*/

const THREE_PHOTO_OVERLAP_CHANCE = 0.30;


/*
   Probability of creating TWO photos
   during one event.

   This is modified dynamically depending
   on what happened previously.
*/

const DOUBLE_BASE_CHANCE = 0.30;


/*
   Probability of creating THREE photos.

   Deliberately very low.
*/

const TRIPLE_BASE_CHANCE = 0.07;


/*
   Rare immediate repetition of the
   same photo.
*/

const IMMEDIATE_REPEAT_CHANCE = 0.08;


/* =========================================
   VARIABLES
========================================= */

const journal =
document.getElementById("journal");

let photos = [];

let activePhotos = [];

let recentPhotos = [];

let previousBatchSize = 0;

let loading = false;


/* =========================================
   RANDOM
========================================= */

function random(min, max) {

    return Math.random() *
    (max - min) + min;

}


function randomInt(min, max) {

    return Math.floor(
        random(min, max + 1)
    );

}


/* =========================================
   PRELOAD
========================================= */

function preloadImage(src) {

    return new Promise(resolve => {

        const img =
        new Image();


        img.onload = () => {

            resolve(img);

        };


        img.onerror = () => {

            /*
               Failed images are NOT removed
               from the collection.
            */

            resolve(null);

        };


        img.src = src;

    });

}


/* =========================================
   LOAD PHOTO LIST
========================================= */

async function loadPhotos() {

    try {

        const response =
        await fetch(API);


        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }


        const files =
        await response.json();


        photos = files

        .filter(file =>
            file.type === "file" &&
            /\.(jpg|jpeg|png|webp|gif)$/i
            .test(file.name)
        )

        .map(file =>
            "https://raw.githubusercontent.com/" +
            "guillaumelupin/" +
            "guillaumelupin.github.io/" +
            "main/photos/journal/" +
            encodeURIComponent(file.name)
        );


        await fillInitialScreen();


        scheduleNextEvent();


    } catch (error) {

        console.error(
            "Could not load Journal:",
            error
        );

    }

}


/* =========================================
   CHOOSE PHOTO
========================================= */

function choosePhoto() {

    if (photos.length === 0) {

        return null;

    }


    /*
       Normally exclude the last two
       photos from the candidate pool.

       This prevents three consecutive
       appearances of the same image.
    */

    let candidates =
    photos.filter(src =>
        !recentPhotos.includes(src)
    );


    /*
       If there are not enough candidates,
       allow an immediate repeat only rarely.
    */

    if (candidates.length === 0) {

        candidates = [...photos];

    }


    /*
       If there is a previous photo,
       give it a small chance of being
       selected again immediately.

       This creates occasional repetition
       without making it predictable.
    */

    if (
        recentPhotos.length > 0 &&
        Math.random() <
        IMMEDIATE_REPEAT_CHANCE
    ) {

        const previous =
        recentPhotos[
            recentPhotos.length - 1
        ];


        if (
            photos.includes(previous)
        ) {

            return previous;

        }

    }


    return candidates[
        randomInt(
            0,
            candidates.length - 1
        )
    ];

}


/* =========================================
   OVERLAP
========================================= */

function overlaps(a, b) {

    return (

        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y

    );

}


/* =========================================
   POSITION
========================================= */

function findPosition(
    width,
    height,
    forceMoreOverlap = false
) {

    let overlapChance =
    BASE_OVERLAP_CHANCE;


    if (forceMoreOverlap) {

        overlapChance =
        THREE_PHOTO_OVERLAP_CHANCE;

    }


    const allowOverlap =
    Math.random() <
    overlapChance;


    /*
       Try many positions before accepting
       an overlap.
    */

    for (
        let attempt = 0;
        attempt < 200;
        attempt++
    ) {


        const position = {

            x: random(
                2,
                98 - width
            ),

            y: random(
                2,
                98 - height
            ),

            w: width,
            h: height

        };


        /*
           Intentional overlap.
        */

        if (allowOverlap) {

            return position;

        }


        let collision = false;


        for (const active of activePhotos) {

            if (
                overlaps(
                    position,
                    active.position
                )
            ) {

                collision = true;

                break;

            }

        }


        if (!collision) {

            return position;

        }

    }


    /*
       If the screen genuinely has no
       suitable free position, allow it.
    */

    return {

        x: random(
            2,
            98 - width
        ),

        y: random(
            2,
            98 - height
        ),

        w: width,
        h: height

    };

}


/* =========================================
   CREATE ONE PHOTO
========================================= */

async function spawnPhoto(
    forceSmall = false
) {

    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const src =
    choosePhoto();


    if (!src) {

        return false;

    }


    /*
       Wait until the image is fully loaded.
    */

    const loaded =
    await preloadImage(src);


    /*
       Do NOT remove failed images.
    */

    if (!loaded) {

        return false;

    }


    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    /* =====================================
       SIZE
    ===================================== */

    const mobile =
    window.innerWidth < 600;


    let width;
    let height;


    /*
       If we're creating the third image,
       it needs to fit more easily.
    */

    if (forceSmall) {

        if (mobile) {

            width =
            random(28, 45);

            height =
            random(28, 45);

        } else {

            width =
            random(24, 40);

            height =
            random(24, 45);

        }

    } else if (mobile) {

        width =
        random(42, 72);

        height =
        random(35, 65);

    } else {

        width =
        random(30, 55);

        height =
        random(30, 65);

    }


    width =
    Math.min(width, 88);

    height =
    Math.min(height, 88);


    /*
       If there are already two photos,
       the third gets a slightly higher
       chance of overlap.
    */

    const position =
    findPosition(
        width,
        height,
        activePhotos.length >= 2
    );


    /* =====================================
       CREATE IMAGE
    ===================================== */

    const img =
    document.createElement("img");


    img.className =
    "photo";


    img.src =
    loaded.src;


    img.draggable =
    false;


    img.style.left =
    position.x + "%";


    img.style.top =
    position.y + "%";


    img.style.width =
    position.w + "%";


    img.style.height =
    position.h + "%";


    journal.appendChild(img);


    /* =====================================
       REGISTER
    ===================================== */

    const active = {

        element: img,

        src: src,

        position: position

    };


    activePhotos.push(active);


    /*
       Remember recent images.

       Only the last two matter.
    */

    recentPhotos.push(src);


    if (
        recentPhotos.length > 2
    ) {

        recentPhotos.shift();

    }


    /* =====================================
       INDIVIDUAL LIFETIME
    ===================================== */

    const lifetime =
    random(
        MIN_LIFETIME,
        MAX_LIFETIME
    );


    /*
       Countdown starts only now.
    */

    setTimeout(() => {

        img.remove();


        activePhotos =
        activePhotos.filter(
            item =>
            item !== active
        );


    }, lifetime);


    return true;

}


/* =========================================
   INITIAL SCREEN
========================================= */

async function fillInitialScreen() {

    /*
       Start with 2 or 3.

       Three is common initially so
       the phone doesn't begin empty.
    */

    const target =
    Math.random() < 0.80
    ? 3
    : 2;


    for (
        let i = 0;
        i < target;
        i++
    ) {

        /*
           If this is the third image,
           allow it to be smaller.
        */

        await spawnPhoto(
            i === 2
        );

    }


    previousBatchSize =
    target;

}


/* =========================================
   DETERMINE EVENT SIZE
========================================= */

function determineBatchSize() {

    const count =
    activePhotos.length;


    /*
       If there are already 3,
       nothing can be added.
    */

    if (
        count >= MAX_PHOTOS
    ) {

        return 0;

    }


    /*
       Empty screen:
       strongly favour 2,
       occasionally 3.
    */

    if (count === 0) {

        const r =
        Math.random();


        if (r < 0.12) {

            return 3;

        }


        if (r < 0.82) {

            return 2;

        }


        return 1;

    }


    /*
       One photo currently visible.

       Usually create one,
       sometimes create two.
    */

    if (count === 1) {

        let doubleChance =
        DOUBLE_BASE_CHANCE;


        /*
           If the previous event already
           created two, reduce the chance.
        */

        if (
            previousBatchSize === 2
        ) {

            doubleChance *= 0.30;

        }


        /*
           If the previous event created
           three, make two even less likely.
        */

        if (
            previousBatchSize === 3
        ) {

            doubleChance *= 0.45;

        }


        if (
            Math.random() <
            doubleChance
        ) {

            return 2;

        }


        return 1;

    }


    /*
       Two photos currently visible.

       Only one can be added.

       It becomes the third photo.
    */

    if (count === 2) {

        /*
           Sometimes wait instead of
           immediately filling the screen.
        */

        if (
            Math.random() < 0.72
        ) {

            return 1;

        }


        return 0;

    }


    return 0;

}


/* =========================================
   RUN EVENT
========================================= */

async function runEvent() {

    if (loading) {

        return;

    }


    loading = true;


    let amount =
    determineBatchSize();


    /*
       Never exceed three.
    */

    amount =
    Math.min(
        amount,
        MAX_PHOTOS -
        activePhotos.length
    );


    /*
       If we're creating 3 photos in
       one event, only do it when there
       is enough room.
    */

    if (
        amount === 3 &&
        activePhotos.length > 0
    ) {

        amount = 2;

    }


    /*
       Create the photos simultaneously.

       They are each loaded independently,
       so their lifetimes will also be
       independent.
    */

    const tasks = [];


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        /*
           If this becomes the third photo,
           make it smaller.
        */

        const willBeThird =
        activePhotos.length +
        i >= 2;


        tasks.push(
            spawnPhoto(willBeThird)
        );

    }


    await Promise.all(tasks);


    /*
       Remember what kind of event
       just happened.

       This influences the next event.
    */

    previousBatchSize =
    amount;


    loading = false;

}


/* =========================================
   SCHEDULE NEXT EVENT
========================================= */

function scheduleNextEvent() {

    const mobile =
    window.innerWidth < 600;


    let delay;


    if (mobile) {

        delay =
        random(
            MOBILE_MIN_DELAY,
            MOBILE_MAX_DELAY
        );

    } else {

        delay =
        random(
            DESKTOP_MIN_DELAY,
            DESKTOP_MAX_DELAY
        );

    }


    setTimeout(async () => {


        /*
           Emergency protection against
           a completely empty screen.

           If everything disappeared,
           immediately refill with 2–3.
        */

        if (
            activePhotos.length === 0
        ) {

            await fillInitialScreen();

        } else {

            await runEvent();

        }


        scheduleNextEvent();


    }, delay);

}


/* =========================================
   FULLSCREEN
========================================= */

const fullscreenButton =
document.getElementById(
    "fullscreen"
);


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                .requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Fullscreen unavailable:",
                error
            );

        }

    }
);


/* =========================================
   START
========================================= */

loadPhotos();

</script>

</body>
</html>
