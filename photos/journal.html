<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
}

#journal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.photo {
    position: absolute;
    display: block;

    object-fit: contain;

    user-select: none;
    -webkit-user-drag: none;

    pointer-events: none;
}

#fullscreen {
    position: fixed;
    top: 12px;
    right: 12px;

    width: 28px;
    height: 28px;

    padding: 0;
    border: 0;

    background: transparent;

    opacity: 0.06;

    z-index: 9999;

    cursor: pointer;
}

#fullscreen:hover {
    opacity: 0.20;
}

#fullscreen svg {
    width: 18px;
    height: 18px;
}

:fullscreen #fullscreen {
    opacity: 0;
}

</style>

</head>

<body>


<div id="journal"></div>


<button id="fullscreen">

<svg viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5">

    <path d="M4 9V4h5"/>
    <path d="M20 9V4h-5"/>
    <path d="M4 15v5h5"/>
    <path d="M20 15v5h-5"/>

</svg>

</button>


<script>


/* =========================================================
   GITHUB FOLDER
========================================================= */

const API =
"https://api.github.com/repos/" +
"guillaumelupin/" +
"guillaumelupin.github.io/" +
"contents/photos/journal?ref=main";


/* =========================================================
   MAIN SETTINGS
========================================================= */

const MAX_PHOTOS = 3;


/*
   New decision every 3–6 seconds.
*/

const MIN_ROLL = 3000;
const MAX_ROLL = 6000;


/* =========================================================
   GENERATION
========================================================= */

/*
   If there is already one photo,
   the system has a strong chance of
   adding another.

   This is intentionally NOT too low.
*/

const GENERATE_CHANCE = 0.88;


/* =========================================================
   NUMBER OF NEW PHOTOS
========================================================= */

/*
   When there is room:

   1 new photo = 55%
   2 new photos = 40%
   3 new photos = 5%

   BUT this is adjusted according to
   the number already on screen.
*/

const ONE_NEW = 0.55;
const TWO_NEW = 0.40;


/* =========================================================
   OVERLAP
========================================================= */

const SECOND_OVERLAP = 0.07;

const THIRD_OVERLAP = 0.30;


/*
   Extremely rare special case.
*/

const RARE_OVERLAP = 0.01;


/* =========================================================
   PHOTO LIFETIME
========================================================= */

const NORMAL_MIN = 4200;
const NORMAL_MAX = 9000;

const LONG_CHANCE = 0.045;

const VERY_LONG_CHANCE = 0.008;


/* =========================================================
   VARIABLES
========================================================= */

const journal =
document.getElementById("journal");


let photos = [];

let active = [];

let recent = [];


/* =========================================================
   RANDOM
========================================================= */

function rnd(min, max) {

    return Math.random() *
        (max - min) + min;

}


function rndi(min, max) {

    return Math.floor(
        rnd(min, max + 1)
    );

}


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImage(src) {

    return new Promise(resolve => {

        const image =
            new Image();


        image.onload = () => {

            resolve(image);

        };


        image.onerror = () => {

            resolve(null);

        };


        image.src = src;

    });

}


/* =========================================================
   LOAD GITHUB DIRECTORY
========================================================= */

async function loadPhotos() {

    try {

        const response =
            await fetch(API);


        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }


        const files =
            await response.json();


        photos = files

            .filter(file =>

                file.type === "file" &&

                /\.(jpg|jpeg|png|webp|gif)$/i
                    .test(file.name)

            )

            .map(file =>

                "https://raw.githubusercontent.com/" +
                "guillaumelupin/" +
                "guillaumelupin.github.io/" +
                "main/photos/journal/" +
                encodeURIComponent(file.name)

            );


        /*
           IMPORTANT:

           Start with TWO photos
           often enough that the page
           does not behave like an album.
        */

        await startJournal();


        roll();


    }

    catch (error) {

        console.error(
            "Journal error:",
            error
        );

    }

}


/* =========================================================
   CHOOSE PHOTO
========================================================= */

function choosePhoto() {

    if (!photos.length) {

        return null;

    }


    const pool = [];


    for (
        const src of photos
    ) {

        let weight = 100;


        /*
           Three identical consecutive
           appearances are forbidden.
        */

        if (

            recent.length >= 2 &&

            recent[
                recent.length - 1
            ] === src &&

            recent[
                recent.length - 2
            ] === src

        ) {

            weight = 0;

        }


        /*
           Same photo twice consecutively
           is possible, but rare.
        */

        else if (

            recent.length >= 1 &&

            recent[
                recent.length - 1
            ] === src

        ) {

            weight = 8;

        }


        /*
           Recent but not immediately previous.
        */

        else if (

            recent.length >= 2 &&

            recent[
                recent.length - 2
            ] === src

        ) {

            weight = 35;

        }


        for (
            let i = 0;
            i < weight;
            i++
        ) {

            pool.push(src);

        }

    }


    if (!pool.length) {

        return photos[
            rndi(
                0,
                photos.length - 1
            )
        ];

    }


    return pool[
        rndi(
            0,
            pool.length - 1
        )
    ];

}


/* =========================================================
   PHOTO SIZE
========================================================= */

function getSize(
    numberOnScreen
) {

    const mobile =
        window.innerWidth < 600;


    /*
       Third photo:
       definitely smaller.
    */

    if (
        numberOnScreen >= 3
    ) {

        return {

            w: mobile
                ? rnd(24, 38)
                : rnd(21, 36),

            h: mobile
                ? rnd(25, 41)
                : rnd(22, 39)

        };

    }


    /*
       90% of normal photos are large.

       This preserves the main visual identity.
    */

    if (
        Math.random() < 0.90
    ) {

        return {

            w: mobile
                ? rnd(54, 82)
                : rnd(43, 70),

            h: mobile
                ? rnd(53, 80)
                : rnd(43, 74)

        };

    }


    /*
       Occasional medium photo.
    */

    return {

        w: mobile
            ? rnd(40, 58)
            : rnd(33, 50),

        h: mobile
            ? rnd(40, 58)
            : rnd(34, 53)

    };

}


/* =========================================================
   RECTANGLE OVERLAP
========================================================= */

function intersection(a, b) {

    const x =
        Math.max(
            0,
            Math.min(
                a.x + a.w,
                b.x + b.w
            ) -
            Math.max(
                a.x,
                b.x
            )
        );


    const y =
        Math.max(
            0,
            Math.min(
                a.y + a.h,
                b.y + b.h
            ) -
            Math.max(
                a.y,
                b.y
            )
        );


    return x * y;

}


/* =========================================================
   FIND POSITION
========================================================= */

function findPosition(
    w,
    h,
    overlapChance,
    forceSmall = false
) {


    /*
       Rare exceptional overlap.
    */

    if (
        Math.random() <
        RARE_OVERLAP
    ) {

        overlapChance =
            Math.max(
                overlapChance,
                0.20
            );

    }


    const wantsOverlap =
        Math.random() <
        overlapChance;


    let best = null;

    let bestOverlap = Infinity;


    /*
       =====================================================
       TRY MANY POSITIONS
       =====================================================
    */

    for (
        let i = 0;
        i < 800;
        i++
    ) {


        const candidate = {

            x: rnd(
                2,
                98 - w
            ),

            y: rnd(
                2,
                98 - h
            ),

            w: w,

            h: h

        };


        let totalOverlap = 0;


        for (
            const item of active
        ) {

            totalOverlap +=
                intersection(
                    candidate,
                    item.position
                );

        }


        /*
           -------------------------------------------------
           CLEAN POSITION
           -------------------------------------------------
        */

        if (!wantsOverlap) {

            if (
                totalOverlap === 0
            ) {

                return candidate;

            }


            if (
                totalOverlap <
                bestOverlap
            ) {

                bestOverlap =
                    totalOverlap;

                best =
                    candidate;

            }

        }


        /*
           -------------------------------------------------
           INTENTIONAL OVERLAP
           -------------------------------------------------
        */

        else {

            const area =
                w * h;


            const ratio =
                totalOverlap /
                area;


            /*
               Allow overlap, but never
               let it become absurd.
            */

            if (
                ratio > 0.01 &&
                ratio < 0.22
            ) {

                return candidate;

            }

        }

    }


    /*
       Clean fallback.

       We would rather have a slightly
       imperfect composition than prevent
       the second image from appearing.
    */

    if (
        best &&
        bestOverlap <
        w * h * 0.10
    ) {

        return best;

    }


    /*
       Last resort:
       a random valid position.
    */

    return {

        x: rnd(
            2,
            98 - w
        ),

        y: rnd(
            2,
            98 - h
        ),

        w: w,

        h: h

    };

}


/* =========================================================
   LIFETIME
========================================================= */

function getLifetime() {


    /*
       Very rare 15–20 sec.
    */

    if (
        Math.random() <
        VERY_LONG_CHANCE
    ) {

        return rnd(
            15000,
            20000
        );

    }


    /*
       Rare 9–15 sec.
    */

    if (
        Math.random() <
        LONG_CHANCE
    ) {

        return rnd(
            9000,
            15000
        );

    }


    /*
       Normal 4.2–9 sec.
    */

    return rnd(
        NORMAL_MIN,
        NORMAL_MAX
    );

}


/* =========================================================
   ADD PHOTO
========================================================= */

async function addPhoto(
    overlapChance
) {


    /*
       Never more than 3.
    */

    if (
        active.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const src =
        choosePhoto();


    if (!src) {

        return false;

    }


    /*
       LOAD BEFORE DISPLAY.
    */

    const loaded =
        await loadImage(src);


    if (!loaded) {

        return false;

    }


    /*
       The size depends on how many
       photos are already present.
    */

    const size =
        getSize(
            active.length + 1
        );


    const position =
        findPosition(
            size.w,
            size.h,
            overlapChance
        );


    /*
       Create only after everything
       has been calculated.
    */

    const img =
        document.createElement("img");


    img.className =
        "photo";


    img.src =
        loaded.src;


    img.draggable =
        false;


    img.style.left =
        position.x + "%";


    img.style.top =
        position.y + "%";


    img.style.width =
        position.w + "%";


    img.style.height =
        position.h + "%";


    journal.appendChild(img);


    const item = {

        element: img,

        src: src,

        position: position

    };


    active.push(item);


    /*
       Remember image.
    */

    recent.push(src);


    if (
        recent.length > 3
    ) {

        recent.shift();

    }


    /*
       =====================================================
       TIMER STARTS ONLY NOW
       =====================================================
    */

    const lifetime =
        getLifetime();


    setTimeout(() => {


        img.remove();


        active =
            active.filter(
                x =>
                    x !== item
            );


        /*
           NEVER allow complete blank.
        */

        if (
            active.length === 0
        ) {

            addPhoto(0);

        }


    }, lifetime);


    return true;

}


/* =========================================================
   INITIAL SCREEN
========================================================= */

async function startJournal() {


    /*
       Start with either:

       1 photo = 45%
       2 photos = 50%
       3 photos = 5%

       This immediately makes two-photo
       compositions genuinely common.
    */

    const r =
        Math.random();


    let amount;


    if (
        r < 0.45
    ) {

        amount = 1;

    }

    else if (
        r < 0.95
    ) {

        amount = 2;

    }

    else {

        amount = 3;

    }


    /*
       Create simultaneously.
    */

    const jobs = [];


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        if (
            i === 0
        ) {

            jobs.push(
                addPhoto(0)
            );

        }

        else if (
            i === 1
        ) {

            jobs.push(
                addPhoto(
                    SECOND_OVERLAP
                )
            );

        }

        else {

            jobs.push(
                addPhoto(
                    THIRD_OVERLAP
                )
            );

        }

    }


    await Promise.all(jobs);


    /*
       Safety.
    */

    if (
        active.length === 0
    ) {

        await addPhoto(0);

    }

}


/* =========================================================
   DECIDE HOW MANY NEW PHOTOS
========================================================= */

function decideGeneration() {


    const count =
        active.length;


    /*
       No photos:
       MUST create one.
    */

    if (
        count === 0
    ) {

        return 1;

    }


    /*
       One photo:

       30% chance of TWO new photos.
       70% chance of ONE new photo.

       This means two-photo situations
       actually happen frequently.
    */

    if (
        count === 1
    ) {

        const r =
            Math.random();


        if (
            r < 0.30
        ) {

            return 2;

        }


        return 1;

    }


    /*
       Two photos:

       10% chance of a third.

       Otherwise no generation.
    */

    if (
        count === 2
    ) {

        if (
            Math.random() < 0.10
        ) {

            return 1;

        }


        return 0;

    }


    /*
       Three photos:
       no more.
    */

    return 0;

}


/* =========================================================
   THE DICE
========================================================= */

async function roll() {


    /*
       Random time before next roll.
    */

    const delay =
        rnd(
            MIN_ROLL,
            MAX_ROLL
        );


    setTimeout(
        async () => {


            /*
               =================================================
               DICE #1
               =================================================
            */

            const generate =
                Math.random() <
                GENERATE_CHANCE;


            if (!generate) {

                roll();

                return;

            }


            /*
               =================================================
               DICE #2
               =================================================

               How many new photos?
            */

            const number =
                decideGeneration();


            if (
                number <= 0
            ) {

                roll();

                return;

            }


            /*
               =================================================
               DICE #3
               =================================================

               Generate simultaneously.
            */

            const jobs = [];


            for (
                let i = 0;
                i < number;
                i++
            ) {


                /*
                   First new photo.
                */

                if (
                    i === 0
                ) {

                    jobs.push(
                        addPhoto(0)
                    );

                }


                /*
                   Second new photo.

                   7% overlap.
                */

                else if (
                    i === 1
                ) {

                    jobs.push(
                        addPhoto(
                            SECOND_OVERLAP
                        )
                    );

                }


                /*
                   Third new photo.

                   30% overlap.
                */

                else {

                    jobs.push(
                        addPhoto(
                            THIRD_OVERLAP
                        )
                    );

                }

            }


            await Promise.all(jobs);


            /*
               Continue forever.
            */

            roll();


        },
        delay
    );

}


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreenButton =
document.getElementById(
    "fullscreen"
);


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            }

            else {

                await document.exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen:",
                error
            );

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPhotos();

</script>

</body>

</html>
