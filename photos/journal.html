<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
}

#journal {
    position: fixed;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* =========================================================
   PHOTOS
========================================================= */

.photo {
    position: absolute;
    display: block;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

#fullscreen {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    opacity: 0.06;
    z-index: 9999;
    cursor: pointer;
}

#fullscreen:hover {
    opacity: 0.20;
}

#fullscreen svg {
    width: 18px;
    height: 18px;
}

:fullscreen #fullscreen {
    opacity: 0;
}

</style>
</head>

<body>

<div id="journal"></div>

<button id="fullscreen">

    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.5">

        <path d="M4 9V4h5"/>
        <path d="M20 9V4h-5"/>
        <path d="M4 15v5h5"/>
        <path d="M20 15v5h-5"/>

    </svg>

</button>

<script>

/* =========================================================
   GITHUB
========================================================= */

const API =
    "https://api.github.com/repos/" +
    "guillaumelupin/" +
    "guillaumelupin.github.io/" +
    "contents/photos/journal?ref=main";


/* =========================================================
   GENERAL LIMITS
========================================================= */

const MAX_PHOTOS = 3;


/*
   Le programme prend une nouvelle décision
   toutes les 3 à 6 secondes.
*/

const MIN_ROLL = 3000;
const MAX_ROLL = 6000;


/*
   Chance normale qu'une décision provoque
   effectivement une génération.
*/

const GENERATE_CHANCE = 0.90;


/*
   Très petite chance de forcer une génération
   même lorsque les règles normales disent non.

   Cela évite que le système reste bloqué.
*/

const BRUTE_FORCE_CHANCE = 0.01;


/* =========================================================
   NUMBER OF NEW PHOTOS
========================================================= */


/*
   Avec UNE photo :

   32 % → possibilité de faire apparaître
           deux nouvelles photos ensemble.

   Sinon → une nouvelle photo peut apparaître.
*/

const ONE_TO_TWO_CHANCE = 0.32;


/*
   Avec DEUX photos :

   14 % → possibilité de faire apparaître
           une troisième photo.

   Sinon → aucune nouvelle photo.
*/

const TWO_TO_THREE_CHANCE = 0.14;


/*
   Probabilité utilisée comme garde-fou lorsque
   le système doit absolument éviter une composition vide.
*/

const EMERGENCY_GENERATION_CHANCE = 0.99;


/* =========================================================
   OVERLAP
========================================================= */


/*
   Chevauchement extrêmement rare.

   Avec deux photos :
   environ 2.5 %.

   Avec trois :
   environ 10 %.

   Le système essaie malgré tout de trouver
   une position propre avant d'autoriser
   réellement le chevauchement.
*/

const SECOND_OVERLAP_CHANCE = 0.025;
const THIRD_OVERLAP_CHANCE = 0.10;


/*
   Événement exceptionnel.
*/

const RARE_OVERLAP_CHANCE = 0.002;


/*
   Même lorsqu'un chevauchement est autorisé,
   il reste limité.
*/

const MAX_NORMAL_OVERLAP = 0.035;
const MAX_THIRD_OVERLAP = 0.08;


/* =========================================================
   PHOTO LIFETIME
========================================================= */


/*
   DURÉE NORMALE

   La majorité des photos restent entre
   6 et 10 secondes.
*/

const NORMAL_MIN = 6000;
const NORMAL_MAX = 10000;


/*
   Petite probabilité d'une photo plus courte.

   Cela apporte quelques changements rapides
   sans rendre le système nerveux.

   7 % des apparitions.
*/

const SHORT_CHANCE = 0.07;

const SHORT_MIN = 3000;
const SHORT_MAX = 6000;


/*
   Cas rare :

   10–15 secondes.
*/

const LONG_CHANCE = 0.045;

const LONG_MIN = 10000;
const LONG_MAX = 15000;


/*
   Cas extrêmement rare :

   15–20 secondes.

   L'équivalent d'un "shiny".
*/

const VERY_LONG_CHANCE = 0.008;

const VERY_LONG_MIN = 15000;
const VERY_LONG_MAX = 20000;


/* =========================================================
   PHOTO MEMORY
========================================================= */

const viewCount = new Map();

let recent = [];

let displayedSinceCheck = 0;


/*
   Toutes les 35–45 photos environ,
   le système cherche volontairement
   une photo jamais vue ou très peu vue.
*/

const MIN_FORCED_CHECK = 35;
const MAX_FORCED_CHECK = 45;

let nextForcedCheck = 0;


/* =========================================================
   VARIABLES
========================================================= */

let photos = [];

let active = [];


/* =========================================================
   RANDOM
========================================================= */

function random(min, max) {

    return Math.random() *
        (max - min) +
        min;

}


function randomInt(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* =========================================================
   LOAD INDIVIDUAL IMAGE
========================================================= */

function loadImage(src) {

    return new Promise(resolve => {

        const image = new Image();

        image.onload = () => {

            resolve(image);

        };

        image.onerror = () => {

            /*
               On ne retire JAMAIS la photo
               du dossier logique.

               Elle pourra être réessayée
               plus tard.
            */

            resolve(null);

        };

        image.src = src;

    });

}


/* =========================================================
   LOAD ALL PHOTOS FROM GITHUB
========================================================= */

async function loadPhotos() {

    try {

        const response =
            await fetch(API);

        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }

        const files =
            await response.json();


        photos = files

            .filter(file =>
                file.type === "file" &&
                /\.(jpg|jpeg|png|webp|gif)$/i
                    .test(file.name)
            )

            .map(file =>
                "https://raw.githubusercontent.com/" +
                "guillaumelupin/" +
                "guillaumelupin.github.io/" +
                "main/photos/journal/" +
                encodeURIComponent(
                    file.name
                )
            );


        /*
           Initialise la mémoire.
        */

        for (const src of photos) {

            viewCount.set(
                src,
                0
            );

        }


        nextForcedCheck =
            randomInt(
                MIN_FORCED_CHECK,
                MAX_FORCED_CHECK
            );


        console.log(
            "Journal:",
            photos.length,
            "photos found."
        );


        /*
           Première composition.
        */

        await createInitialComposition();


        /*
           Démarre le système.
        */

        roll();

    }

    catch (error) {

        console.error(
            "Journal error:",
            error
        );

    }

}


/* =========================================================
   CHOOSE PHOTO
========================================================= */

function choosePhoto() {

    if (photos.length === 0) {

        return null;

    }


    /* =====================================================
       FORCED ARCHIVE ROTATION
    ===================================================== */

    if (
        displayedSinceCheck >=
        nextForcedCheck
    ) {

        const unseen =
            photos.filter(
                src =>
                    (viewCount.get(src) || 0)
                    === 0
            );


        /*
           Priorité absolue aux photos
           jamais montrées.
        */

        if (unseen.length > 0) {

            return unseen[
                randomInt(
                    0,
                    unseen.length - 1
                )
            ];

        }


        /*
           Si toutes les photos ont déjà été vues,
           on choisit parmi les moins vues.
        */

        let minimum = Infinity;

        for (const src of photos) {

            const count =
                viewCount.get(src) || 0;

            if (count < minimum) {

                minimum = count;

            }

        }


        const leastSeen =
            photos.filter(
                src =>
                    (viewCount.get(src) || 0)
                    === minimum
            );


        if (leastSeen.length > 0) {

            return leastSeen[
                randomInt(
                    0,
                    leastSeen.length - 1
                )
            ];

        }

    }


    /* =====================================================
       NORMAL WEIGHTED RANDOM
    ===================================================== */

    const pool = [];


    for (const src of photos) {

        let weight = 100;

        const count =
            viewCount.get(src) || 0;


        /*
           Photos jamais vues favorisées.
        */

        if (count === 0) {

            weight = 180;

        }


        /*
           Même photo interdite trois fois
           consécutivement.
        */

        if (

            recent.length >= 2 &&

            recent[
                recent.length - 1
            ] === src &&

            recent[
                recent.length - 2
            ] === src

        ) {

            weight = 0;

        }


        /*
           Deux fois de suite :
           possible mais très rare.
        */

        else if (

            recent.length >= 1 &&

            recent[
                recent.length - 1
            ] === src

        ) {

            weight *= 0.08;

        }


        /*
           Photo récemment vue :
           fortement découragée.
        */

        else if (

            recent.length >= 2 &&

            recent[
                recent.length - 2
            ] === src

        ) {

            weight *= 0.30;

        }


        /*
           Plus une photo a été vue,
           moins elle est prioritaire.
        */

        if (count > 0) {

            weight *=
                1 /
                Math.sqrt(count);

        }


        for (
            let i = 0;
            i < Math.max(
                0,
                Math.round(weight)
            );
            i++
        ) {

            pool.push(src);

        }

    }


    if (pool.length === 0) {

        return photos[
            randomInt(
                0,
                photos.length - 1
            )
        ];

    }


    return pool[
        randomInt(
            0,
            pool.length - 1
        )
    ];

}


/* =========================================================
   SIZE
========================================================= */

function getSize(numberOfPhotos) {

    const mobile =
        window.innerWidth < 600;


    /*
       Trois photos :

       nécessairement plus petites
       pour conserver de l'espace.
    */

    if (numberOfPhotos >= 3) {

        return {

            w: mobile
                ? random(27, 43)
                : random(23, 40),

            h: mobile
                ? random(28, 45)
                : random(24, 42)

        };

    }


    /*
       Grande photo dominante.

       88 % des cas.
    */

    if (Math.random() < 0.88) {

        return {

            w: mobile
                ? random(58, 86)
                : random(46, 74),

            h: mobile
                ? random(58, 84)
                : random(46, 76)

        };

    }


    /*
       Photo moyenne occasionnelle.
    */

    return {

        w: mobile
            ? random(44, 62)
            : random(35, 54),

        h: mobile
            ? random(44, 62)
            : random(36, 56)

    };

}


/* =========================================================
   RECTANGLE INTERSECTION
========================================================= */

function intersection(a, b) {

    const x =
        Math.max(
            0,
            Math.min(
                a.x + a.w,
                b.x + b.w
            ) -
            Math.max(
                a.x,
                b.x
            )
        );


    const y =
        Math.max(
            0,
            Math.min(
                a.y + a.h,
                b.y + b.h
            ) -
            Math.max(
                a.y,
                b.y
            )
        );


    return x * y;

}


/* =========================================================
   FIND POSITION
========================================================= */

function findPosition(
    w,
    h,
    overlapChance,
    isThirdPhoto
) {

    /*
       Très rare événement spécial.
    */

    if (
        Math.random() <
        RARE_OVERLAP_CHANCE
    ) {

        overlapChance = 1;

    }


    const wantsOverlap =
        Math.random() <
        overlapChance;


    let best = null;

    let bestOverlap =
        Infinity;


    /*
       Recherche intensive.

       Chaque nouvelle photo est consciente
       de TOUTES les photos déjà présentes.
    */

    for (
        let i = 0;
        i < 2500;
        i++
    ) {

        const candidate = {

            x: random(
                2,
                98 - w
            ),

            y: random(
                2,
                98 - h
            ),

            w: w,

            h: h

        };


        let totalOverlap = 0;


        for (const item of active) {

            totalOverlap +=
                intersection(
                    candidate,
                    item.position
                );

        }


        const area =
            w * h;


        const ratio =
            totalOverlap / area;


        /*
           CAS NORMAL :

           priorité absolue à l'espace vide.
        */

        if (!wantsOverlap) {

            if (
                totalOverlap === 0
            ) {

                return candidate;

            }


            if (
                ratio <
                bestOverlap
            ) {

                bestOverlap =
                    ratio;

                best =
                    candidate;

            }

        }


        /*
           CAS RARE :

           chevauchement autorisé,
           mais seulement légèrement.
        */

        else {

            const maximum =
                isThirdPhoto
                    ? MAX_THIRD_OVERLAP
                    : MAX_NORMAL_OVERLAP;


            if (

                ratio > 0 &&

                ratio <= maximum

            ) {

                return candidate;

            }

        }

    }


    /*
       Si aucune position parfaite
       n'a été trouvée, on privilégie
       toujours la position la plus propre.
    */

    if (
        best &&
        bestOverlap < 0.025
    ) {

        return best;

    }


    /*
       Dernière recherche :
       trouver absolument la position
       qui chevauche le moins.
    */

    let safest = null;

    let safestOverlap =
        Infinity;


    for (
        let i = 0;
        i < 1500;
        i++
    ) {

        const candidate = {

            x: random(
                2,
                98 - w
            ),

            y: random(
                2,
                98 - h
            ),

            w: w,

            h: h

        };


        let totalOverlap = 0;


        for (const item of active) {

            totalOverlap +=
                intersection(
                    candidate,
                    item.position
                );

        }


        const ratio =
            totalOverlap /
            (w * h);


        if (
            ratio <
            safestOverlap
        ) {

            safestOverlap =
                ratio;

            safest =
                candidate;

        }

    }


    return safest;

}


/* =========================================================
   LIFETIME
========================================================= */

function getLifetime() {

    /*
       SHINY :

       0.8 % de chance
       → 15 à 20 secondes.
    */

    if (
        Math.random() <
        VERY_LONG_CHANCE
    ) {

        return random(
            VERY_LONG_MIN,
            VERY_LONG_MAX
        );

    }


    /*
       Rare :

       4.5 % de chance
       → 10 à 15 secondes.
    */

    if (
        Math.random() <
        LONG_CHANCE
    ) {

        return random(
            LONG_MIN,
            LONG_MAX
        );

    }


    /*
       Nouveau :

       7 % de chance
       → durée courte de 3 à 6 secondes.

       Cela permet parfois à une photo
       de disparaître rapidement,
       sans changer la philosophie générale.
    */

    if (
        Math.random() <
        SHORT_CHANCE
    ) {

        return random(
            SHORT_MIN,
            SHORT_MAX
        );

    }


    /*
       Normal :

       6 à 10 secondes.
    */

    return random(
        NORMAL_MIN,
        NORMAL_MAX
    );

}


/* =========================================================
   ADD PHOTO
========================================================= */

async function addPhoto(
    overlapChance = 0,
    isThirdPhoto = false
) {

    /*
       Limite absolue.
    */

    if (
        active.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const src =
        choosePhoto();


    if (!src) {

        return false;

    }


    /*
       IMPORTANT :

       l'image est entièrement chargée
       AVANT d'être affichée.
    */

    const loaded =
        await loadImage(src);


    /*
       Si elle échoue,
       elle reste dans l'archive
       et pourra être réessayée.
    */

    if (!loaded) {

        return false;

    }


    /*
       Taille calculée après chargement.
    */

    const size =
        getSize(
            active.length + 1
        );


    /*
       Position consciente
       des autres photos.
    */

    const position =
        findPosition(
            size.w,
            size.h,
            overlapChance,
            isThirdPhoto
        );


    const img =
        document.createElement(
            "img"
        );


    img.className =
        "photo";


    img.src =
        loaded.src;


    img.draggable =
        false;


    img.style.left =
        position.x + "%";


    img.style.top =
        position.y + "%";


    img.style.width =
        position.w + "%";


    img.style.height =
        position.h + "%";


    journal.appendChild(img);


    const item = {

        element: img,

        src: src,

        position: position

    };


    active.push(item);


    /* =====================================================
       MEMORY
    ===================================================== */

    const count =
        viewCount.get(src) || 0;


    viewCount.set(
        src,
        count + 1
    );


    displayedSinceCheck++;


    recent.push(src);


    if (
        recent.length > 3
    ) {

        recent.shift();

    }


    /*
       Réinitialisation du compteur
       de rotation d'archive.
    */

    if (
        displayedSinceCheck >=
        nextForcedCheck
    ) {

        displayedSinceCheck = 0;


        nextForcedCheck =
            randomInt(
                MIN_FORCED_CHECK,
                MAX_FORCED_CHECK
            );

    }


    /* =====================================================
       LIFETIME
    ===================================================== */

    const lifetime =
        getLifetime();


    /*
       Le compte à rebours commence
       UNIQUEMENT maintenant :

       la photo est déjà chargée
       et déjà visible.
    */

    setTimeout(() => {

        img.remove();


        active =
            active.filter(
                x =>
                    x !== item
            );


        /*
           GARDE-FOU ABSOLU :

           si cette photo était la dernière,
           on en prépare immédiatement une autre.

           Donc jamais de page blanche volontaire.
        */

        if (
            active.length === 0
        ) {

            emergencyReplacement();

        }

    }, lifetime);


    return true;

}


/* =========================================================
   EMERGENCY REPLACEMENT
========================================================= */

async function emergencyReplacement() {

    /*
       Une nouvelle photo est créée
       immédiatement lorsque l'écran
       risque de devenir complètement blanc.
    */

    if (
        active.length > 0
    ) {

        return;

    }


    let success =
        await addPhoto(
            0,
            false
        );


    /*
       Si le chargement échoue,
       on réessaie légèrement plus tard.
    */

    if (!success) {

        setTimeout(
            emergencyReplacement,
            500
        );

    }

}


/* =========================================================
   INITIAL COMPOSITION
========================================================= */

async function createInitialComposition() {

    /*
       Composition initiale :

       45 % → une photo
       48 % → deux photos
       7 %  → trois photos
    */

    const r =
        Math.random();


    let amount;


    if (
        r < 0.45
    ) {

        amount = 1;

    }

    else if (
        r < 0.93
    ) {

        amount = 2;

    }

    else {

        amount = 3;

    }


    /*
       On charge les photos
       avant de les afficher.
    */

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        if (
            i === 0
        ) {

            await addPhoto(
                0,
                false
            );

        }

        else if (
            i === 1
        ) {

            await addPhoto(
                SECOND_OVERLAP_CHANCE,
                false
            );

        }

        else {

            await addPhoto(
                THIRD_OVERLAP_CHANCE,
                true
            );

        }

    }


    /*
       Sécurité.
    */

    if (
        active.length === 0
    ) {

        await addPhoto(
            0,
            false
        );

    }

}


/* =========================================================
   RANDOM DECISION
========================================================= */

function decideGeneration() {

    /*
       =====================================================
       ZERO PHOTO
       =====================================================

       Impossible normalement,
       mais dans ce cas :
       génération obligatoire.
    */

    if (
        active.length === 0
    ) {

        return {

            amount: 1,

            overlap: 0

        };

    }


    /*
       =====================================================
       ONE PHOTO
       =====================================================
    */

    if (
        active.length === 1
    ) {

        /*
           32 % :

           deux photos peuvent arriver
           simultanément.
        */

        if (
            Math.random() <
            ONE_TO_TWO_CHANCE
        ) {

            return {

                amount: 2,

                overlap:
                    SECOND_OVERLAP_CHANCE

            };

        }


        /*
           Sinon une photo.
        */

        return {

            amount: 1,

            overlap: 0

        };

    }


    /*
       =====================================================
       TWO PHOTOS
       =====================================================
    */

    if (
        active.length === 2
    ) {

        /*
           14 % :

           une troisième photo arrive.
        */

        if (
            Math.random() <
            TWO_TO_THREE_CHANCE
        ) {

            return {

                amount: 1,

                overlap:
                    THIRD_OVERLAP_CHANCE,

                third: true

            };

        }


        /*
           Sinon aucune nouvelle photo.
        */

        return {

            amount: 0,

            overlap: 0

        };

    }


    /*
       =====================================================
       THREE PHOTOS
       =====================================================

       Impossible d'en ajouter une quatrième.
    */

    return {

        amount: 0,

        overlap: 0

    };

}


/* =========================================================
   RANDOM ROLL
========================================================= */

function roll() {

    /*
       Nouvelle décision dans 3–6 secondes.
    */

    const delay =
        random(
            MIN_ROLL,
            MAX_ROLL
        );


    setTimeout(
        async () => {


            /*
               =================================================
               DICE #1

               Est-ce qu'on génère quelque chose ?
               =================================================
            */

            let generate =
                Math.random() <
                GENERATE_CHANCE;


            /*
               Petit niveau de chaos contrôlé :

               1 % de chance de forcer
               la génération.
            */

            if (
                !generate &&
                Math.random() <
                BRUTE_FORCE_CHANCE
            ) {

                generate = true;

            }


            if (!generate) {

                roll();

                return;

            }


            /*
               =================================================
               DICE #2

               Combien de photos ?
               =================================================
            */

            const decision =
                decideGeneration();


            /*
               Si les règles normales disent
               de ne rien ajouter...
            */

            if (
                decision.amount <= 0
            ) {

                /*
                   Petit jet supplémentaire.

                   Dans de très rares cas,
                   on décide quand même de faire
                   apparaître quelque chose.

                   Mais seulement s'il reste
                   physiquement de la place.
                */

                if (
                    active.length < MAX_PHOTOS &&
                    Math.random() <
                    BRUTE_FORCE_CHANCE
                ) {

                    decision.amount = 1;

                    decision.overlap = 0;

                }

                else {

                    roll();

                    return;

                }

            }


            /*
               =================================================
               CREATE PHOTOS
               =================================================

               Les photos d'une même décision
               sont préparées avant affichage.
            */

            const jobs = [];


            for (
                let i = 0;
                i < decision.amount;
                i++
            ) {

                /*
                   Première photo.
                */

                if (
                    i === 0
                ) {

                    jobs.push(
                        addPhoto(
                            decision.overlap,
                            decision.third === true
                        )
                    );

                }

                /*
                   Deuxième photo :

                   elle doit tenir compte
                   de la première.
                */

                else {

                    jobs.push(
                        addPhoto(
                            decision.overlap,
                            false
                        )
                    );

                }

            }


            await Promise.all(
                jobs
            );


            /*
               =================================================
               SAFETY
               =================================================

               Jamais d'écran vide.
            */

            if (
                active.length === 0
            ) {

                await emergencyReplacement();

            }


            /*
               Le programme continue.
            */

            roll();


        },
        delay
    );

}


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreenButton =
    document.getElementById(
        "fullscreen"
    );


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document
                    .documentElement
                    .requestFullscreen();

            }

            else {

                await document
                    .exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);

loadPhotos();
