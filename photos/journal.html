<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
}

#journal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.photo {
    position: absolute;
    display: block;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

#fullscreen {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    opacity: 0.06;
    z-index: 9999;
    cursor: pointer;
}

#fullscreen:hover {
    opacity: 0.20;
}

#fullscreen svg {
    width: 18px;
    height: 18px;
}

:fullscreen #fullscreen {
    opacity: 0;
}

</style>

</head>

<body>

<div id="journal"></div>

<button id="fullscreen">

<svg viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5">

    <path d="M4 9V4h5"/>
    <path d="M20 9V4h-5"/>
    <path d="M4 15v5h5"/>
    <path d="M20 15v5h-5"/>

</svg>

</button>


<script>


/* =========================================================
   GITHUB FOLDER
========================================================= */

const API =
"https://api.github.com/repos/" +
"guillaumelupin/" +
"guillaumelupin.github.io/" +
"contents/photos/journal?ref=main";


/* =========================================================
   GENERAL SETTINGS
========================================================= */

const MAX_PHOTOS = 3;


/*
   A new decision happens every 3–6 seconds.
*/

const MIN_ROLL = 3000;
const MAX_ROLL = 6000;


/*
   Probability that a roll actually
   generates something.
*/

const GENERATE_CHANCE = 0.88;


/* =========================================================
   GENERATION
========================================================= */

/*
   When one photo is already visible:

   30% chance that TWO photos are added.

   Otherwise ONE photo is added.
*/

const TWO_PHOTOS_CHANCE = 0.30;


/*
   When two photos are already visible:

   10% chance of adding a third.
*/

const THREE_PHOTO_CHANCE = 0.10;


/* =========================================================
   OVERLAP
========================================================= */

const SECOND_OVERLAP = 0.07;

const THIRD_OVERLAP = 0.30;


/*
   Extremely rare unusual overlap.
*/

const RARE_OVERLAP = 0.01;


/* =========================================================
   PHOTO LIFETIME
========================================================= */

const NORMAL_MIN = 4200;
const NORMAL_MAX = 9000;


/*
   Rare longer appearance.
*/

const LONG_CHANCE = 0.045;


/*
   Very rare 15–20 second appearance.
*/

const VERY_LONG_CHANCE = 0.008;


/* =========================================================
   PHOTO MEMORY
========================================================= */


/*
   Number of actually displayed photos
   since the last forced check.
*/

let displayedSinceCheck = 0;


/*
   Every approximately 40 displayed photos,
   check for photos that have never appeared.
*/

const MIN_FORCED_CHECK = 35;
const MAX_FORCED_CHECK = 45;


/*
   Randomly choose the next threshold
   so it isn't always exactly 40.
*/

let nextForcedCheck =
    randomInt(
        MIN_FORCED_CHECK,
        MAX_FORCED_CHECK
    );


/*
   Number of times each image has actually
   appeared on the screen.

   Example:

   photo.jpg → 7
*/

const viewCount = new Map();


/*
   Photos that have never appeared yet.
*/

let neverSeen = [];


/* =========================================================
   VARIABLES
========================================================= */

const journal =
document.getElementById("journal");


let photos = [];

let active = [];

let recent = [];


/* =========================================================
   RANDOM FUNCTIONS
========================================================= */

function random(min, max) {

    return Math.random() *
        (max - min) + min;

}


function randomInt(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* =========================================================
   IMAGE LOADING
========================================================= */

function loadImage(src) {

    return new Promise(resolve => {

        const image =
            new Image();


        image.onload = () => {

            resolve(image);

        };


        image.onerror = () => {

            /*
               Important:

               We do NOT remove the photo
               from the list.

               It can be retried later.
            */

            resolve(null);

        };


        image.src = src;

    });

}


/* =========================================================
   LOAD PHOTOS FROM GITHUB
========================================================= */

async function loadPhotos() {

    try {

        const response =
            await fetch(API);


        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }


        const files =
            await response.json();


        photos = files

            .filter(file =>

                file.type === "file" &&

                /\.(jpg|jpeg|png|webp|gif)$/i
                    .test(file.name)

            )

            .map(file =>

                "https://raw.githubusercontent.com/" +
                "guillaumelupin/" +
                "guillaumelupin.github.io/" +
                "main/photos/journal/" +
                encodeURIComponent(file.name)

            );


        /*
           Initialise the memory.
        */

        neverSeen =
            [...photos];


        for (
            const src of photos
        ) {

            viewCount.set(
                src,
                0
            );

        }


        console.log(
            "Journal:",
            photos.length,
            "photos found."
        );


        await startJournal();


        roll();

    }

    catch (error) {

        console.error(
            "Journal error:",
            error
        );

    }

}


/* =========================================================
   PHOTO SELECTION
========================================================= */

function choosePhoto() {


    if (!photos.length) {

        return null;

    }


    /*
       =====================================================
       FORCED UNSEEN PHOTO
       =====================================================
    */


    if (
        displayedSinceCheck >=
        nextForcedCheck
    ) {


        /*
           Find photos that have never
           appeared.
        */

        const unseen =
            photos.filter(
                src =>
                    (viewCount.get(src) || 0)
                    === 0
            );


        if (
            unseen.length > 0
        ) {

            const selected =
                unseen[
                    randomInt(
                        0,
                        unseen.length - 1
                    )
                ];


            console.log(
                "Journal:",
                "forcing unseen photo"
            );


            return selected;

        }


        /*
           If everything has been seen,
           find the least-viewed photos.
        */

        let minimum =
            Infinity;


        for (
            const src of photos
        ) {

            const count =
                viewCount.get(src) || 0;


            if (
                count < minimum
            ) {

                minimum = count;

            }

        }


        const leastSeen =
            photos.filter(
                src =>
                    (viewCount.get(src) || 0)
                    === minimum
            );


        if (
            leastSeen.length > 0
        ) {

            return leastSeen[
                randomInt(
                    0,
                    leastSeen.length - 1
                )
            ];

        }

    }


    /*
       =====================================================
       NORMAL RANDOM SELECTION
       =====================================================
    */


    const pool = [];


    for (
        const src of photos
    ) {


        let weight = 100;


        const count =
            viewCount.get(src) || 0;


        /*
           A photo that has never appeared
           receives a bonus.
        */

        if (
            count === 0
        ) {

            weight = 180;

        }


        /*
           Three identical consecutive
           appearances are forbidden.
        */

        if (

            recent.length >= 2 &&

            recent[
                recent.length - 1
            ] === src &&

            recent[
                recent.length - 2
            ] === src

        ) {

            weight = 0;

        }


        /*
           Same photo twice consecutively
           remains possible, but very rare.
        */

        else if (

            recent.length >= 1 &&

            recent[
                recent.length - 1
            ] === src

        ) {

            weight *= 0.08;

        }


        /*
           Photo from two appearances ago
           is discouraged.
        */

        else if (

            recent.length >= 2 &&

            recent[
                recent.length - 2
            ] === src

        ) {

            weight *= 0.35;

        }


        /*
           Photos seen fewer times get a
           small additional advantage.

           This gradually balances the archive.
        */

        if (
            count > 0
        ) {

            weight *=
                1 /
                Math.sqrt(count);

        }


        for (
            let i = 0;
            i < Math.max(
                0,
                Math.round(weight)
            );
            i++
        ) {

            pool.push(src);

        }

    }


    if (
        pool.length === 0
    ) {

        return photos[
            randomInt(
                0,
                photos.length - 1
            )
        ];

    }


    return pool[
        randomInt(
            0,
            pool.length - 1
        )
    ];

}


/* =========================================================
   SIZE
========================================================= */

function getSize(
    numberOnScreen
) {

    const mobile =
        window.innerWidth < 600;


    /*
       Third image is smaller so that
       three-image compositions remain elegant.
    */

    if (
        numberOnScreen >= 3
    ) {

        return {

            w: mobile
                ? random(24, 38)
                : random(21, 36),

            h: mobile
                ? random(25, 41)
                : random(22, 39)

        };

    }


    /*
       Large photos dominate.

       90% chance of a large image.
    */

    if (
        Math.random() < 0.90
    ) {

        return {

            w: mobile
                ? random(54, 82)
                : random(43, 70),

            h: mobile
                ? random(53, 80)
                : random(43, 74)

        };

    }


    /*
       Occasional medium image.
    */

    return {

        w: mobile
            ? random(40, 58)
            : random(33, 50),

        h: mobile
            ? random(40, 58)
            : random(34, 53)

    };

}


/* =========================================================
   RECTANGLE INTERSECTION
========================================================= */

function intersection(a, b) {

    const x =
        Math.max(
            0,
            Math.min(
                a.x + a.w,
                b.x + b.w
            ) -
            Math.max(
                a.x,
                b.x
            )
        );


    const y =
        Math.max(
            0,
            Math.min(
                a.y + a.h,
                b.y + b.h
            ) -
            Math.max(
                a.y,
                b.y
            )
        );


    return x * y;

}


/* =========================================================
   FIND POSITION
========================================================= */

function findPosition(
    w,
    h,
    overlapChance
) {


    /*
       Rare special event.
    */

    if (
        Math.random() <
        RARE_OVERLAP
    ) {

        overlapChance =
            Math.max(
                overlapChance,
                0.20
            );

    }


    const wantsOverlap =
        Math.random() <
        overlapChance;


    let best = null;

    let bestOverlap =
        Infinity;


    /*
       Try many positions.
    */

    for (
        let i = 0;
        i < 800;
        i++
    ) {


        const candidate = {

            x: random(
                2,
                98 - w
            ),

            y: random(
                2,
                98 - h
            ),

            w: w,

            h: h

        };


        let totalOverlap = 0;


        for (
            const item of active
        ) {

            totalOverlap +=
                intersection(
                    candidate,
                    item.position
                );

        }


        /*
           CLEAN POSITION
        */

        if (!wantsOverlap) {


            if (
                totalOverlap === 0
            ) {

                return candidate;

            }


            if (
                totalOverlap <
                bestOverlap
            ) {

                bestOverlap =
                    totalOverlap;

                best =
                    candidate;

            }

        }


        /*
           INTENTIONAL OVERLAP
        */

        else {

            const ratio =
                totalOverlap /
                (w * h);


            if (
                ratio > 0.01 &&
                ratio < 0.22
            ) {

                return candidate;

            }

        }

    }


    /*
       Prefer a small overlap to
       refusing the second photo.
    */

    if (
        best &&
        bestOverlap <
        w * h * 0.10
    ) {

        return best;

    }


    /*
       Final fallback.
    */

    return {

        x: random(
            2,
            98 - w
        ),

        y: random(
            2,
            98 - h
        ),

        w: w,

        h: h

    };

}


/* =========================================================
   LIFETIME
========================================================= */

function getLifetime() {


    /*
       Very rare 15–20 seconds.
    */

    if (
        Math.random() <
        VERY_LONG_CHANCE
    ) {

        return random(
            15000,
            20000
        );

    }


    /*
       Rare 9–15 seconds.
    */

    if (
        Math.random() <
        LONG_CHANCE
    ) {

        return random(
            9000,
            15000
        );

    }


    /*
       Normal 4.2–9 seconds.
    */

    return random(
        NORMAL_MIN,
        NORMAL_MAX
    );

}


/* =========================================================
   ADD PHOTO
========================================================= */

async function addPhoto(
    overlapChance
) {


    /*
       Never exceed three photos.
    */

    if (
        active.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const src =
        choosePhoto();


    if (!src) {

        return false;

    }


    /*
       Load completely before displaying.
    */

    const loaded =
        await loadImage(src);


    if (!loaded) {

        /*
           Do NOT mark it as seen.

           It will remain eligible for
           another attempt later.
        */

        return false;

    }


    const size =
        getSize(
            active.length + 1
        );


    const position =
        findPosition(
            size.w,
            size.h,
            overlapChance
        );


    const img =
        document.createElement("img");


    img.className =
        "photo";


    img.src =
        loaded.src;


    img.draggable =
        false;


    img.style.left =
        position.x + "%";


    img.style.top =
        position.y + "%";


    img.style.width =
        position.w + "%";


    img.style.height =
        position.h + "%";


    journal.appendChild(img);


    const item = {

        element: img,

        src: src,

        position: position

    };


    active.push(item);


    /*
       =====================================================
       MEMORY
       =====================================================

       This happens ONLY when the photo
       has actually appeared.
    */

    const oldCount =
        viewCount.get(src) || 0;


    viewCount.set(
        src,
        oldCount + 1
    );


    displayedSinceCheck++;


    /*
       Remove from unseen list.
    */

    neverSeen =
        neverSeen.filter(
            x =>
                x !== src
        );


    /*
       Recent-photo memory.
    */

    recent.push(src);


    if (
        recent.length > 3
    ) {

        recent.shift();

    }


    /*
       If the forced check was reached,
       reset the counter.

       We don't reset until an actual
       photo was displayed.
    */

    if (
        displayedSinceCheck >=
        nextForcedCheck
    ) {

        displayedSinceCheck = 0;


        nextForcedCheck =
            randomInt(
                MIN_FORCED_CHECK,
                MAX_FORCED_CHECK
            );

    }


    /*
       =====================================================
       TIMER STARTS NOW
       =====================================================
    */

    const lifetime =
        getLifetime();


    setTimeout(() => {


        img.remove();


        active =
            active.filter(
                x =>
                    x !== item
            );


        /*
           Never allow a completely
           blank screen.
        */

        if (
            active.length === 0
        ) {

            addPhoto(0);

        }


    }, lifetime);


    return true;

}


/* =========================================================
   INITIAL COMPOSITION
========================================================= */

async function startJournal() {


    /*
       Initial composition:

       45% → one
       50% → two
       5%  → three
    */

    const r =
        Math.random();


    let amount;


    if (
        r < 0.45
    ) {

        amount = 1;

    }

    else if (
        r < 0.95
    ) {

        amount = 2;

    }

    else {

        amount = 3;

    }


    /*
       Create simultaneously.
    */

    const jobs = [];


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        if (
            i === 0
        ) {

            jobs.push(
                addPhoto(0)
            );

        }

        else if (
            i === 1
        ) {

            jobs.push(
                addPhoto(
                    SECOND_OVERLAP
                )
            );

        }

        else {

            jobs.push(
                addPhoto(
                    THIRD_OVERLAP
                )
            );

        }

    }


    await Promise.all(jobs);


    /*
       Absolute safety:
       never start with a blank page.
    */

    if (
        active.length === 0
    ) {

        await addPhoto(0);

    }

}


/* =========================================================
   GENERATION DECISION
========================================================= */

function decideGeneration() {


    /*
       =====================================================
       NO PHOTO
       =====================================================
    */

    if (
        active.length === 0
    ) {

        return 1;

    }


    /*
       =====================================================
       ONE PHOTO
       =====================================================
    */

    if (
        active.length === 1
    ) {


        /*
           30% chance of TWO new photos.

           This means the screen can go:

           1 → 3

           which creates the more dynamic
           moments requested.
        */

        if (
            Math.random() <
            TWO_PHOTOS_CHANCE
        ) {

            return 2;

        }


        /*
           Otherwise one new photo.
        */

        return 1;

    }


    /*
       =====================================================
       TWO PHOTOS
       =====================================================
    */

    if (
        active.length === 2
    ) {


        /*
           10% chance of a third.
        */

        if (
            Math.random() <
            THREE_PHOTO_CHANCE
        ) {

            return 1;

        }


        return 0;

    }


    /*
       =====================================================
       THREE PHOTOS
       =====================================================
    */

    return 0;

}


/* =========================================================
   DICE ROLL
========================================================= */

function roll() {


    /*
       Next decision happens randomly
       between 3 and 6 seconds.
    */

    const delay =
        random(
            MIN_ROLL,
            MAX_ROLL
        );


    setTimeout(
        async () => {


            /*
               =================================================
               DICE #1
               =================================================
            */

            const generate =
                Math.random() <
                GENERATE_CHANCE;


            if (!generate) {

                roll();

                return;

            }


            /*
               =================================================
               DICE #2
               =================================================
            */

            const number =
                decideGeneration();


            if (
                number <= 0
            ) {

                roll();

                return;

            }


            /*
               =================================================
               DICE #3
               =================================================

               If two photos are generated,
               they appear simultaneously.
            */

            const jobs = [];


            for (
                let i = 0;
                i < number;
                i++
            ) {


                /*
                   First new photo:
                   no overlap.
                */

                if (
                    i === 0
                ) {

                    jobs.push(
                        addPhoto(0)
                    );

                }


                /*
                   Second new photo:
                   7% overlap.
                */

                else if (
                    i === 1
                ) {

                    jobs.push(
                        addPhoto(
                            SECOND_OVERLAP
                        )
                    );

                }


                /*
                   Third new photo:
                   30% overlap.
                */

                else {

                    jobs.push(
                        addPhoto(
                            THIRD_OVERLAP
                        )
                    );

                }

            }


            await Promise.all(jobs);


            /*
               Continue indefinitely.
            */

            roll();


        },
        delay
    );

}


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreenButton =
document.getElementById(
    "fullscreen"
);


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            }

            else {

                await document.exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPhotos();

</script>

</body>

</html>
