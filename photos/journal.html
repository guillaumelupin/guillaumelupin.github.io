<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
}

#journal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.photo {
    position: absolute;
    display: block;

    object-fit: contain;

    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}


/* --------------------------------
   FULLSCREEN BUTTON
-------------------------------- */

#fullscreen {
    position: fixed;

    top: 12px;
    right: 12px;

    width: 28px;
    height: 28px;

    padding: 0;

    border: none;

    background: transparent;

    opacity: 0.18;

    cursor: pointer;

    z-index: 1000;

    transition: opacity 0.4s;
}

#fullscreen:hover {
    opacity: 0.45;
}

#fullscreen svg {
    width: 18px;
    height: 18px;
}


/* Hide fullscreen button when
   browser is already fullscreen */

:fullscreen #fullscreen {
    opacity: 0;
}

</style>

</head>

<body>

<div id="journal"></div>


<button id="fullscreen"
        aria-label="Fullscreen">

<svg viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5">

<path d="M4 9V4h5"/>
<path d="M20 9V4h-5"/>
<path d="M4 15v5h5"/>
<path d="M20 15v5h-5"/>

</svg>

</button>


<script>


/* =========================================
   SETTINGS
========================================= */

const API =
"https://api.github.com/repos/" +
"guillaumelupin/" +
"guillaumelupin.github.io/" +
"contents/photos/journal?ref=main";


const MAX_PHOTOS = 3;


/*
   Every 8 seconds we decide whether
   another photo should appear.
*/

const CHECK_INTERVAL = 8000;


/*
   How long a photo remains visible
   AFTER it has finished loading.
*/

const MIN_LIFETIME = 4000;

const MAX_LIFETIME = 12000;


/*
   Chance of adding a photo when
   there is available space.

   Mobile gets a slightly higher
   probability.
*/

const DESKTOP_MIN_CHANCE = 0.45;
const DESKTOP_MAX_CHANCE = 0.75;

const MOBILE_MIN_CHANCE = 0.60;
const MOBILE_MAX_CHANCE = 0.90;


/*
   Rare overlap.
*/

const OVERLAP_CHANCE = 0.12;


/* =========================================
   VARIABLES
========================================= */

const journal =
document.getElementById("journal");

let photos = [];

let activePhotos = [];

let recentPhotos = [];


/* =========================================
   RANDOM
========================================= */

function random(min, max) {

    return Math.random() *
    (max - min) + min;

}


function randomInt(min, max) {

    return Math.floor(
        random(min, max + 1)
    );

}


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array) {

    return [...array].sort(
        () => Math.random() - 0.5
    );

}


/* =========================================
   PRELOAD
========================================= */

function preloadImage(src) {

    return new Promise(resolve => {

        const img = new Image();


        img.onload = () => {

            resolve(img);

        };


        img.onerror = () => {

            resolve(null);

        };


        img.src = src;

    });

}


/* =========================================
   LOAD PHOTO LIST
========================================= */

async function loadPhotos() {

    try {

        const response =
        await fetch(API);


        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }


        const files =
        await response.json();


        photos = files

        .filter(file =>
            file.type === "file" &&
            /\.(jpg|jpeg|png|webp|gif)$/i
            .test(file.name)
        )

        .map(file =>
            "https://raw.githubusercontent.com/" +
            "guillaumelupin/" +
            "guillaumelupin.github.io/" +
            "main/photos/journal/" +
            encodeURIComponent(file.name)
        );


        /*
           Immediately create an initial
           group so the screen isn't empty.
        */

        await initialLoad();


    } catch (error) {

        console.error(
            "Could not load Journal:",
            error
        );

    }

}


/* =========================================
   CHOOSE PHOTO
========================================= */

function choosePhoto() {

    if (photos.length === 0) {
        return null;
    }


    /*
       Don't allow the same photo to be
       selected for three consecutive
       appearances.
    */

    let candidates =
    photos.filter(src =>
        !recentPhotos.includes(src)
    );


    /*
       If the collection is too small,
       relax the restriction.
    */

    if (candidates.length === 0) {

        candidates = [...photos];

    }


    return candidates[
        randomInt(
            0,
            candidates.length - 1
        )
    ];

}


/* =========================================
   CHECK OVERLAP
========================================= */

function overlaps(a, b) {

    return (

        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y

    );

}


/* =========================================
   POSITION
========================================= */

function findPosition(width, height) {

    const allowOverlap =
    Math.random() < OVERLAP_CHANCE;


    for (
        let attempt = 0;
        attempt < 100;
        attempt++
    ) {


        const position = {

            x: random(
                2,
                98 - width
            ),

            y: random(
                2,
                98 - height
            ),

            w: width,
            h: height

        };


        /*
           Occasionally allow overlap.
        */

        if (allowOverlap) {

            return position;

        }


        let collision = false;


        for (const active of activePhotos) {

            if (
                overlaps(
                    position,
                    active.position
                )
            ) {

                collision = true;

                break;

            }

        }


        if (!collision) {

            return position;

        }

    }


    /*
       If no free position was found,
       allow overlap.
    */

    return {

        x: random(
            2,
            98 - width
        ),

        y: random(
            2,
            98 - height
        ),

        w: width,
        h: height

    };

}


/* =========================================
   SPAWN PHOTO
========================================= */

async function spawnPhoto() {

    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return;

    }


    const src =
    choosePhoto();


    if (!src) {
        return;
    }


    /*
       WAIT FOR COMPLETE LOAD
    */

    const loaded =
    await preloadImage(src);


    /*
       Failed images are NOT removed.
    */

    if (!loaded) {

        return;

    }


    /*
       Check again after loading.
    */

    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return;

    }


    /* =====================================
       SIZE
    ===================================== */

    let width;
    let height;


    const mobile =
    window.innerWidth <
    600;


    if (mobile) {

        /*
           Larger on phones.
        */

        width =
        random(42, 72);

        height =
        random(35, 65);

    } else {

        width =
        random(30, 55);

        height =
        random(30, 65);

    }


    /*
       Never exceed the screen.
    */

    width =
    Math.min(width, 88);

    height =
    Math.min(height, 88);


    const position =
    findPosition(
        width,
        height
    );


    /* =====================================
       DISPLAY
    ===================================== */

    const img =
    document.createElement("img");


    img.className =
    "photo";


    /*
       The image has already been loaded.
    */

    img.src =
    loaded.src;


    img.draggable =
    false;


    img.style.left =
    position.x + "%";


    img.style.top =
    position.y + "%";


    img.style.width =
    position.w + "%";


    img.style.height =
    position.h + "%";


    journal.appendChild(img);


    /* =====================================
       REGISTER
    ===================================== */

    const active = {

        element: img,

        src: src,

        position: position

    };


    activePhotos.push(active);


    /*
       Remember recent photos.
    */

    recentPhotos.push(src);


    if (
        recentPhotos.length > 2
    ) {

        recentPhotos.shift();

    }


    /* =====================================
       LIFETIME
    ===================================== */

    const lifetime =
    random(
        MIN_LIFETIME,
        MAX_LIFETIME
    );


    /*
       IMPORTANT:

       This countdown starts NOW,
       after the image has completely
       loaded and appeared.
    */

    setTimeout(() => {

        img.remove();


        activePhotos =
        activePhotos.filter(
            item =>
            item !== active
        );


    }, lifetime);

}


/* =========================================
   INITIAL LOAD
========================================= */

async function initialLoad() {

    /*
       Start with 1–3 photos.

       They are loaded BEFORE being
       displayed.
    */

    const number =
    Math.min(
        photos.length,
        randomInt(1, 3)
    );


    for (
        let i = 0;
        i < number;
        i++
    ) {

        await spawnPhoto();

    }

}


/* =========================================
   PERIODIC SPAWN
========================================= */

function trySpawnPhoto() {

    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return;

    }


    const mobile =
    window.innerWidth <
    600;


    let chance;


    if (mobile) {

        chance =
        random(
            MOBILE_MIN_CHANCE,
            MOBILE_MAX_CHANCE
        );

    } else {

        chance =
        random(
            DESKTOP_MIN_CHANCE,
            DESKTOP_MAX_CHANCE
        );

    }


    if (
        Math.random() <
        chance
    ) {

        spawnPhoto();

    }

}


/* =========================================
   START
========================================= */

loadPhotos();


setInterval(
    trySpawnPhoto,
    CHECK_INTERVAL
);


/* =========================================
   FULLSCREEN
========================================= */

const fullscreenButton =
document.getElementById(
    "fullscreen"
);


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                .requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Fullscreen unavailable:",
                error
            );

        }

    }
);


/*
   On mobile browsers, fullscreen can
   sometimes be exited with the browser's
   own controls. Keep button state simple.
*/

document.addEventListener(
    "fullscreenchange",
    () => {

        if (
            document.fullscreenElement
        ) {

            fullscreenButton.style.opacity =
            "0";

        } else {

            fullscreenButton.style.opacity =
            "0.18";

        }

    }
);

</script>

</body>
</html>
