<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
}

#journal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.photo {
    position: absolute;
    display: block;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

#fullscreen {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    background: transparent;
    opacity: 0.10;
    z-index: 1000;
    cursor: pointer;
}

#fullscreen:hover {
    opacity: 0.35;
}

#fullscreen svg {
    width: 18px;
    height: 18px;
}

:fullscreen #fullscreen {
    opacity: 0;
}

</style>

</head>

<body>

<div id="journal"></div>

<button id="fullscreen" aria-label="Fullscreen">

<svg viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5">

<path d="M4 9V4h5"/>
<path d="M20 9V4h-5"/>
<path d="M4 15v5h5"/>
<path d="M20 15v5h-5"/>

</svg>

</button>

<script>

/* =========================================================
   GITHUB
========================================================= */

const API =
"https://api.github.com/repos/" +
"guillaumelupin/" +
"guillaumelupin.github.io/" +
"contents/photos/journal?ref=main";


/* =========================================================
   GENERAL
========================================================= */

const MAX_PHOTOS = 3;


/* =========================================================
   PHOTO LIFETIME
========================================================= */

const MIN_LIFETIME = 5500;
const MAX_LIFETIME = 15000;

const RARE_LIFETIME_CHANCE = 0.02;
const RARE_MAX_LIFETIME = 20000;


/* =========================================================
   TIME BETWEEN EVENTS
========================================================= */

const MOBILE_MIN_DELAY = 2300;
const MOBILE_MAX_DELAY = 5200;

const DESKTOP_MIN_DELAY = 2600;
const DESKTOP_MAX_DELAY = 6200;


/* =========================================================
   NUMBER OF PHOTOS
========================================================= */

/*
   1 photo = dominant
   2 photos = common
   3 photos = rare
*/

const DOUBLE_CHANCE = 0.30;
const TRIPLE_CHANCE = 0.035;


/* =========================================================
   OVERLAP
========================================================= */

/*
   Normal overlap is now VERY rare.
*/

const BASE_OVERLAP_CHANCE = 0.07;


/*
   With three photos, overlap is a little
   more likely, but still uncommon.
*/

const THREE_PHOTO_OVERLAP_CHANCE = 0.14;


/*
   Extremely rare unusual composition.
*/

const RARE_OVERLAP_CHANCE = 0.008;


/* =========================================================
   RARE COMPOSITIONS
========================================================= */

const RARE_COMPOSITION_CHANCE = 0.02;


/* =========================================================
   VARIABLES
========================================================= */

const journal =
document.getElementById("journal");

let photos = [];

let activePhotos = [];

let recentPhotos = [];

let previousBatchSize = 0;

let loading = false;


/* =========================================================
   RANDOM
========================================================= */

function random(min, max) {

    return Math.random() *
    (max - min) + min;

}


function randomInt(min, max) {

    return Math.floor(
        random(min, max + 1)
    );

}


/* =========================================================
   PRELOAD
========================================================= */

function preloadImage(src) {

    return new Promise(resolve => {

        const img = new Image();

        img.onload = () => {
            resolve(img);
        };

        img.onerror = () => {

            /*
               Do not remove failed images.
               They remain available for another
               attempt later.
            */

            resolve(null);

        };

        img.src = src;

    });

}


/* =========================================================
   LOAD FILES FROM GITHUB
========================================================= */

async function loadPhotos() {

    try {

        const response =
        await fetch(API);

        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }

        const files =
        await response.json();

        photos = files

        .filter(file =>
            file.type === "file" &&
            /\.(jpg|jpeg|png|webp|gif)$/i
            .test(file.name)
        )

        .map(file =>
            "https://raw.githubusercontent.com/" +
            "guillaumelupin/" +
            "guillaumelupin.github.io/" +
            "main/photos/journal/" +
            encodeURIComponent(file.name)
        );


        await fillInitialScreen();

        scheduleNextEvent();


    } catch (error) {

        console.error(
            "Could not load Journal:",
            error
        );

    }

}


/* =========================================================
   CHOOSE PHOTO
========================================================= */

function choosePhoto() {

    if (photos.length === 0) {
        return null;
    }


    /*
       Every photo remains eligible.

       Recent photos are simply given a very
       low probability rather than being
       removed from the pool.
    */

    const weighted = [];


    for (const src of photos) {

        let weight = 100;


        /*
           Last photo:
           strongly discouraged.
        */

        if (
            recentPhotos.length >= 1 &&
            src ===
            recentPhotos[
                recentPhotos.length - 1
            ]
        ) {

            weight = 2;

        }


        /*
           Second-to-last:
           slightly discouraged.
        */

        else if (
            recentPhotos.length >= 2 &&
            src ===
            recentPhotos[
                recentPhotos.length - 2
            ]
        ) {

            weight = 15;

        }


        /*
           Add weighted entries.
        */

        for (
            let i = 0;
            i < weight;
            i++
        ) {

            weighted.push(src);

        }

    }


    /*
       Very rare immediate repetition.

       Still never allows the same photo
       to become the last 3 selections.
    */

    if (
        recentPhotos.length > 0 &&
        Math.random() < 0.025
    ) {

        const previous =
        recentPhotos[
            recentPhotos.length - 1
        ];


        /*
           Only allow this if it would not
           create three consecutive appearances.
        */

        if (
            recentPhotos.length < 2 ||
            recentPhotos[
                recentPhotos.length - 2
            ] !== previous
        ) {

            return previous;

        }

    }


    return weighted[
        randomInt(
            0,
            weighted.length - 1
        )
    ];

}


/* =========================================================
   COLLISION
========================================================= */

function overlaps(a, b) {

    return (

        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y

    );

}


/* =========================================================
   POSITION
========================================================= */

function findPosition(
    width,
    height,
    threePhotoMode = false
) {

    let overlapChance =
    BASE_OVERLAP_CHANCE;


    if (threePhotoMode) {

        overlapChance =
        THREE_PHOTO_OVERLAP_CHANCE;

    }


    /*
       Very rare exceptional overlap.
    */

    if (
        Math.random() <
        RARE_OVERLAP_CHANCE
    ) {

        overlapChance = 0.45;

    }


    const intentionalOverlap =
    Math.random() <
    overlapChance;


    /*
       Try very hard to find a clean
       position first.
    */

    for (
        let attempt = 0;
        attempt < 400;
        attempt++
    ) {

        const position = {

            x: random(
                2,
                98 - width
            ),

            y: random(
                2,
                98 - height
            ),

            w: width,
            h: height

        };


        /*
           If overlap was intentionally
           selected, accept immediately.
        */

        if (intentionalOverlap) {

            return position;

        }


        let collision = false;


        for (const active of activePhotos) {

            if (
                overlaps(
                    position,
                    active.position
                )
            ) {

                collision = true;
                break;

            }

        }


        if (!collision) {

            return position;

        }

    }


    /*
       Only if there really is no room,
       allow overlap.
    */

    return {

        x: random(
            2,
            98 - width
        ),

        y: random(
            2,
            98 - height
        ),

        w: width,
        h: height

    };

}


/* =========================================================
   SIZE
========================================================= */

function getPhotoSize(
    isThirdPhoto = false
) {

    const mobile =
    window.innerWidth < 600;


    /*
       Rare giant image.
    */

    if (
        Math.random() <
        RARE_COMPOSITION_CHANCE &&
        activePhotos.length === 0
    ) {

        return {

            width: mobile
                ? random(76, 90)
                : random(62, 84),

            height: mobile
                ? random(72, 91)
                : random(65, 88)

        };

    }


    /*
       Third image.
    */

    if (isThirdPhoto) {

        return {

            width: mobile
                ? random(25, 40)
                : random(22, 36),

            height: mobile
                ? random(24, 42)
                : random(24, 40)

        };

    }


    /*
       Normal mobile image.
    */

    if (mobile) {

        return {

            width: random(46, 76),
            height: random(40, 70)

        };

    }


    /*
       Normal desktop image.
    */

    return {

        width: random(32, 60),
        height: random(34, 70)

    };

}


/* =========================================================
   LIFETIME
========================================================= */

function getLifetime() {

    /*
       Very rare long-lasting image.
    */

    if (
        Math.random() <
        RARE_LIFETIME_CHANCE
    ) {

        return random(
            MAX_LIFETIME,
            RARE_MAX_LIFETIME
        );

    }


    return random(
        MIN_LIFETIME,
        MAX_LIFETIME
    );

}


/* =========================================================
   CREATE PHOTO
========================================================= */

async function spawnPhoto(
    isThirdPhoto = false
) {

    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const src =
    choosePhoto();


    if (!src) {
        return false;
    }


    /*
       The image is completely loaded
       before anything is put on screen.
    */

    const loaded =
    await preloadImage(src);


    if (!loaded) {

        return false;

    }


    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const size =
    getPhotoSize(
        isThirdPhoto
    );


    const position =
    findPosition(
        size.width,
        size.height,
        activePhotos.length >= 2
    );


    const img =
    document.createElement("img");


    img.className =
    "photo";


    img.src =
    loaded.src;


    img.draggable =
    false;


    img.style.left =
    position.x + "%";


    img.style.top =
    position.y + "%";


    img.style.width =
    position.w + "%";


    img.style.height =
    position.h + "%";


    journal.appendChild(img);


    const active = {

        element: img,

        src: src,

        position: position

    };


    activePhotos.push(active);


    /*
       Keep only the last two selections
       in memory.
    */

    recentPhotos.push(src);


    if (
        recentPhotos.length > 2
    ) {

        recentPhotos.shift();

    }


    /*
       Lifetime starts AFTER appearance.
    */

    const lifetime =
    getLifetime();


    setTimeout(() => {

        img.remove();


        activePhotos =
        activePhotos.filter(
            item =>
            item !== active
        );

    }, lifetime);


    return true;

}


/* =========================================================
   INITIAL SCREEN
========================================================= */

async function fillInitialScreen() {

    const r =
    Math.random();


    /*
       1 giant/large photo:
       55%

       2 photos:
       42%

       3 photos:
       3%
    */

    let target;


    if (r < 0.55) {

        target = 1;

    }

    else if (r < 0.97) {

        target = 2;

    }

    else {

        target = 3;

    }


    for (
        let i = 0;
        i < target;
        i++
    ) {

        await spawnPhoto(
            i === 2
        );

    }


    previousBatchSize =
    target;

}


/* =========================================================
   DETERMINE EVENT
========================================================= */

function determineBatchSize() {

    const count =
    activePhotos.length;


    /*
       Empty screen:
       immediately refill.
    */

    if (count === 0) {

        const r =
        Math.random();


        if (
            r < TRIPLE_CHANCE
        ) {

            return 3;

        }


        if (
            r < 0.62
        ) {

            return 2;

        }


        return 1;

    }


    /*
       One photo currently visible.
    */

    if (count === 1) {

        let doubleChance =
        DOUBLE_CHANCE;


        let tripleChance =
        TRIPLE_CHANCE;


        /*
           Don't constantly repeat
           the same batch pattern.
        */

        if (
            previousBatchSize === 2
        ) {

            doubleChance *= 0.40;

        }


        if (
            previousBatchSize === 3
        ) {

            doubleChance *= 0.25;
            tripleChance *= 0.20;

        }


        const r =
        Math.random();


        /*
           Occasionally add two photos
           simultaneously.
        */

        if (
            r < tripleChance
        ) {

            return 2;

        }


        if (
            r <
            tripleChance +
            doubleChance
        ) {

            return 2;

        }


        /*
           Sometimes do nothing and let
           the current image breathe.
        */

        if (r < 0.15) {

            return 0;

        }


        return 1;

    }


    /*
       Two photos currently visible.

       Usually add one.
       Sometimes wait.
    */

    if (count === 2) {

        if (
            Math.random() < 0.62
        ) {

            return 1;

        }


        return 0;

    }


    /*
       Three photos:
       never add another.
    */

    return 0;

}


/* =========================================================
   EVENT
========================================================= */

async function runEvent() {

    if (loading) {
        return;
    }


    loading = true;


    let amount =
    determineBatchSize();


    amount =
    Math.min(
        amount,
        MAX_PHOTOS -
        activePhotos.length
    );


    /*
       Prepare simultaneous photos
       at the same time.

       Each one still gets its own
       position, size and lifetime.
    */

    const tasks = [];


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const isThird =
        activePhotos.length + i >= 2;


        tasks.push(
            spawnPhoto(isThird)
        );

    }


    await Promise.all(tasks);


    previousBatchSize =
    amount;


    loading = false;

}


/* =========================================================
   SCHEDULER
========================================================= */

function scheduleNextEvent() {

    const mobile =
    window.innerWidth < 600;


    const delay =
    mobile

    ? random(
        MOBILE_MIN_DELAY,
        MOBILE_MAX_DELAY
    )

    : random(
        DESKTOP_MIN_DELAY,
        DESKTOP_MAX_DELAY
    );


    setTimeout(async () => {


        /*
           Never allow the page to remain
           blank for long.
        */

        if (
            activePhotos.length === 0
        ) {

            await fillInitialScreen();

        }

        else {

            await runEvent();

        }


        scheduleNextEvent();


    }, delay);

}


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreenButton =
document.getElementById(
    "fullscreen"
);


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                .requestFullscreen();

            }

            else {

                await document.exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen unavailable:",
                error
            );

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPhotos();

</script>

</body>
</html>
