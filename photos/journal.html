<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #ffffff;

    touch-action: none;
}

#journal {
    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}


/* =========================================================
   PHOTOS
========================================================= */

.photo {

    position: absolute;

    display: block;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;
}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

#fullscreen {

    position: fixed;

    top: 12px;
    right: 12px;

    width: 28px;
    height: 28px;

    padding: 0;

    border: 0;

    background: transparent;

    opacity: 0.06;

    z-index: 9999;

    cursor: pointer;
}

#fullscreen:hover {

    opacity: 0.20;
}

#fullscreen svg {

    width: 18px;
    height: 18px;
}

:fullscreen #fullscreen {

    opacity: 0;
}

</style>

</head>


<body>


<div id="journal"></div>


<button id="fullscreen">

    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.5">

        <path d="M4 9V4h5"/>
        <path d="M20 9V4h-5"/>
        <path d="M4 15v5h5"/>
        <path d="M20 15v5h-5"/>

    </svg>

</button>


<script>


/* =========================================================
   GITHUB
========================================================= */

const API =
    "https://api.github.com/repos/" +
    "guillaumelupin/" +
    "guillaumelupin.github.io/" +
    "contents/photos/journal?ref=main";


/* =========================================================
   GENERAL LIMITS
========================================================= */

const MAX_PHOTOS = 3;


/*
   Every 3–6 seconds the program
   makes a new decision.
*/

const MIN_ROLL = 3000;
const MAX_ROLL = 6000;


/*
   Usually something happens.

   But not every roll must create a photo.
*/

const GENERATE_CHANCE = 0.90;


/* =========================================================
   NUMBER OF NEW PHOTOS
========================================================= */


/*
   When there is ONE photo:

   Usually one new photo,
   sometimes two arrive together.

   This prevents the predictable
   "one then one then one" feeling.
*/

const ONE_TO_TWO_CHANCE = 0.32;


/*
   When there are TWO photos:

   Sometimes one new photo appears,
   occasionally a third appears.

   Sometimes nothing happens.
*/

const TWO_TO_THREE_CHANCE = 0.14;

const TWO_TO_ONE_CHANCE = 0.34;


/*
   When there are THREE photos:

   We cannot add another one,
   so the roll can simply do nothing.

   Existing photos disappear independently.
*/


/* =========================================================
   OVERLAP
========================================================= */


/*
   Normal behaviour:

   NO overlap.

   The system actively searches for
   empty space.
*/


const SECOND_OVERLAP_CHANCE = 0.025;

const THIRD_OVERLAP_CHANCE = 0.10;


/*
   Extremely rare event.
*/

const RARE_OVERLAP_CHANCE = 0.003;


/*
   Even when overlap happens, it remains small
   unless the third-photo composition allows it.
*/

const MAX_NORMAL_OVERLAP = 0.06;

const MAX_THIRD_OVERLAP = 0.12;


/* =========================================================
   PHOTO LIFETIME
========================================================= */


/*
   Normal lifetime:

   5–10 seconds.
*/

const NORMAL_MIN = 5000;
const NORMAL_MAX = 10000;


/*
   Rare longer appearances.
*/

const LONG_CHANCE = 0.045;

const LONG_MIN = 10000;
const LONG_MAX = 15000;


/*
   Very rare "special" appearance.

   Like a shiny.
*/

const VERY_LONG_CHANCE = 0.008;

const VERY_LONG_MIN = 15000;
const VERY_LONG_MAX = 20000;


/* =========================================================
   PHOTO MEMORY
========================================================= */

const viewCount = new Map();

let recent = [];

let displayedSinceCheck = 0;


/*
   The forced check happens roughly
   every 35–45 displayed photos.
*/

const MIN_FORCED_CHECK = 35;
const MAX_FORCED_CHECK = 45;

let nextForcedCheck =
    randomInt(
        MIN_FORCED_CHECK,
        MAX_FORCED_CHECK
    );


/* =========================================================
   VARIABLES
========================================================= */

let photos = [];

let active = [];


/* =========================================================
   RANDOM
========================================================= */

function random(min, max) {

    return Math.random() *
        (max - min) + min;

}


function randomInt(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* =========================================================
   LOAD INDIVIDUAL IMAGE
========================================================= */

function loadImage(src) {

    return new Promise(resolve => {

        const image =
            new Image();


        image.onload = () => {

            resolve(image);

        };


        image.onerror = () => {

            /*
               IMPORTANT:

               We do NOT remove the photo
               from the archive.

               It can be retried later.
            */

            resolve(null);

        };


        image.src = src;

    });

}


/* =========================================================
   LOAD ALL PHOTOS FROM GITHUB
========================================================= */

async function loadPhotos() {

    try {

        const response =
            await fetch(API);


        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }


        const files =
            await response.json();


        photos = files

            .filter(file =>

                file.type === "file" &&

                /\.(jpg|jpeg|png|webp|gif)$/i
                    .test(file.name)

            )

            .map(file =>

                "https://raw.githubusercontent.com/" +
                "guillaumelupin/" +
                "guillaumelupin.github.io/" +
                "main/photos/journal/" +
                encodeURIComponent(
                    file.name
                )

            );


        /*
           Initialise memory.
        */

        for (
            const src of photos
        ) {

            viewCount.set(
                src,
                0
            );

        }


        console.log(
            "Journal:",
            photos.length,
            "photos found."
        );


        /*
           Create the initial composition.
        */

        await createInitialComposition();


        /*
           Start the random decision system.
        */

        roll();

    }

    catch (error) {

        console.error(
            "Journal error:",
            error
        );

    }

}


/* =========================================================
   CHOOSE PHOTO
========================================================= */

function choosePhoto() {


    if (
        photos.length === 0
    ) {

        return null;

    }


    /* =====================================================
       FORCED ARCHIVE ROTATION
    ===================================================== */


    if (
        displayedSinceCheck >=
        nextForcedCheck
    ) {


        /*
           First priority:
           photos never seen.
        */

        const unseen =
            photos.filter(
                src =>
                    (viewCount.get(src) || 0)
                    === 0
            );


        if (
            unseen.length > 0
        ) {

            return unseen[
                randomInt(
                    0,
                    unseen.length - 1
                )
            ];

        }


        /*
           If everything has been seen,
           find the least-viewed images.
        */

        let minimum =
            Infinity;


        for (
            const src of photos
        ) {

            const count =
                viewCount.get(src) || 0;


            if (
                count < minimum
            ) {

                minimum = count;

            }

        }


        const leastSeen =
            photos.filter(
                src =>
                    (viewCount.get(src) || 0)
                    === minimum
            );


        if (
            leastSeen.length > 0
        ) {

            return leastSeen[
                randomInt(
                    0,
                    leastSeen.length - 1
                )
            ];

        }

    }


    /* =====================================================
       NORMAL WEIGHTED RANDOM
    ===================================================== */


    const pool = [];


    for (
        const src of photos
    ) {


        let weight = 100;


        const count =
            viewCount.get(src) || 0;


        /*
           Never-seen photos are slightly favoured.
        */

        if (
            count === 0
        ) {

            weight = 180;

        }


        /*
           Never allow the same photo
           three times consecutively.
        */

        if (

            recent.length >= 2 &&

            recent[
                recent.length - 1
            ] === src &&

            recent[
                recent.length - 2
            ] === src

        ) {

            weight = 0;

        }


        /*
           Same photo twice in a row
           is possible but rare.
        */

        else if (

            recent.length >= 1 &&

            recent[
                recent.length - 1
            ] === src

        ) {

            weight *= 0.08;

        }


        /*
           Recent photos are discouraged.
        */

        else if (

            recent.length >= 2 &&

            recent[
                recent.length - 2
            ] === src

        ) {

            weight *= 0.30;

        }


        /*
           Photos that have appeared many times
           slowly become less likely.
        */

        if (
            count > 0
        ) {

            weight *=
                1 /
                Math.sqrt(count);

        }


        for (
            let i = 0;
            i < Math.max(
                0,
                Math.round(weight)
            );
            i++
        ) {

            pool.push(src);

        }

    }


    if (
        pool.length === 0
    ) {

        return photos[
            randomInt(
                0,
                photos.length - 1
            )
        ];

    }


    return pool[
        randomInt(
            0,
            pool.length - 1
        )
    ];

}


/* =========================================================
   SIZE
========================================================= */

function getSize(
    numberOfPhotos
) {

    const mobile =
        window.innerWidth < 600;


    /*
       Three photos must remain relatively small.
    */

    if (
        numberOfPhotos >= 3
    ) {

        return {

            w: mobile
                ? random(25, 40)
                : random(22, 38),

            h: mobile
                ? random(26, 42)
                : random(23, 40)

        };

    }


    /*
       Large images dominate the journal.

       88% chance of a large image.
    */

    if (
        Math.random() < 0.88
    ) {

        return {

            w: mobile
                ? random(54, 84)
                : random(44, 72),

            h: mobile
                ? random(54, 82)
                : random(44, 75)

        };

    }


    /*
       Occasional medium image.
    */

    return {

        w: mobile
            ? random(42, 60)
            : random(34, 52),

        h: mobile
            ? random(42, 60)
            : random(35, 54)

    };

}


/* =========================================================
   RECTANGLE INTERSECTION
========================================================= */

function intersection(a, b) {

    const x =
        Math.max(
            0,
            Math.min(
                a.x + a.w,
                b.x + b.w
            ) -
            Math.max(
                a.x,
                b.x
            )
        );


    const y =
        Math.max(
            0,
            Math.min(
                a.y + a.h,
                b.y + b.h
            ) -
            Math.max(
                a.y,
                b.y
            )
        );


    return x * y;

}


/* =========================================================
   FIND POSITION
========================================================= */

function findPosition(
    w,
    h,
    overlapChance,
    isThirdPhoto
) {


    /*
       Extremely rare overlap event.
    */

    if (
        Math.random() <
        RARE_OVERLAP_CHANCE
    ) {

        overlapChance = 1;

    }


    const wantsOverlap =
        Math.random() <
        overlapChance;


    let best =
        null;

    let bestOverlap =
        Infinity;


    /*
       Search a LOT of positions.

       This is what makes the images
       conscious of one another.
    */

    for (
        let i = 0;
        i < 2000;
        i++
    ) {


        const candidate = {

            x: random(
                2,
                98 - w
            ),

            y: random(
                2,
                98 - h
            ),

            w: w,

            h: h

        };


        let totalOverlap = 0;


        /*
           Compare against EVERY
           currently visible photo.
        */

        for (
            const item of active
        ) {

            totalOverlap +=
                intersection(
                    candidate,
                    item.position
                );

        }


        const area =
            w * h;


        const ratio =
            totalOverlap /
            area;


        /* =================================================
           NORMAL CASE
        ================================================= */

        if (!wantsOverlap) {


            /*
               Perfectly free space.
            */

            if (
                totalOverlap === 0
            ) {

                return candidate;

            }


            /*
               Remember the safest position.
            */

            if (
                ratio <
                bestOverlap
            ) {

                bestOverlap =
                    ratio;

                best =
                    candidate;

            }

        }


        /* =================================================
           RARE OVERLAP CASE
        ================================================= */

        else {


            const maximum =
                isThirdPhoto
                    ? MAX_THIRD_OVERLAP
                    : MAX_NORMAL_OVERLAP;


            /*
               Even when overlap is requested,
               don't allow a giant collision.
            */

            if (

                ratio > 0 &&

                ratio <= maximum

            ) {

                return candidate;

            }

        }

    }


    /*
       If a free location was not found,
       use the safest location.

       We do NOT deliberately pile images
       on top of one another.
    */

    if (
        best &&
        bestOverlap < 0.04
    ) {

        return best;

    }


    /*
       Final search for the absolute safest
       position.
    */

    let safest =
        null;

    let safestOverlap =
        Infinity;


    for (
        let i = 0;
        i < 1000;
        i++
    ) {


        const candidate = {

            x: random(
                2,
                98 - w
            ),

            y: random(
                2,
                98 - h
            ),

            w: w,

            h: h

        };


        let totalOverlap = 0;


        for (
            const item of active
        ) {

            totalOverlap +=
                intersection(
                    candidate,
                    item.position
                );

        }


        const ratio =
            totalOverlap /
            (w * h);


        if (
            ratio <
            safestOverlap
        ) {

            safestOverlap =
                ratio;

            safest =
                candidate;

        }

    }


    return safest;

}


/* =========================================================
   LIFETIME
========================================================= */

function getLifetime() {


    /*
       Very rare 15–20 second photo.
    */

    if (
        Math.random() <
        VERY_LONG_CHANCE
    ) {

        return random(
            VERY_LONG_MIN,
            VERY_LONG_MAX
        );

    }


    /*
       Rare 10–15 second photo.
    */

    if (
        Math.random() <
        LONG_CHANCE
    ) {

        return random(
            LONG_MIN,
            LONG_MAX
        );

    }


    /*
       Normal 5–10 seconds.
    */

    return random(
        NORMAL_MIN,
        NORMAL_MAX
    );

}


/* =========================================================
   ADD PHOTO
========================================================= */

async function addPhoto(
    overlapChance = 0,
    isThirdPhoto = false
) {


    /*
       Absolute limit.
    */

    if (
        active.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const src =
        choosePhoto();


    if (!src) {

        return false;

    }


    /*
       IMPORTANT:

       Load the entire image BEFORE
       putting it on the screen.
    */

    const loaded =
        await loadImage(src);


    /*
       If it fails, leave it in the
       archive and try again later.
    */

    if (!loaded) {

        return false;

    }


    /*
       Determine size AFTER loading.
    */

    const size =
        getSize(
            active.length + 1
        );


    /*
       Find a location that considers
       ALL existing photos.
    */

    const position =
        findPosition(
            size.w,
            size.h,
            overlapChance,
            isThirdPhoto
        );


    const img =
        document.createElement("img");


    img.className =
        "photo";


    img.src =
        loaded.src;


    img.draggable =
        false;


    img.style.left =
        position.x + "%";


    img.style.top =
        position.y + "%";


    img.style.width =
        position.w + "%";


    img.style.height =
        position.h + "%";


    journal.appendChild(img);


    const item = {

        element: img,

        src: src,

        position: position

    };


    active.push(item);


    /* =====================================================
       MEMORY
    ===================================================== */


    const count =
        viewCount.get(src) || 0;


    viewCount.set(
        src,
        count + 1
    );


    displayedSinceCheck++;


    recent.push(src);


    if (
        recent.length > 3
    ) {

        recent.shift();

    }


    /*
       Reset forced-rotation counter.
    */

    if (
        displayedSinceCheck >=
        nextForcedCheck
    ) {

        displayedSinceCheck = 0;


        nextForcedCheck =
            randomInt(
                MIN_FORCED_CHECK,
                MAX_FORCED_CHECK
            );

    }


    /* =====================================================
       LIFETIME
    ===================================================== */


    const lifetime =
        getLifetime();


    setTimeout(() => {


        img.remove();


        active =
            active.filter(
                x =>
                    x !== item
            );


        /*
           IMPORTANT:

           If this was the last image,
           immediately create another one.

           Therefore the page can NEVER
           remain blank.
        */

        if (
            active.length === 0
        ) {

            addPhoto(0);

        }


    }, lifetime);


    return true;

}


/* =========================================================
   INITIAL COMPOSITION
========================================================= */

async function createInitialComposition() {


    /*
       Initial distribution:

       45% → one
       48% → two
       7%  → three
    */

    const r =
        Math.random();


    let amount;


    if (
        r < 0.45
    ) {

        amount = 1;

    }

    else if (
        r < 0.93
    ) {

        amount = 2;

    }

    else {

        amount = 3;

    }


    const jobs = [];


    /*
       All selected photos are loaded
       before being displayed.
    */

    for (
        let i = 0;
        i < amount;
        i++
    ) {


        if (
            i === 0
        ) {

            jobs.push(
                addPhoto(
                    0,
                    false
                )
            );

        }

        else if (
            i === 1
        ) {

            jobs.push(
                addPhoto(
                    SECOND_OVERLAP_CHANCE,
                    false
                )
            );

        }

        else {

            jobs.push(
                addPhoto(
                    THIRD_OVERLAP_CHANCE,
                    true
                )
            );

        }

    }


    await Promise.all(
        jobs
    );


    /*
       Safety.
    */

    if (
        active.length === 0
    ) {

        await addPhoto(0);

    }

}


/* =========================================================
   RANDOM DECISION
========================================================= */

function decideGeneration() {


    /*
       =====================================================
       ZERO PHOTOS
       =====================================================
    */

    if (
        active.length === 0
    ) {

        return {

            amount: 1,

            overlap: 0

        };

    }


    /*
       =====================================================
       ONE PHOTO
       =====================================================
    */

    if (
        active.length === 1
    ) {


        /*
           Sometimes two arrive together.

           This is deliberately quite common.
        */

        if (
            Math.random() <
            ONE_TO_TWO_CHANCE
        ) {

            return {

                amount: 2,

                overlap:
                    SECOND_OVERLAP_CHANCE

            };

        }


        /*
           Otherwise one arrives.
        */

        return {

            amount: 1,

            overlap: 0

        };

    }


    /*
       =====================================================
       TWO PHOTOS
       =====================================================
    */

    if (
        active.length === 2
    ) {


        /*
           Sometimes a third appears.
        */

        if (
            Math.random() <
            TWO_TO_THREE_CHANCE
        ) {

            return {

                amount: 1,

                overlap:
                    THIRD_OVERLAP_CHANCE,

                third: true

            };

        }


        /*
           Sometimes nothing is added.

           Existing images can therefore
           remain alone for a while.
        */

        return {

            amount: 0,

            overlap: 0

        };

    }


    /*
       =====================================================
       THREE PHOTOS
       =====================================================

       Cannot add another.
    */

    return {

        amount: 0,

        overlap: 0

    };

}


/* =========================================================
   RANDOM ROLL
========================================================= */

function roll() {


    const delay =
        random(
            MIN_ROLL,
            MAX_ROLL
        );


    setTimeout(
        async () => {


            /*
               =================================================
               DICE #1
               =================================================

               Should something happen?
            */

            const generate =
                Math.random() <
                GENERATE_CHANCE;


            if (!generate) {

                roll();

                return;

            }


            /*
               =================================================
               DICE #2
               =================================================

               How many photos?
            */

            const decision =
                decideGeneration();


            if (
                decision.amount <= 0
            ) {

                roll();

                return;

            }


            /*
               =================================================
               CREATE PHOTOS
               =================================================

               Promise.all means that when two photos
               are selected together, both are loaded
               before either one is displayed.
            */

            const jobs = [];


            for (
                let i = 0;
                i < decision.amount;
                i++
            ) {


                /*
                   When two photos arrive together:

                   Photo #1:
                   independent placement.

                   Photo #2:
                   aware of Photo #1,
                   but normally doesn't overlap.
                */

                if (
                    i === 0
                ) {

                    jobs.push(
                        addPhoto(
                            decision.overlap,
                            decision.third === true
                        )
                    );

                }

                else {

                    jobs.push(
                        addPhoto(
                            decision.overlap,
                            false
                        )
                    );

                }

            }


            await Promise.all(
                jobs
            );


            /*
               Absolute safety:
               never leave a blank page.
            */

            if (
                active.length === 0
            ) {

                await addPhoto(0);

            }


            /*
               Continue the game.
            */

            roll();


        },
        delay
    );

}


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreenButton =
    document.getElementById(
        "fullscreen"
    );


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            }

            else {

                await document.exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPhotos();

</script>

</body>

</html>
