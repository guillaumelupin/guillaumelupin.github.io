<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
}

#journal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.photo {
    position: absolute;
    display: block;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="journal"></div>

<script>

const API =
"https://api.github.com/repos/guillaumelupin/guillaumelupin.github.io/contents/photos/journal?ref=main";

const journal = document.getElementById("journal");

let photos = [];


/* --------------------------------
   LOAD PHOTO LIST
-------------------------------- */

async function loadPhotos() {

    try {

        const response = await fetch(API);

        if (!response.ok) {
            throw new Error("GitHub API error");
        }

        const files = await response.json();

        photos = files
            .filter(file =>
                file.type === "file" &&
                /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
            )
            .map(file => file.download_url);

        if (photos.length > 0) {
            createJournal();
        }

    } catch (error) {

        console.error("Could not load Journal photos:", error);

    }
}


/* --------------------------------
   RANDOM NUMBER
-------------------------------- */

function random(min, max) {
    return Math.random() * (max - min) + min;
}


/* --------------------------------
   SHUFFLE
-------------------------------- */

function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}


/* --------------------------------
   CREATE JOURNAL
-------------------------------- */

function createJournal() {

    if (photos.length === 0) {
        return;
    }

    journal.innerHTML = "";


    /* 1, 2 or 3 photos */

    const count =
        Math.floor(Math.random() * 3) + 1;


    /* Select random photos */

    const selected =
        shuffle(photos).slice(0, count);


    /*
       Generate positions randomly.
       We keep trying until the photos
       don't overlap.
    */

    const positions = [];

    selected.forEach((src, index) => {

        const img = document.createElement("img");

        img.className = "photo";
        img.src = src;
        img.draggable = false;

        let x;
        let y;
        let w;
        let h;

        let valid = false;
        let attempts = 0;


        while (!valid && attempts < 100) {

            attempts++;


            /* Random size */

            if (count === 1) {

                w = random(45, 75);
                h = random(45, 80);

            } else if (count === 2) {

                w = random(25, 55);
                h = random(25, 60);

            } else {

                w = random(20, 42);
                h = random(20, 50);

            }


            /* Random position */

            x = random(2, 98 - w);
            y = random(2, 98 - h);


            valid = true;


            /* Check overlap */

            for (const p of positions) {

                const gap = 2;

                const overlap =
                    x < p.x + p.w + gap &&
                    x + w + gap > p.x &&
                    y < p.y + p.h + gap &&
                    y + h + gap > p.y;

                if (overlap) {
                    valid = false;
                    break;
                }
            }

        }


        positions.push({
            x: x,
            y: y,
            w: w,
            h: h
        });


        img.style.left = x + "%";
        img.style.top = y + "%";
        img.style.width = w + "%";
        img.style.height = h + "%";


        journal.appendChild(img);

    });

}


/* --------------------------------
   INITIAL LOAD
-------------------------------- */

loadPhotos();


/* --------------------------------
   NEW COMPOSITION EVERY 5 SECONDS
-------------------------------- */

setInterval(() => {

    createJournal();

}, 5000);

</script>

</body>
</html>
