<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
}

#journal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.photo {
    position: absolute;
    display: block;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

#fullscreen {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    opacity: 0.06;
    z-index: 9999;
    cursor: pointer;
}

#fullscreen:hover {
    opacity: 0.20;
}

#fullscreen svg {
    width: 18px;
    height: 18px;
}

:fullscreen #fullscreen {
    opacity: 0;
}

</style>

</head>


<body>

<div id="journal"></div>

<button id="fullscreen">

<svg viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5">

    <path d="M4 9V4h5"/>
    <path d="M20 9V4h-5"/>
    <path d="M4 15v5h5"/>
    <path d="M20 15v5h-5"/>

</svg>

</button>


<script>


/* =========================================================
   GITHUB
========================================================= */

const API =
"https://api.github.com/repos/" +
"guillaumelupin/" +
"guillaumelupin.github.io/" +
"contents/photos/journal?ref=main";


/* =========================================================
   BASIC SETTINGS
========================================================= */

const MAX_PHOTOS = 3;


/*
   Every 3–6 seconds the program
   throws the dice again.
*/

const MIN_ROLL_DELAY = 3000;
const MAX_ROLL_DELAY = 6000;


/* =========================================================
   PHOTO LIFETIME
========================================================= */

const MIN_LIFETIME = 4200;
const MAX_LIFETIME = 9000;


/*
   Rare long stay.
*/

const LONG_LIFETIME_CHANCE = 0.045;


/*
   Very rare exceptional stay.
*/

const VERY_LONG_LIFETIME_CHANCE = 0.008;


/* =========================================================
   GENERATION
========================================================= */

/*
   Chance that a roll actually creates
   something.

   This is deliberately high enough to
   keep the journal alive.
*/

const GENERATE_CHANCE = 0.82;


/* =========================================================
   NUMBER OF PHOTOS
========================================================= */

/*
   Base probabilities when there is
   enough room.

   1 = dominant
   2 = common
   3 = rare
*/

const ONE_PHOTO_CHANCE = 0.58;
const TWO_PHOTO_CHANCE = 0.34;
const THREE_PHOTO_CHANCE = 0.08;


/* =========================================================
   OVERLAP
========================================================= */

/*
   Second photo.
*/

const SECOND_OVERLAP_CHANCE = 0.07;


/*
   Third photo.
*/

const THIRD_OVERLAP_CHANCE = 0.30;


/*
   Extremely rare special case.
*/

const RARE_OVERLAP_CHANCE = 0.004;


/* =========================================================
   COMPOSITION GUARD
========================================================= */

/*
   Maximum percentage of the screen that
   active photos should occupy collectively.

   This is the main anti-chaos mechanism.
*/

const MAX_TOTAL_AREA = 0.82;


/*
   If the screen is already this dense,
   do not generate another photo.
*/

const DENSE_SCREEN = 0.70;


/*
   Minimum amount of free area required
   before attempting a new large image.
*/

const MIN_FREE_AREA = 0.16;


/*
   How many attempts are made to find
   a good position.
*/

const POSITION_ATTEMPTS = 500;


/* =========================================================
   VARIABLES
========================================================= */

const journal =
document.getElementById("journal");

let allPhotos = [];

let activePhotos = [];

let recentPhotos = [];


/* =========================================================
   RANDOM
========================================================= */

function random(min, max) {

    return Math.random() *
        (max - min) + min;

}


function randomInt(min, max) {

    return Math.floor(
        random(min, max + 1)
    );

}


/* =========================================================
   PRELOAD
========================================================= */

function preloadImage(src) {

    return new Promise(resolve => {

        const img = new Image();

        img.onload = () => {

            resolve(img);

        };

        img.onerror = () => {

            /*
               Do NOT remove the image
               from GitHub or from our list.

               It can be tried again later.
            */

            resolve(null);

        };

        img.src = src;

    });

}


/* =========================================================
   LOAD GITHUB FOLDER
========================================================= */

async function loadPhotos() {

    try {

        const response =
            await fetch(API);

        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }

        const files =
            await response.json();


        allPhotos = files

            .filter(file =>

                file.type === "file" &&

                /\.(jpg|jpeg|png|webp|gif)$/i
                    .test(file.name)

            )

            .map(file =>

                "https://raw.githubusercontent.com/" +
                "guillaumelupin/" +
                "guillaumelupin.github.io/" +
                "main/photos/journal/" +
                encodeURIComponent(file.name)

            );


        await createInitialComposition();

        scheduleRoll();

    }

    catch (error) {

        console.error(
            "Journal:",
            error
        );

    }

}


/* =========================================================
   PHOTO SELECTION
========================================================= */

function choosePhoto() {

    if (!allPhotos.length) {

        return null;

    }


    const pool = [];


    for (
        const src of allPhotos
    ) {

        let weight = 100;


        /*
           Never allow the same photo
           three times consecutively.
        */

        if (

            recentPhotos.length >= 2 &&

            recentPhotos[
                recentPhotos.length - 1
            ] === src &&

            recentPhotos[
                recentPhotos.length - 2
            ] === src

        ) {

            weight = 0;

        }


        /*
           Same as immediately previous:
           possible, but rare.
        */

        else if (

            recentPhotos.length >= 1 &&

            recentPhotos[
                recentPhotos.length - 1
            ] === src

        ) {

            weight = 8;

        }


        /*
           Same as second previous:
           discouraged.
        */

        else if (

            recentPhotos.length >= 2 &&

            recentPhotos[
                recentPhotos.length - 2
            ] === src

        ) {

            weight = 30;

        }


        for (
            let i = 0;
            i < weight;
            i++
        ) {

            pool.push(src);

        }

    }


    if (!pool.length) {

        return allPhotos[
            randomInt(
                0,
                allPhotos.length - 1
            )
        ];

    }


    return pool[
        randomInt(
            0,
            pool.length - 1
        )
    ];

}


/* =========================================================
   AREA CALCULATION
========================================================= */

function getUsedArea() {

    let area = 0;


    for (
        const item of activePhotos
    ) {

        area +=
            (item.position.w / 100) *
            (item.position.h / 100);

    }


    return area;

}


/*
   Approximate free area.
*/

function getFreeArea() {

    return Math.max(
        0,
        1 - getUsedArea()
    );

}


/* =========================================================
   RECTANGLE OVERLAP
========================================================= */

function overlapAmount(a, b) {

    const left =
        Math.max(
            a.x,
            b.x
        );

    const right =
        Math.min(
            a.x + a.w,
            b.x + b.w
        );

    const top =
        Math.max(
            a.y,
            b.y
        );

    const bottom =
        Math.min(
            a.y + a.h,
            b.y + b.h
        );


    if (
        right <= left ||
        bottom <= top
    ) {

        return 0;

    }


    return (
        (right - left) *
        (bottom - top)
    );

}


/* =========================================================
   TOTAL OVERLAP
========================================================= */

function getOverlapRatio(position) {

    let overlap = 0;


    for (
        const active of activePhotos
    ) {

        overlap +=
            overlapAmount(
                position,
                active.position
            );

    }


    const area =
        position.w *
        position.h;


    if (area <= 0) {

        return 1;

    }


    return overlap / area;

}


/* =========================================================
   SIZE
========================================================= */

function getPhotoSize(
    futurePhotoNumber
) {

    const mobile =
        window.innerWidth < 600;


    /*
       If this will be the THIRD photo,
       keep it smaller.
    */

    if (
        futurePhotoNumber >= 3
    ) {

        return {

            width: mobile
                ? random(24, 38)
                : random(21, 36),

            height: mobile
                ? random(24, 40)
                : random(22, 38)

        };

    }


    /*
       Main philosophy:

       LARGE photos are dominant.

       88% of normal additions are
       medium-large / large.
    */

    if (
        Math.random() < 0.88
    ) {

        return {

            width: mobile
                ? random(55, 82)
                : random(43, 70),

            height: mobile
                ? random(53, 80)
                : random(43, 74)

        };

    }


    /*
       Occasional smaller image.
    */

    return {

        width: mobile
            ? random(40, 58)
            : random(33, 50),

        height: mobile
            ? random(40, 58)
            : random(34, 53)

    };

}


/* =========================================================
   POSITION
========================================================= */

function findPosition(
    width,
    height,
    overlapChance
) {


    /*
       Rare exceptional overlap.
    */

    if (
        Math.random() <
        RARE_OVERLAP_CHANCE
    ) {

        overlapChance = 0.20;

    }


    /*
       Decide whether this particular
       photo is allowed to overlap.
    */

    const wantsOverlap =
        Math.random() <
        overlapChance;


    let bestPosition = null;

    let bestScore = Infinity;


    for (
        let attempt = 0;
        attempt < POSITION_ATTEMPTS;
        attempt++
    ) {


        const position = {

            x: random(
                2,
                98 - width
            ),

            y: random(
                2,
                98 - height
            ),

            w: width,

            h: height

        };


        const overlap =
            getOverlapRatio(
                position
            );


        /*
           -------------------------------------------------
           NO OVERLAP MODE
           -------------------------------------------------
        */

        if (!wantsOverlap) {


            /*
               Completely clean position.
            */

            if (
                overlap < 0.001
            ) {

                return position;

            }


            /*
               Keep the least overlapping
               candidate as fallback.
            */

            if (
                overlap < bestScore
            ) {

                bestScore = overlap;

                bestPosition =
                    position;

            }

        }


        /*
           -------------------------------------------------
           OVERLAP MODE
           -------------------------------------------------
        */

        else {


            /*
               We still don't want massive
               overlap.

               The photo may touch another
               image, but shouldn't swallow it.
            */

            if (
                overlap >= 0.01 &&
                overlap <= 0.22
            ) {

                return position;

            }

        }

    }


    /*
       If clean positioning failed,
       only allow a fallback if the overlap
       is still modest.
    */

    if (
        bestPosition &&
        bestScore < 0.08
    ) {

        return bestPosition;

    }


    return null;

}


/* =========================================================
   LIFETIME
========================================================= */

function getLifetime() {


    /*
       Very rare:
       15–20 seconds.
    */

    if (
        Math.random() <
        VERY_LONG_LIFETIME_CHANCE
    ) {

        return random(
            15000,
            20000
        );

    }


    /*
       Rare:
       9–15 seconds.
    */

    if (
        Math.random() <
        LONG_LIFETIME_CHANCE
    ) {

        return random(
            9000,
            15000
        );

    }


    /*
       Normal:

       4.2–9 seconds.
    */

    return random(
        MIN_LIFETIME,
        MAX_LIFETIME
    );

}


/* =========================================================
   ADD PHOTO
========================================================= */

async function addPhoto(
    overlapChance = 0,
    forcedSize = null
) {


    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    /*
       -----------------------------------------------------
       DENSITY GUARD
       -----------------------------------------------------
    */

    const currentArea =
        getUsedArea();


    /*
       If already very dense,
       do not force another photo.
    */

    if (
        currentArea >=
        DENSE_SCREEN
    ) {

        return false;

    }


    const src =
        choosePhoto();


    if (!src) {

        return false;

    }


    /*
       LOAD FIRST.
    */

    const loaded =
        await preloadImage(src);


    /*
       Failed image is not removed.
       The system simply tries again
       at a later roll.
    */

    if (!loaded) {

        return false;

    }


    const futureNumber =
        activePhotos.length + 1;


    const size =
        forcedSize ||
        getPhotoSize(
            futureNumber
        );


    /*
       Area check.
    */

    const candidateArea =
        (size.width / 100) *
        (size.height / 100);


    if (

        futureNumber > 1 &&

        currentArea +
        candidateArea >
        MAX_TOTAL_AREA

    ) {

        return false;

    }


    /*
       If there isn't enough free space,
       don't force the image.
    */

    if (

        futureNumber > 1 &&

        getFreeArea() <
        MIN_FREE_AREA

    ) {

        return false;

    }


    /*
       Find intelligent position.
    */

    const position =
        findPosition(
            size.width,
            size.height,
            overlapChance
        );


    /*
       No suitable position:
       do nothing.
    */

    if (!position) {

        return false;

    }


    /*
       -----------------------------------------------------
       DISPLAY
       -----------------------------------------------------
    */

    const img =
        document.createElement("img");


    img.className =
        "photo";


    img.src =
        loaded.src;


    img.draggable =
        false;


    img.style.left =
        position.x + "%";


    img.style.top =
        position.y + "%";


    img.style.width =
        position.w + "%";


    img.style.height =
        position.h + "%";


    journal.appendChild(img);


    const item = {

        element: img,

        src: src,

        position: position

    };


    activePhotos.push(item);


    /*
       Remember the image.
    */

    recentPhotos.push(src);


    if (
        recentPhotos.length > 3
    ) {

        recentPhotos.shift();

    }


    /*
       TIMER STARTS AFTER DISPLAY.
    */

    const lifetime =
        getLifetime();


    setTimeout(() => {


        img.remove();


        activePhotos =
            activePhotos.filter(
                photo =>
                    photo !== item
            );


        /*
           Absolute rule:
           NEVER leave a completely
           blank screen.
        */

        if (
            activePhotos.length === 0
        ) {

            addPhoto();

        }


    }, lifetime);


    return true;

}


/* =========================================================
   INITIAL COMPOSITION
========================================================= */

async function createInitialComposition() {


    /*
       Initial screen:

       58% = one
       39% = two
       3%  = three
    */

    const r =
        Math.random();


    let amount;


    if (r < 0.58) {

        amount = 1;

    }

    else if (r < 0.97) {

        amount = 2;

    }

    else {

        amount = 3;

    }


    /*
       Try to create them simultaneously.
    */

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        if (
            i === 0
        ) {

            await addPhoto(0);

        }

        else if (
            i === 1
        ) {

            await addPhoto(
                SECOND_OVERLAP_CHANCE
            );

        }

        else {

            await addPhoto(
                THIRD_OVERLAP_CHANCE
            );

        }

    }


    /*
       Safety.
    */

    if (
        activePhotos.length === 0
    ) {

        await addPhoto();

    }

}


/* =========================================================
   DECIDE NUMBER OF PHOTOS
========================================================= */

function decideNumberToGenerate() {


    const available =
        MAX_PHOTOS -
        activePhotos.length;


    if (
        available <= 0
    ) {

        return 0;

    }


    /*
       Current density influences
       the result.

       The more occupied the screen,
       the more conservative the dice.
    */

    const density =
        getUsedArea();


    /*
       -----------------------------------------------------
       0 PHOTO CURRENTLY
       -----------------------------------------------------

       Strong preference for ONE large image.
    */

    if (
        activePhotos.length === 0
    ) {

        return 1;

    }


    /*
       -----------------------------------------------------
       1 PHOTO CURRENTLY
       -----------------------------------------------------
    */

    if (
        activePhotos.length === 1
    ) {


        /*
           If the current image is already
           very large, favor ONE new photo
           rather than trying to create chaos.
        */

        if (
            density > 0.45
        ) {

            return 1;

        }


        const r =
            Math.random();


        /*
           30% → two new photos

           This is deliberately possible.
        */

        if (
            r < 0.30
        ) {

            return Math.min(
                2,
                available
            );

        }


        /*
           5% → exceptionally try
           three total additions.

           Usually the guard will limit it.
        */

        if (
            r < 0.35
        ) {

            return Math.min(
                2,
                available
            );

        }


        return 1;

    }


    /*
       -----------------------------------------------------
       2 PHOTOS CURRENTLY
       -----------------------------------------------------
    */

    if (
        activePhotos.length === 2
    ) {


        /*
           Only 10% chance of trying
           for a third.
        */

        if (
            Math.random() < 0.10
        ) {

            return 1;

        }


        /*
           Otherwise don't add.
        */

        return 0;

    }


    /*
       Already three.
    */

    return 0;

}


/* =========================================================
   DICE ROLL
========================================================= */

async function rollDice() {


    /*
       Wait 3–6 seconds.
    */

    const delay =
        random(
            MIN_ROLL_DELAY,
            MAX_ROLL_DELAY
        );


    setTimeout(
        async () => {


            /*
               =============================================
               DICE #1
               =============================================
            */

            const shouldGenerate =
                Math.random() <
                GENERATE_CHANCE;


            if (
                !shouldGenerate
            ) {

                /*
                   Nothing happens.

                   Existing photos continue
                   living independently.
                */

                rollDice();

                return;

            }


            /*
               =============================================
               DICE #2
               =============================================
            */

            const number =
                decideNumberToGenerate();


            if (
                number <= 0
            ) {

                rollDice();

                return;

            }


            /*
               =============================================
               DICE #3
               =============================================

               Each requested photo is generated
               independently.

               They are still subject to the
               composition guard.
            */

            const tasks = [];


            for (
                let i = 0;
                i < number;
                i++
            ) {


                /*
                   First photo:
                   clean.
                */

                if (
                    i === 0
                ) {

                    tasks.push(
                        addPhoto(0)
                    );

                }


                /*
                   Second photo:
                   7% overlap.
                */

                else if (
                    i === 1
                ) {

                    tasks.push(
                        addPhoto(
                            SECOND_OVERLAP_CHANCE
                        )
                    );

                }


                /*
                   Third photo:
                   30% overlap.
                */

                else {

                    tasks.push(
                        addPhoto(
                            THIRD_OVERLAP_CHANCE
                        )
                    );

                }

            }


            await Promise.all(tasks);


            /*
               Continue forever.
            */

            rollDice();


        },
        delay
    );

}


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreenButton =
document.getElementById(
    "fullscreen"
);


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            }

            else {

                await document.exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPhotos();

</script>

</body>

</html>
