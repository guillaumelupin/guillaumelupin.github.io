<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
}

#journal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.photo {
    position: absolute;
    display: block;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

</style>
</head>

<body>

<div id="journal"></div>

<script>

const GITHUB_API =
    "https://api.github.com/repos/guillaumelupin/guillaumelupin.github.io/contents/photos/journal";

const journal = document.getElementById("journal");

let photos = [];
let lastPattern = -1;


/* --------------------------------
   RANDOM
-------------------------------- */

function random(min, max) {
    return Math.random() * (max - min) + min;
}


/* --------------------------------
   SHUFFLE
-------------------------------- */

function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}


/* --------------------------------
   PATTERNS
-------------------------------- */

const patterns = [

/* ===== ONE PHOTO ===== */

[
    { x: 8,  y: 8,  w: 55, h: 55 }
],

[
    { x: 35, y: 5,  w: 58, h: 88 }
],

[
    { x: 5,  y: 35, w: 50, h: 55 }
],

[
    { x: 42, y: 15, w: 48, h: 65 }
],

[
    { x: 15, y: 45, w: 65, h: 45 }
],

[
    { x: 2,  y: 5,  w: 45, h: 65 }
],

[
    { x: 48, y: 5, w: 48, h: 55 }
],

[
    { x: 20, y: 8,  w: 75, h: 80 }
],

/* ===== TWO PHOTOS ===== */

[
    { x: 3,  y: 48, w: 45, h: 42 },
    { x: 55, y: 8,  w: 35, h: 35 }
],

[
    { x: 5,  y: 5,  w: 35, h: 38 },
    { x: 35, y: 45, w: 55, h: 45 }
],

[
    { x: 2,  y: 5,  w: 40, h: 80 },
    { x: 55, y: 20, w: 35, h: 40 }
],

[
    { x: 10, y: 15, w: 65, h: 45 },
    { x: 55, y: 65, w: 35, h: 25 }
],

[
    { x: 50, y: 5,  w: 45, h: 40 },
    { x: 5,  y: 45, w: 40, h: 45 }
],

[
    { x: 5,  y: 5,  w: 70, h: 55 },
    { x: 65, y: 60, w: 25, h: 30 }
],

[
    { x: 3,  y: 60, w: 35, h: 30 },
    { x: 35, y: 5,  w: 60, h: 55 }
],

[
    { x: 5,  y: 10, w: 30, h: 35 },
    { x: 45, y: 35, w: 50, h: 55 }
],

[
    { x: 15, y: 5,  w: 35, h: 45 },
    { x: 5,  y: 55, w: 75, h: 35 }
],

[
    { x: 55, y: 5, w: 35, h: 35 },
    { x: 5,  y: 30, w: 55, h: 60 }
],

/* ===== THREE PHOTOS ===== */

[
    { x: 2,  y: 5,  w: 28, h: 35 },
    { x: 35, y: 45, w: 35, h: 45 },
    { x: 70, y: 10, w: 25, h: 30 }
],

[
    { x: 5,  y: 5,  w: 35, h: 30 },
    { x: 50, y: 5, w: 40, h: 50 },
    { x: 10, y: 55, w: 45, h: 35 }
],

[
    { x: 2,  y: 50, w: 30, h: 40 },
    { x: 35, y: 5, w: 60, h: 35 },
    { x: 60, y: 55, w: 35, h: 35 }
],

[
    { x: 5,  y: 5,  w: 25, h: 40 },
    { x: 30, y: 30, w: 40, h: 60 },
    { x: 70, y: 5,  w: 25, h: 30 }
],

[
    { x: 2,  y: 10, w: 45, h: 35 },
    { x: 50, y: 5, w: 45, h: 30 },
    { x: 30, y: 55, w: 45, h: 35 }
],

[
    { x: 5,  y: 55, w: 35, h: 35 },
    { x: 40, y: 5, w: 55, h: 40 },
    { x: 5,  y: 5, w: 25, h: 35 }
],

[
    { x: 5,  y: 5, w: 50, h: 50 },
    { x: 60, y: 5, w: 30, h: 30 },
    { x: 50, y: 60, w: 40, h: 30 }
],

[
    { x: 5,  y: 15, w: 30, h: 70 },
    { x: 40, y: 5, w: 50, h: 30 },
    { x: 55, y: 50, w: 35, h: 35 }
]

];


/* --------------------------------
   GET PHOTOS FROM GITHUB
-------------------------------- */

async function loadPhotos() {

    try {

        const response = await fetch(GITHUB_API);

        const files = await response.json();

        photos = files
            .filter(file =>
                /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
            )
            .map(file => file.download_url);

        createJournal();

    } catch (error) {

        console.error(error);

    }
}


/* --------------------------------
   CREATE JOURNAL
-------------------------------- */

function createJournal() {

    if (photos.length === 0) {
        return;
    }

    journal.innerHTML = "";


    /* Choose 1, 2 or 3 photos */

    const number =
        Math.floor(Math.random() * 3) + 1;


    /* Find patterns with the right number */

    const availablePatterns =
        patterns.filter(pattern =>
            pattern.length === number
        );


    /* Choose a different pattern */

    let pattern;

    do {

        pattern =
            availablePatterns[
                Math.floor(
                    Math.random() *
                    availablePatterns.length
                )
            ];

    } while (
        availablePatterns.length > 1 &&
        patterns.indexOf(pattern) === lastPattern
    );


    lastPattern =
        patterns.indexOf(pattern);


    /* Choose random photos */

    const selected =
        shuffle(photos).slice(0, number);


    /* --------------------------------
       CREATE EACH PHOTO
    -------------------------------- */

    selected.forEach((src, index) => {

        const img =
            document.createElement("img");

        img.className = "photo";

        img.src = src;

        img.draggable = false;


        const p = pattern[index];


        /*
           Small random variation
           around the pattern
        */

        const variationX =
            random(-3, 3);

        const variationY =
            random(-3, 3);

        const variationSize =
            random(-5, 5);


        img.style.left =
            (p.x + variationX) + "%";

        img.style.top =
            (p.y + variationY) + "%";

        img.style.width =
            (p.w + variationSize) + "%";

        img.style.height =
            (p.h + variationSize) + "%";


        journal.appendChild(img);

    }

}


/* --------------------------------
   INITIAL LOAD
-------------------------------- */

loadPhotos();


/* --------------------------------
   CHANGE EVERY 5 SECONDS
-------------------------------- */

setInterval(() => {

    createJournal();

}, 5000);

</script>

</body>
</html>
