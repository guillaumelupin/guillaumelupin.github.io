<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: white;

    touch-action: none;
}

#journal {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}

.photo {
    position: absolute;

    display: block;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;
}

#fullscreen {
    position: fixed;

    top: 12px;
    right: 12px;

    width: 28px;
    height: 28px;

    border: 0;

    background: transparent;

    opacity: 0.06;

    z-index: 9999;
}

#fullscreen:hover {
    opacity: 0.2;
}

#fullscreen svg {
    width: 18px;
    height: 18px;
}

</style>

</head>

<body>

<div id="journal"></div>

<button id="fullscreen">

<svg viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5">

<path d="M4 9V4h5"/>
<path d="M20 9V4h-5"/>
<path d="M4 15v5h5"/>
<path d="M20 15v5h-5"/>

</svg>

</button>


<script>

/* =========================================================
   GITHUB
========================================================= */

const API =
"https://api.github.com/repos/" +
"guillaumelupin/" +
"guillaumelupin.github.io/" +
"contents/photos/journal?ref=main";


/* =========================================================
   GENERAL SETTINGS
========================================================= */

const MAX_PHOTOS = 3;


/*
   Time between dice rolls.
   This is NOT the lifetime of photos.
*/

const ROLL_MIN = 3000;
const ROLL_MAX = 6000;


/*
   Probability that a roll actually
   attempts to create something.
*/

const GENERATION_CHANCE = 0.82;


/*
   Small exception:
   even if the normal spatial logic
   says "not ideal", we can still try.
*/

const FORCE_CHANCE = 0.03;


/* =========================================================
   MULTIPLE PHOTOS
========================================================= */


/*
   When there is ONE photo:

   42% chance of attempting a second.
*/

const SECOND_PHOTO_CHANCE = 0.42;


/*
   When there are TWO:

   18% chance of attempting a third.
*/

const THIRD_PHOTO_CHANCE = 0.18;


/*
   Rare emergency chances.
*/

const FORCE_SECOND_CHANCE = 0.04;

const FORCE_THIRD_CHANCE = 0.05;


/* =========================================================
   OVERLAP
========================================================= */


/*
   Almost always NO overlap.
*/

const NORMAL_OVERLAP = 0.00;


/*
   Rare overlap for second image.
*/

const SECOND_OVERLAP_CHANCE = 0.015;


/*
   Third image is allowed slightly
   more freedom.
*/

const THIRD_OVERLAP_CHANCE = 0.04;


/*
   Absolute rare event.
*/

const RARE_OVERLAP_CHANCE = 0.003;


/* =========================================================
   PHOTO SIZE
========================================================= */

const LARGE_PHOTO_CHANCE = 0.82;


/* =========================================================
   PHOTO LIFETIME
========================================================= */

const NORMAL_LIFE_MIN = 5500;
const NORMAL_LIFE_MAX = 10500;


/*
   Rare longer life.
*/

const LONG_LIFE_CHANCE = 0.08;

const LONG_LIFE_MIN = 10500;
const LONG_LIFE_MAX = 15000;


/*
   Very rare 15–20 second life.
*/

const VERY_LONG_CHANCE = 0.02;

const VERY_LONG_MIN = 15000;
const VERY_LONG_MAX = 20000;


/* =========================================================
   STATE
========================================================= */

let photos = [];

let active = [];

let history = [];

let viewCount = new Map();


/* =========================================================
   HELPERS
========================================================= */

function random(min, max) {

    return Math.random() *
        (max - min) + min;

}


function randomInt(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* =========================================================
   LOAD ONE IMAGE
========================================================= */

function preload(src) {

    return new Promise(resolve => {

        const img = new Image();

        img.onload = () => {

            resolve(img);

        };

        img.onerror = () => {

            /*
               We do NOT delete the image
               from the list.
            */

            resolve(null);

        };

        img.src = src;

    });

}


/* =========================================================
   GET PHOTOS FROM GITHUB
========================================================= */

async function loadPhotos() {

    try {

        const response =
            await fetch(API);


        const files =
            await response.json();


        photos =
            files
            .filter(file =>
                file.type === "file" &&
                /\.(jpg|jpeg|png|webp|gif)$/i
                    .test(file.name)
            )
            .map(file =>
                "https://raw.githubusercontent.com/" +
                "guillaumelupin/" +
                "guillaumelupin.github.io/" +
                "main/photos/journal/" +
                encodeURIComponent(file.name)
            );


        photos.forEach(src => {

            viewCount.set(src, 0);

        });


        console.log(
            "Loaded",
            photos.length,
            "photos"
        );


        /*
           IMPORTANT:

           Start with TWO photos most of
           the time so mobile doesn't
           begin with a lonely image.
        */

        await createStartingComposition();


        /*
           Start the actual program.
        */

        scheduleRoll();

    }

    catch (error) {

        console.error(
            "Could not load journal:",
            error
        );

    }

}


/* =========================================================
   PHOTO SELECTION
========================================================= */

function choosePhoto() {

    if (!photos.length) {

        return null;

    }


    /*
       Remove photos that would make
       three identical selections.
    */

    let candidates =
        photos.filter(src => {

            if (
                history.length >= 2 &&
                history[
                    history.length - 1
                ] === src &&
                history[
                    history.length - 2
                ] === src
            ) {

                return false;

            }

            return true;

        });


    if (!candidates.length) {

        candidates =
            [...photos];

    }


    /*
       Give unseen / rarely seen photos
       a higher weight.
    */

    const weighted = [];


    candidates.forEach(src => {

        const count =
            viewCount.get(src) || 0;


        let weight = 100;


        if (count === 0) {

            weight = 300;

        }

        else {

            weight =
                100 /
                Math.sqrt(count);

        }


        /*
           A photo seen immediately before
           can still return, but rarely.
        */

        if (
            history.length &&
            history[
                history.length - 1
            ] === src
        ) {

            weight *= 0.06;

        }


        const copies =
            Math.max(
                1,
                Math.round(weight)
            );


        for (
            let i = 0;
            i < copies;
            i++
        ) {

            weighted.push(src);

        }

    });


    const selected =
        weighted[
            randomInt(
                0,
                weighted.length - 1
            )
        ];


    return selected;

}


/* =========================================================
   SIZE
========================================================= */

function getSize() {

    const mobile =
        window.innerWidth < 600;


    /*
       Large photos are strongly preferred.
    */

    if (
        Math.random() <
        LARGE_PHOTO_CHANCE
    ) {

        return {

            width: mobile
                ? random(58, 86)
                : random(48, 74),

            height: mobile
                ? random(58, 86)
                : random(48, 74)

        };

    }


    /*
       Smaller photos exist,
       but are less common.
    */

    return {

        width: mobile
            ? random(42, 60)
            : random(36, 52),

        height: mobile
            ? random(42, 60)
            : random(36, 52)

    };

}


/* =========================================================
   RECTANGLE OVERLAP
========================================================= */

function getOverlap(a, b) {

    const x =
        Math.max(
            0,
            Math.min(
                a.x + a.width,
                b.x + b.width
            ) -
            Math.max(
                a.x,
                b.x
            )
        );


    const y =
        Math.max(
            0,
            Math.min(
                a.y + a.height,
                b.y + b.height
            ) -
            Math.max(
                a.y,
                b.y
            )
        );


    return x * y;

}


/* =========================================================
   FIND POSITION
========================================================= */

function findPosition(
    width,
    height,
    allowOverlap
) {

    let best = null;

    let bestOverlap =
        Infinity;


    /*
       Try thousands of positions.
    */

    for (
        let i = 0;
        i < 2500;
        i++
    ) {

        const candidate = {

            x: random(
                2,
                98 - width
            ),

            y: random(
                2,
                98 - height
            ),

            width:
                width,

            height:
                height

        };


        let overlap =
            0;


        for (
            const existing of active
        ) {

            overlap +=
                getOverlap(
                    candidate,
                    existing.position
                );

        }


        const area =
            width * height;


        const ratio =
            overlap / area;


        /*
           Perfectly free position.
        */

        if (
            ratio === 0
        ) {

            return candidate;

        }


        /*
           Remember the best position
           in case we need the exceptional
           decision.
        */

        if (
            ratio <
            bestOverlap
        ) {

            bestOverlap =
                ratio;

            best =
                candidate;

        }

    }


    /*
       Normally, if there is overlap,
       reject it.
    */

    if (!allowOverlap) {

        /*
           But very rarely allow the
           second-level random exception.
        */

        if (
            Math.random() <
            FORCE_CHANCE &&
            best
        ) {

            return best;

        }


        return null;

    }


    /*
       If overlap was explicitly allowed,
       only use it occasionally.
    */

    if (
        Math.random() <
        RARE_OVERLAP_CHANCE &&
        best
    ) {

        return best;

    }


    /*
       Even when overlap is theoretically
       possible, prefer the cleanest result.
    */

    if (
        bestOverlap < 0.025 &&
        best
    ) {

        return best;

    }


    return null;

}


/* =========================================================
   LIFETIME
========================================================= */

function getLifetime() {

    /*
       2% chance of 15–20 seconds.
    */

    if (
        Math.random() <
        VERY_LONG_CHANCE
    ) {

        return random(
            VERY_LONG_MIN,
            VERY_LONG_MAX
        );

    }


    /*
       8% chance of 10.5–15 seconds.
    */

    if (
        Math.random() <
        LONG_LIFE_CHANCE
    ) {

        return random(
            LONG_LIFE_MIN,
            LONG_LIFE_MAX
        );

    }


    /*
       Normal:
       roughly 5.5–10.5 seconds.
    */

    return random(
        NORMAL_LIFE_MIN,
        NORMAL_LIFE_MAX
    );

}


/* =========================================================
   ADD PHOTO
========================================================= */

async function addPhoto(
    allowOverlap = false
) {

    if (
        active.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const src =
        choosePhoto();


    if (!src) {

        return false;

    }


    /*
       LOAD BEFORE DISPLAY.
    */

    const loaded =
        await preload(src);


    if (!loaded) {

        /*
           Image remains in the collection.
        */

        return false;

    }


    /*
       Calculate size.
    */

    const size =
        getSize();


    /*
       Check REAL space.
    */

    const position =
        findPosition(
            size.width,
            size.height,
            allowOverlap
        );


    /*
       No acceptable space.
    */

    if (!position) {

        return false;

    }


    /*
       Create element.
    */

    const img =
        document.createElement(
            "img"
        );


    img.className =
        "photo";


    img.src =
        loaded.src;


    img.draggable =
        false;


    img.style.left =
        position.x + "%";


    img.style.top =
        position.y + "%";


    img.style.width =
        position.width + "%";


    img.style.height =
        position.height + "%";


    /*
       Because it was already loaded,
       it appears complete.
    */

    journal.appendChild(img);


    const item = {

        element: img,

        src: src,

        position: position,

        created:
            Date.now()

    };


    active.push(item);


    /*
       Remember appearance.
    */

    const count =
        viewCount.get(src) || 0;


    viewCount.set(
        src,
        count + 1
    );


    history.push(src);


    if (
        history.length > 5
    ) {

        history.shift();

    }


    /*
       IMPORTANT:

       Countdown starts NOW.
       Not before loading.
    */

    const lifetime =
        getLifetime();


    item.timer =
        setTimeout(
            () => {

                removePhoto(item);

            },
            lifetime
        );


    return true;

}


/* =========================================================
   REMOVE PHOTO
========================================================= */

async function removePhoto(
    item
) {

    /*
       Item may already have disappeared.
    */

    if (
        !active.includes(item)
    ) {

        return;

    }


    /*
       If other photos exist,
       simply remove this one.
    */

    if (
        active.length > 1
    ) {

        item.element.remove();


        active =
            active.filter(
                x =>
                    x !== item
            );


        /*
           Small chance of immediately
           adding another photo.
        */

        if (
            active.length < MAX_PHOTOS &&
            Math.random() < 0.30
        ) {

            setTimeout(
                () => {

                    attemptGeneration();

                },
                random(
                    300,
                    1200
                )
            );

        }


        return;

    }


    /*
       =====================================================
       ONLY ONE PHOTO REMAINS.
       NEVER REMOVE IT FIRST.
       =====================================================
    */


    /*
       First create a replacement.
    */

    const added =
        await addReplacement();


    if (added) {

        /*
           New image exists.

           NOW remove the old one.
        */

        if (
            active.includes(item)
        ) {

            item.element.remove();


            active =
                active.filter(
                    x =>
                        x !== item
                );

        }

        return;

    }


    /*
       If replacement failed,
       KEEP THE OLD PHOTO.

       Try again later.

       This is what prevents white screens.
    */

    setTimeout(
        () => {

            removePhoto(item);

        },
        1200
    );

}


/* =========================================================
   REPLACEMENT
========================================================= */

async function addReplacement() {

    const src =
        choosePhoto();


    if (!src) {

        return false;

    }


    const loaded =
        await preload(src);


    if (!loaded) {

        return false;

    }


    const size =
        getSize();


    /*
       Since the old photo is still there,
       find a position that doesn't overlap.
    */

    const position =
        findPosition(
            size.width,
            size.height,
            false
        );


    /*
       If impossible, don't remove old.
    */

    if (!position) {

        return false;

    }


    const img =
        document.createElement(
            "img"
        );


    img.className =
        "photo";


    img.src =
        loaded.src;


    img.draggable =
        false;


    img.style.left =
        position.x + "%";


    img.style.top =
        position.y + "%";


    img.style.width =
        position.width + "%";


    img.style.height =
        position.height + "%";


    journal.appendChild(img);


    const item = {

        element: img,

        src: src,

        position: position,

        created:
            Date.now()

    };


    active.push(item);


    const count =
        viewCount.get(src) || 0;


    viewCount.set(
        src,
        count + 1
    );


    history.push(src);


    if (
        history.length > 5
    ) {

        history.shift();

    }


    const lifetime =
        getLifetime();


    item.timer =
        setTimeout(
            () => {

                removePhoto(item);

            },
            lifetime
        );


    return true;

}


/* =========================================================
   GENERATION DECISION
========================================================= */

async function attemptGeneration() {

    /*
       Already full.
    */

    if (
        active.length >=
        MAX_PHOTOS
    ) {

        return;

    }


    /*
       =====================================================
       DICE #1
       =====================================================
    */

    let wants =
        Math.random() <
        GENERATION_CHANCE;


    /*
       If only one photo exists,
       increase generation pressure.
    */

    if (
        active.length === 1 &&
        Math.random() < 0.25
    ) {

        wants = true;

    }


    if (!wants) {

        return;

    }


    /*
       =====================================================
       DICE #2:
       WHAT ARE WE GENERATING?
       =====================================================
    */

    let target = 1;


    if (
        active.length === 0
    ) {

        target = 1;

    }

    else if (
        active.length === 1
    ) {

        if (
            Math.random() <
            SECOND_PHOTO_CHANCE
        ) {

            target = 1;

        }

        else {

            return;

        }

    }

    else if (
        active.length === 2
    ) {

        if (
            Math.random() <
            THIRD_PHOTO_CHANCE
        ) {

            target = 1;

        }

        else {

            return;

        }

    }


    /*
       =====================================================
       DICE #3:
       SHOULD OVERLAP BE ALLOWED?
       =====================================================
    */

    let overlap = false;


    if (
        active.length === 1
    ) {

        overlap =
            Math.random() <
            SECOND_OVERLAP_CHANCE;

    }

    else if (
        active.length === 2
    ) {

        overlap =
            Math.random() <
            THIRD_OVERLAP_CHANCE;

    }


    /*
       Rare exceptional overlap.
    */

    if (
        Math.random() <
        RARE_OVERLAP_CHANCE
    ) {

        overlap = true;

    }


    /*
       =====================================================
       GENERATE
       =====================================================
    */

    const success =
        await addPhoto(
            overlap
        );


    /*
       =====================================================
       IF SPATIAL CHECK FAILED
       =====================================================

       We don't stop the program.

       We throw another tiny dice.
    */

    if (
        !success
    ) {

        if (
            Math.random() <
            FORCE_CHANCE
        ) {

            /*
               Try again, allowing overlap.
            */

            await addPhoto(true);

        }

    }

}


/* =========================================================
   STARTING COMPOSITION
========================================================= */

async function createStartingComposition() {

    /*
       First photo is mandatory.
    */

    await addPhoto(false);


    /*
       Then strongly encourage a second
       image at startup.
    */

    if (
        Math.random() < 0.70 &&
        active.length < 2
    ) {

        await addPhoto(
            Math.random() <
            SECOND_OVERLAP_CHANCE
        );

    }


    /*
       Rare third photo.
    */

    if (
        Math.random() < 0.10 &&
        active.length < 3
    ) {

        await addPhoto(
            Math.random() <
            THIRD_OVERLAP_CHANCE
        );

    }


    /*
       Absolute safety.
    */

    if (
        active.length === 0
    ) {

        await addPhoto(false);

    }

}


/* =========================================================
   THE DICE LOOP
========================================================= */

function scheduleRoll() {

    /*
       EVERY roll is independent.
    */

    const delay =
        random(
            ROLL_MIN,
            ROLL_MAX
        );


    setTimeout(
        async () => {

            /*
               Throw the dice.
            */

            await attemptGeneration();


            /*
               Immediately schedule the
               NEXT dice roll.

               This is deliberately outside
               the generation logic.

               Therefore the program CANNOT
               get stuck because a generation
               failed.
            */

            scheduleRoll();

        },
        delay
    );

}


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreen =
    document.getElementById(
        "fullscreen"
    );


fullscreen.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document
                    .documentElement
                    .requestFullscreen();

            }

            else {

                await document
                    .exitFullscreen();

            }

        }

        catch (error) {

            console.error(error);

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPhotos();

</script>

</body>
</html>
