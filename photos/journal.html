<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: white;

    touch-action: none;
}


#journal {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

}


/* -----------------------------------------
   PHOTOS
----------------------------------------- */

.photo {

    position: absolute;

    display: block;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;

}


/* -----------------------------------------
   FULLSCREEN
----------------------------------------- */

#fullscreen {

    position: fixed;

    top: 12px;
    right: 12px;

    width: 28px;
    height: 28px;

    padding: 0;

    border: none;

    background: transparent;

    opacity: 0.07;

    z-index: 1000;

    cursor: pointer;

}


#fullscreen:hover {

    opacity: 0.25;

}


#fullscreen svg {

    width: 18px;
    height: 18px;

}


:fullscreen #fullscreen {

    opacity: 0;

}

</style>

</head>


<body>


<div id="journal"></div>


<button id="fullscreen">

<svg viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5">

<path d="M4 9V4h5"/>
<path d="M20 9V4h-5"/>
<path d="M4 15v5h5"/>
<path d="M20 15v5h-5"/>

</svg>

</button>


<script>


/* =========================================================
   GITHUB
========================================================= */

const API =
"https://api.github.com/repos/" +
"guillaumelupin/" +
"guillaumelupin.github.io/" +
"contents/photos/journal?ref=main";


/* =========================================================
   SETTINGS
========================================================= */

const MAX_PHOTOS = 3;


/*
   How long a photo remains visible.

   The timer starts AFTER the image
   has completely loaded.
*/

const MIN_LIFETIME = 5000;

const MAX_LIFETIME = 14000;


/*
   Very rare long appearance.
*/

const RARE_LONG_CHANCE = 0.025;

const RARE_LONG_MAX = 20000;


/*
   Time between decisions.

   This is NOT the lifetime of the photos.

   It simply determines when the system
   asks itself whether something should happen.
*/

const MIN_EVENT_DELAY = 1800;

const MAX_EVENT_DELAY = 4300;


/*
   Overlap.

   Normally almost forbidden.

   Rarely allowed.
*/

const NORMAL_OVERLAP = 0.035;

const THREE_PHOTO_OVERLAP = 0.06;

const RARE_OVERLAP = 0.008;


/* =========================================================
   VARIABLES
========================================================= */

const journal =
document.getElementById("journal");


let photos = [];


let activePhotos = [];


/*
   Recently displayed photos.

   Used only to discourage repetition.
*/

let recentPhotos = [];


let loading = false;


/* =========================================================
   RANDOM
========================================================= */

function random(min, max) {

    return Math.random() *
        (max - min) + min;

}


function randomInt(min, max) {

    return Math.floor(
        random(min, max + 1)
    );

}


/* =========================================================
   PRELOAD
========================================================= */

function preloadImage(src) {

    return new Promise(resolve => {

        const img = new Image();


        img.onload = () => {

            resolve(img);

        };


        img.onerror = () => {

            /*
               The photo stays in the list.

               It can be attempted again later.
            */

            resolve(null);

        };


        img.src = src;

    });

}


/* =========================================================
   LOAD GITHUB FILES
========================================================= */

async function loadPhotos() {

    try {

        const response =
            await fetch(API);


        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }


        const files =
            await response.json();


        photos = files

            .filter(file =>

                file.type === "file" &&

                /\.(jpg|jpeg|png|webp|gif)$/i
                    .test(file.name)

            )

            .map(file =>

                "https://raw.githubusercontent.com/" +

                "guillaumelupin/" +

                "guillaumelupin.github.io/" +

                "main/photos/journal/" +

                encodeURIComponent(file.name)

            );


        /*
           Create the first composition.

           It is deliberately biased toward
           one or two photos.
        */

        await createInitialComposition();


        scheduleEvent();


    }

    catch (error) {

        console.error(
            "Journal loading error:",
            error
        );

    }

}


/* =========================================================
   CHOOSE PHOTO
========================================================= */

function choosePhoto() {

    if (!photos.length) {

        return null;

    }


    const weighted = [];


    for (const src of photos) {

        let weight = 100;


        /*
           Last photo:
           extremely unlikely.
        */

        if (

            recentPhotos.length >= 1 &&

            src ===
            recentPhotos[
                recentPhotos.length - 1
            ]

        ) {

            weight = 2;

        }


        /*
           Second most recent:
           discouraged but still possible.
        */

        else if (

            recentPhotos.length >= 2 &&

            src ===
            recentPhotos[
                recentPhotos.length - 2
            ]

        ) {

            weight = 20;

        }


        for (
            let i = 0;
            i < weight;
            i++
        ) {

            weighted.push(src);

        }

    }


    /*
       Very rare immediate repetition.

       Never allow the same image three
       times consecutively.
    */

    if (

        recentPhotos.length > 0 &&

        Math.random() < 0.02

    ) {

        const previous =
            recentPhotos[
                recentPhotos.length - 1
            ];


        if (

            recentPhotos.length < 2 ||

            recentPhotos[
                recentPhotos.length - 2
            ] !== previous

        ) {

            return previous;

        }

    }


    return weighted[
        randomInt(
            0,
            weighted.length - 1
        )
    ];

}


/* =========================================================
   COLLISION
========================================================= */

function overlaps(a, b) {

    return (

        a.x <
            b.x + b.w &&

        a.x + a.w >
            b.x &&

        a.y <
            b.y + b.h &&

        a.y + a.h >
            b.y

    );

}


/* =========================================================
   POSITION
========================================================= */

function findPosition(
    width,
    height,
    allowOverlap
) {


    /*
       Normally overlap is almost impossible.

       This is intentionally MUCH lower than
       the previous versions.
    */

    let overlapChance =
        allowOverlap
            ? THREE_PHOTO_OVERLAP
            : NORMAL_OVERLAP;


    /*
       Extremely rare unusual composition.
    */

    if (
        Math.random() <
        RARE_OVERLAP
    ) {

        overlapChance = 0.25;

    }


    const shouldOverlap =
        Math.random() <
        overlapChance;


    /*
       Try hundreds of positions.

       Existing images therefore create
       protected areas.
    */

    for (
        let attempt = 0;
        attempt < 500;
        attempt++
    ) {


        const position = {

            x: random(
                2,
                98 - width
            ),

            y: random(
                2,
                98 - height
            ),

            w: width,

            h: height

        };


        /*
           Rare intentional overlap.
        */

        if (shouldOverlap) {

            return position;

        }


        let collision = false;


        for (
            const active
            of activePhotos
        ) {

            if (
                overlaps(
                    position,
                    active.position
                )
            ) {

                collision = true;

                break;

            }

        }


        if (!collision) {

            return position;

        }

    }


    /*
       If there genuinely isn't enough
       free space, return null instead
       of forcing an ugly composition.
    */

    return null;

}


/* =========================================================
   PHOTO SIZE
========================================================= */

function getSize(
    numberAlreadyOnScreen
) {

    const mobile =
        window.innerWidth < 600;


    /*
       =====================================
       THIRD PHOTO
       =====================================
    */

    if (
        numberAlreadyOnScreen >= 2
    ) {

        return {

            width: mobile
                ? random(27, 40)
                : random(24, 37),

            height: mobile
                ? random(27, 42)
                : random(25, 40)

        };

    }


    /*
       =====================================
       NORMAL PHOTOS
       =====================================

       Large sizes are deliberately much
       more common than small sizes.
    */


    const r = Math.random();


    /*
       15% medium.
    */

    if (r < 0.15) {

        return {

            width: mobile
                ? random(43, 57)
                : random(34, 47),

            height: mobile
                ? random(42, 58)
                : random(38, 53)

        };

    }


    /*
       85% large.
    */

    return {

        width: mobile
            ? random(55, 82)
            : random(42, 68),

        height: mobile
            ? random(52, 78)
            : random(43, 72)

    };

}


/* =========================================================
   LIFETIME
========================================================= */

function getLifetime() {

    /*
       Very rare 15–20 second image.
    */

    if (
        Math.random() <
        RARE_LONG_CHANCE
    ) {

        return random(
            15000,
            RARE_LONG_MAX
        );

    }


    return random(
        MIN_LIFETIME,
        MAX_LIFETIME
    );

}


/* =========================================================
   SPAWN PHOTO
========================================================= */

async function spawnPhoto() {

    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const src =
        choosePhoto();


    if (!src) {

        return false;

    }


    /*
       IMPORTANT:

       Nothing appears until the image
       has completely loaded.
    */

    const loaded =
        await preloadImage(src);


    if (!loaded) {

        return false;

    }


    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const size =
        getSize(
            activePhotos.length
        );


    const position =
        findPosition(

            size.width,

            size.height,

            activePhotos.length >= 2

        );


    /*
       No suitable free space.

       Don't add the image.
    */

    if (!position) {

        return false;

    }


    const img =
        document.createElement("img");


    img.className =
        "photo";


    img.src =
        loaded.src;


    img.draggable =
        false;


    img.style.left =
        position.x + "%";


    img.style.top =
        position.y + "%";


    img.style.width =
        position.w + "%";


    img.style.height =
        position.h + "%";


    journal.appendChild(img);


    const active = {

        element: img,

        src: src,

        position: position

    };


    activePhotos.push(active);


    /*
       Remember image.
    */

    recentPhotos.push(src);


    if (
        recentPhotos.length > 2
    ) {

        recentPhotos.shift();

    }


    /*
       TIMER STARTS HERE.

       The image has already loaded
       and is now visible.
    */

    const lifetime =
        getLifetime();


    setTimeout(() => {


        img.remove();


        activePhotos =
            activePhotos.filter(
                item =>
                    item !== active
            );


        /*
           If removing this image somehow
           leaves the screen empty,
           immediately create another one.
        */

        if (
            activePhotos.length === 0
        ) {

            spawnPhoto();

        }


    }, lifetime);


    return true;

}


/* =========================================================
   INITIAL COMPOSITION
========================================================= */

async function createInitialComposition() {

    /*
       60% = one large image

       37% = two images

       3% = three images
    */

    const r =
        Math.random();


    let number;


    if (r < 0.60) {

        number = 1;

    }

    else if (r < 0.97) {

        number = 2;

    }

    else {

        number = 3;

    }


    /*
       Spawn sequentially so that the
       second image knows where the first
       image is.
    */

    for (
        let i = 0;
        i < number;
        i++
    ) {

        await spawnPhoto();

    }


    /*
       Absolute safety:

       NEVER leave a blank page.
    */

    if (
        activePhotos.length === 0
    ) {

        await spawnPhoto();

    }

}


/* =========================================================
   EVENT LOGIC
========================================================= */

async function runEvent() {

    if (loading) {

        return;

    }


    loading = true;


    const count =
        activePhotos.length;


    /*
       =====================================
       NO PHOTOS
       =====================================

       Impossible state.

       Immediately refill.
    */

    if (count === 0) {

        await spawnPhoto();

        loading = false;

        return;

    }


    /*
       =====================================
       ONE PHOTO
       =====================================
    */

    if (count === 1) {

        const r =
            Math.random();


        /*
           45% chance of adding
           a second photo.

           This is the important change
           from the previous version.
        */

        if (r < 0.45) {

            await spawnPhoto();

        }


        /*
           3% chance of attempting
           to create TWO additional
           photos at once.

           This produces the rare
           three-photo composition.
        */

        else if (r < 0.48) {

            await spawnPhoto();

            await spawnPhoto();

        }


        /*
           Otherwise nothing happens.

           The existing image gets
           breathing room.
        */

    }


    /*
       =====================================
       TWO PHOTOS
       =====================================
    */

    else if (count === 2) {

        const r =
            Math.random();


        /*
           18% chance to create a third.
        */

        if (r < 0.18) {

            await spawnPhoto();

        }


        /*
           Otherwise simply let the
           composition exist.
        */

    }


    /*
       =====================================
       THREE PHOTOS
       =====================================
    */

    else {

        /*
           Do absolutely nothing.

           One of the existing photos will
           eventually disappear naturally.
        */

    }


    loading = false;

}


/* =========================================================
   SCHEDULER
========================================================= */

function scheduleEvent() {

    const delay =
        random(
            MIN_EVENT_DELAY,
            MAX_EVENT_DELAY
        );


    setTimeout(async () => {


        /*
           Never allow a completely
           empty page.
        */

        if (
            activePhotos.length === 0
        ) {

            await spawnPhoto();

        }

        else {

            await runEvent();

        }


        scheduleEvent();


    }, delay);

}


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreenButton =
    document.getElementById(
        "fullscreen"
    );


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            }

            else {

                await document.exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen unavailable:",
                error
            );

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPhotos();

</script>

</body>

</html>
