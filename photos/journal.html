<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #ffffff;

    touch-action: none;
}

#journal {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}

.photo {
    position: absolute;

    display: block;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;
}

#fullscreen {
    position: fixed;

    top: 12px;
    right: 12px;

    width: 28px;
    height: 28px;

    padding: 0;

    border: 0;

    background: transparent;

    opacity: 0.06;

    z-index: 9999;

    cursor: pointer;
}

#fullscreen:hover {
    opacity: 0.18;
}

#fullscreen svg {
    width: 18px;
    height: 18px;
}

:fullscreen #fullscreen {
    opacity: 0;
}

</style>

</head>


<body>

<div id="journal"></div>


<button id="fullscreen">

<svg viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5">

<path d="M4 9V4h5"/>
<path d="M20 9V4h-5"/>
<path d="M4 15v5h5"/>
<path d="M20 15v5h-5"/>

</svg>

</button>


<script>

/* =========================================================
   GITHUB
========================================================= */

const API =
    "https://api.github.com/repos/" +
    "guillaumelupin/" +
    "guillaumelupin.github.io/" +
    "contents/photos/journal?ref=main";


/* =========================================================
   BASIC SETTINGS
========================================================= */

const MAX_PHOTOS = 3;


/*
   Between each decision.
*/

const MIN_ROLL = 5000;
const MAX_ROLL = 9000;


/*
   First dice:

   "Do we feel like generating
   something at all?"
*/

const GENERATE_CHANCE = 0.82;


/*
   Second dice:

   After seeing the available space,
   there is still a small chance
   to force the decision.

   This is the "2% exception".
*/

const FORCE_GENERATION_CHANCE = 0.02;


/* =========================================================
   MULTIPLE PHOTOS
========================================================= */


/*
   With one photo:

   32% chance of trying to create
   two photos together.
*/

const ONE_TO_TWO_CHANCE = 0.32;


/*
   With two photos:

   12% chance of trying to create
   a third.
*/

const TWO_TO_THREE_CHANCE = 0.12;


/*
   Rare possibility of a second
   photo arriving even when the
   first spatial calculation isn't
   ideal.
*/

const SECOND_FORCE_CHANCE = 0.02;


/*
   Rare possibility of a third
   photo despite difficult space.
*/

const THIRD_FORCE_CHANCE = 0.03;


/* =========================================================
   OVERLAP
========================================================= */


/*
   Normal second-photo overlap.
*/

const SECOND_OVERLAP_CHANCE = 0.01;


/*
   Third photo has slightly more
   freedom because it is rare.
*/

const THIRD_OVERLAP_CHANCE = 0.05;


/*
   Very rare exceptional overlap.
*/

const RARE_OVERLAP_CHANCE = 0.002;


/*
   Maximum normal overlap.
*/

const MAX_NORMAL_OVERLAP = 0.035;


/*
   Maximum overlap for third photo.
*/

const MAX_THIRD_OVERLAP = 0.08;


/* =========================================================
   LIFETIME
========================================================= */

const NORMAL_MIN = 5500;
const NORMAL_MAX = 11000;


const LONG_CHANCE = 0.08;

const LONG_MIN = 11000;
const LONG_MAX = 16000;


const VERY_LONG_CHANCE = 0.02;

const VERY_LONG_MIN = 16000;
const VERY_LONG_MAX = 20000;


/* =========================================================
   PHOTO MEMORY
========================================================= */

const viewCount = new Map();

let recent = [];

let displayedSinceCheck = 0;

const MIN_FORCED_CHECK = 35;
const MAX_FORCED_CHECK = 45;

let nextForcedCheck =
    randomInt(
        MIN_FORCED_CHECK,
        MAX_FORCED_CHECK
    );


/* =========================================================
   STATE
========================================================= */

let photos = [];

let active = [];


/* =========================================================
   RANDOM
========================================================= */

function random(min, max) {

    return Math.random() *
        (max - min) + min;

}


function randomInt(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* =========================================================
   IMAGE LOADING
========================================================= */

function loadImage(src) {

    return new Promise(resolve => {

        const image = new Image();

        image.onload = () => {

            resolve(image);

        };

        image.onerror = () => {

            /*
               IMPORTANT:

               We do NOT remove the photo
               from the collection.
            */

            resolve(null);

        };

        image.src = src;

    });

}


/* =========================================================
   LOAD PHOTOS FROM GITHUB
========================================================= */

async function loadPhotos() {

    try {

        const response =
            await fetch(API);

        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }


        const files =
            await response.json();


        photos = files

            .filter(file =>

                file.type === "file" &&

                /\.(jpg|jpeg|png|webp|gif)$/i
                    .test(file.name)

            )

            .map(file =>

                "https://raw.githubusercontent.com/" +
                "guillaumelupin/" +
                "guillaumelupin.github.io/" +
                "main/photos/journal/" +
                encodeURIComponent(
                    file.name
                )

            );


        for (
            const src of photos
        ) {

            viewCount.set(
                src,
                0
            );

        }


        console.log(
            "Journal:",
            photos.length,
            "photos"
        );


        await createInitialComposition();

        roll();

    }

    catch (error) {

        console.error(
            "Journal error:",
            error
        );

    }

}


/* =========================================================
   PHOTO SELECTION
========================================================= */

function choosePhoto() {

    if (
        photos.length === 0
    ) {

        return null;

    }


    /*
       PERIODICALLY FORCE A PHOTO
       THAT HAS NEVER BEEN SEEN.
    */

    if (
        displayedSinceCheck >=
        nextForcedCheck
    ) {

        const unseen =
            photos.filter(
                src =>
                    (viewCount.get(src) || 0)
                    === 0
            );


        if (
            unseen.length > 0
        ) {

            return unseen[
                randomInt(
                    0,
                    unseen.length - 1
                )
            ];

        }


        /*
           Everything has been seen.

           Choose among least-seen photos.
        */

        let minimum =
            Infinity;


        for (
            const src of photos
        ) {

            const count =
                viewCount.get(src) || 0;


            if (
                count < minimum
            ) {

                minimum = count;

            }

        }


        const leastSeen =
            photos.filter(
                src =>
                    (viewCount.get(src) || 0)
                    === minimum
            );


        if (
            leastSeen.length > 0
        ) {

            return leastSeen[
                randomInt(
                    0,
                    leastSeen.length - 1
                )
            ];

        }

    }


    /*
       WEIGHTED RANDOM SELECTION
    */

    const pool = [];


    for (
        const src of photos
    ) {

        let weight = 100;


        const count =
            viewCount.get(src) || 0;


        /*
           Unseen photos get priority.
        */

        if (
            count === 0
        ) {

            weight = 180;

        }


        /*
           NEVER three identical
           appearances consecutively.
        */

        if (

            recent.length >= 2 &&

            recent[
                recent.length - 1
            ] === src &&

            recent[
                recent.length - 2
            ] === src

        ) {

            weight = 0;

        }


        /*
           Two consecutive appearances
           remain possible but rare.
        */

        else if (

            recent.length >= 1 &&

            recent[
                recent.length - 1
            ] === src

        ) {

            weight *= 0.08;

        }


        /*
           Slightly discourage a photo
           that appeared very recently.
        */

        else if (

            recent.length >= 2 &&

            recent[
                recent.length - 2
            ] === src

        ) {

            weight *= 0.30;

        }


        /*
           Balance the archive.
        */

        if (
            count > 0
        ) {

            weight *=
                1 /
                Math.sqrt(count);

        }


        for (
            let i = 0;
            i < Math.max(
                0,
                Math.round(weight)
            );
            i++
        ) {

            pool.push(src);

        }

    }


    if (
        pool.length === 0
    ) {

        return photos[
            randomInt(
                0,
                photos.length - 1
            )
        ];

    }


    return pool[
        randomInt(
            0,
            pool.length - 1
        )
    ];

}


/* =========================================================
   SIZE
========================================================= */

function getSize(
    numberOfPhotos
) {

    const mobile =
        window.innerWidth < 600;


    /*
       THREE PHOTOS

       They must remain smaller.
    */

    if (
        numberOfPhotos >= 3
    ) {

        return {

            w: mobile
                ? random(25, 38)
                : random(22, 36),

            h: mobile
                ? random(27, 40)
                : random(23, 38)

        };

    }


    /*
       ONE OR TWO PHOTOS

       Large photos dominate.
    */

    if (
        Math.random() < 0.88
    ) {

        return {

            w: mobile
                ? random(55, 84)
                : random(46, 72),

            h: mobile
                ? random(55, 82)
                : random(46, 74)

        };

    }


    /*
       Occasional medium photo.
    */

    return {

        w: mobile
            ? random(43, 60)
            : random(35, 52),

        h: mobile
            ? random(43, 60)
            : random(35, 54)

    };

}


/* =========================================================
   RECTANGLE INTERSECTION
========================================================= */

function intersection(a, b) {

    const x =
        Math.max(
            0,
            Math.min(
                a.x + a.w,
                b.x + b.w
            ) -
            Math.max(
                a.x,
                b.x
            )
        );


    const y =
        Math.max(
            0,
            Math.min(
                a.y + a.h,
                b.y + b.h
            ) -
            Math.max(
                a.y,
                b.y
            )
        );


    return x * y;

}


/* =========================================================
   OVERLAP CALCULATION
========================================================= */

function calculateOverlap(
    candidate
) {

    let total = 0;


    for (
        const item of active
    ) {

        total +=
            intersection(
                candidate,
                item.position
            );

    }


    return total;

}


/* =========================================================
   FIND POSITION
========================================================= */

function findPosition(
    w,
    h,
    overlapChance,
    isThirdPhoto,
    force = false
) {

    let best = null;

    let bestRatio =
        Infinity;


    /*
       =====================================================
       FIRST PHASE

       Search for a completely free position.
       =====================================================
    */

    for (
        let i = 0;
        i < 3000;
        i++
    ) {

        const candidate = {

            x: random(
                2,
                98 - w
            ),

            y: random(
                2,
                98 - h
            ),

            w: w,

            h: h

        };


        const overlap =
            calculateOverlap(
                candidate
            );


        const ratio =
            overlap /
            (w * h);


        /*
           Perfect space.
        */

        if (
            ratio === 0
        ) {

            return {

                position: candidate,

                overlapping: false

            };

        }


        if (
            ratio <
            bestRatio
        ) {

            bestRatio =
                ratio;

            best =
                candidate;

        }

    }


    /*
       =====================================================
       WE FOUND NO PERFECT SPACE.

       NOW WE ROLL ANOTHER DICE.

       This is the new level you requested.
       =====================================================
    */


    let forced =
        force;


    /*
       Normal exceptional chance.
    */

    if (
        !forced &&
        Math.random() <
        FORCE_GENERATION_CHANCE
    ) {

        forced = true;

    }


    /*
       If we are not forcing anything,
       only accept extremely small overlap.
    */

    if (
        !forced
    ) {

        if (
            best &&
            bestRatio <= 0.015
        ) {

            return {

                position: best,

                overlapping: true

            };

        }


        return null;

    }


    /*
       =====================================================
       FORCED GENERATION

       We still DON'T allow chaos.

       We search for the least-bad position.
       =====================================================
    */


    if (
        best
    ) {

        /*
           If the best position is reasonably
           clean, use it.
        */

        if (
            bestRatio <=
            (
                isThirdPhoto
                    ? MAX_THIRD_OVERLAP
                    : MAX_NORMAL_OVERLAP
            )
        ) {

            return {

                position: best,

                overlapping:
                    bestRatio > 0

            };

        }

    }


    /*
       =====================================================
       SECONDARY FORCED SEARCH

       We deliberately allow more overlap,
       but still choose the smallest possible.
       =====================================================
    */

    let forcedBest = null;

    let forcedBestRatio =
        Infinity;


    for (
        let i = 0;
        i < 5000;
        i++
    ) {

        const candidate = {

            x: random(
                2,
                98 - w
            ),

            y: random(
                2,
                98 - h
            ),

            w: w,

            h: h

        };


        const overlap =
            calculateOverlap(
                candidate
            );


        const ratio =
            overlap /
            (w * h);


        if (
            ratio <
            forcedBestRatio
        ) {

            forcedBestRatio =
                ratio;

            forcedBest =
                candidate;

        }

    }


    if (
        forcedBest
    ) {

        return {

            position:
                forcedBest,

            overlapping:
                forcedBestRatio > 0

        };

    }


    return null;

}


/* =========================================================
   LIFETIME
========================================================= */

function getLifetime() {

    /*
       Very rare 16–20 seconds.
    */

    if (
        Math.random() <
        VERY_LONG_CHANCE
    ) {

        return random(
            VERY_LONG_MIN,
            VERY_LONG_MAX
        );

    }


    /*
       Rare 11–16 seconds.
    */

    if (
        Math.random() <
        LONG_CHANCE
    ) {

        return random(
            LONG_MIN,
            LONG_MAX
        );

    }


    /*
       Normal 5.5–11 seconds.
    */

    return random(
        NORMAL_MIN,
        NORMAL_MAX
    );

}


/* =========================================================
   REGISTER
========================================================= */

function registerPhoto(
    src
) {

    const count =
        viewCount.get(src) || 0;


    viewCount.set(
        src,
        count + 1
    );


    displayedSinceCheck++;


    recent.push(src);


    if (
        recent.length > 3
    ) {

        recent.shift();

    }


    if (
        displayedSinceCheck >=
        nextForcedCheck
    ) {

        displayedSinceCheck = 0;


        nextForcedCheck =
            randomInt(
                MIN_FORCED_CHECK,
                MAX_FORCED_CHECK
            );

    }

}


/* =========================================================
   ADD PHOTO
========================================================= */

async function addPhoto(
    overlapChance = 0,
    isThirdPhoto = false,
    force = false
) {

    /*
       Maximum three.
    */

    if (
        active.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const src =
        choosePhoto();


    if (!src) {

        return false;

    }


    /*
       LOAD FIRST.
    */

    const loaded =
        await loadImage(src);


    if (!loaded) {

        return false;

    }


    /*
       Size is calculated based on
       the number of photos that will
       actually exist.
    */

    const size =
        getSize(
            active.length + 1
        );


    /*
       Position is calculated against
       ALL CURRENTLY DISPLAYED PHOTOS.
    */

    const result =
        findPosition(
            size.w,
            size.h,
            overlapChance,
            isThirdPhoto,
            force
        );


    /*
       No position.

       Don't force unless the caller
       explicitly asked for it.
    */

    if (!result) {

        return false;

    }


    const position =
        result.position;


    const img =
        document.createElement("img");


    img.className =
        "photo";


    img.src =
        loaded.src;


    img.draggable =
        false;


    img.style.left =
        position.x + "%";


    img.style.top =
        position.y + "%";


    img.style.width =
        position.w + "%";


    img.style.height =
        position.h + "%";


    /*
       Because the image is already
       decoded/loaded, it appears
       immediately.
    */

    journal.appendChild(
        img
    );


    const item = {

        element: img,

        src: src,

        position: position

    };


    active.push(
        item
    );


    registerPhoto(
        src
    );


    /*
       Lifetime starts AFTER
       actual display.
    */

    const lifetime =
        getLifetime();


    setTimeout(
        () => {

            removePhoto(
                item
            );

        },
        lifetime
    );


    return true;

}


/* =========================================================
   REMOVE PHOTO
========================================================= */

async function removePhoto(
    item
) {

    /*
       More than one photo remains.

       Just remove this one.
    */

    if (
        active.length > 1
    ) {

        item.element.remove();


        active =
            active.filter(
                x =>
                    x !== item
            );


        return;

    }


    /*
       =====================================================
       ONLY ONE PHOTO LEFT.

       NEVER allow a blank page.
       =====================================================
    */

    const src =
        choosePhoto();


    if (!src) {

        setTimeout(
            () =>
                removePhoto(item),
            1500
        );

        return;

    }


    /*
       Load replacement first.
    */

    const loaded =
        await loadImage(src);


    if (!loaded) {

        setTimeout(
            () =>
                removePhoto(item),
            1500
        );

        return;

    }


    const size =
        getSize(1);


    const result =
        findPosition(
            size.w,
            size.h,
            0,
            false,
            false
        );


    if (!result) {

        setTimeout(
            () =>
                removePhoto(item),
            1500
        );

        return;

    }


    const position =
        result.position;


    const newImg =
        document.createElement("img");


    newImg.className =
        "photo";


    newImg.src =
        loaded.src;


    newImg.draggable =
        false;


    newImg.style.left =
        position.x + "%";


    newImg.style.top =
        position.y + "%";


    newImg.style.width =
        position.w + "%";


    newImg.style.height =
        position.h + "%";


    /*
       New photo appears FIRST.
    */

    journal.appendChild(
        newImg
    );


    /*
       Then old photo disappears.

       Therefore there is no white frame.
    */

    item.element.remove();


    active =
        active.filter(
            x =>
                x !== item
        );


    const newItem = {

        element: newImg,

        src: src,

        position: position

    };


    active.push(
        newItem
    );


    registerPhoto(
        src
    );


    /*
       New lifetime begins now.
    */

    const lifetime =
        getLifetime();


    setTimeout(
        () => {

            removePhoto(
                newItem
            );

        },
        lifetime
    );

}


/* =========================================================
   INITIAL COMPOSITION
========================================================= */

async function createInitialComposition() {

    /*
       42% → one
       50% → two
       8%  → three
    */

    const r =
        Math.random();


    let amount;


    if (
        r < 0.42
    ) {

        amount = 1;

    }

    else if (
        r < 0.92
    ) {

        amount = 2;

    }

    else {

        amount = 3;

    }


    /*
       First photo always.
    */

    await addPhoto(
        0,
        false,
        true
    );


    /*
       Second photo.
    */

    if (
        amount >= 2
    ) {

        await addPhoto(
            SECOND_OVERLAP_CHANCE,
            false,
            Math.random() <
                SECOND_FORCE_CHANCE
        );

    }


    /*
       Third photo.
    */

    if (
        amount >= 3
    ) {

        await addPhoto(
            THIRD_OVERLAP_CHANCE,
            true,
            Math.random() <
                THIRD_FORCE_CHANCE
        );

    }


    /*
       Absolute safety.
    */

    if (
        active.length === 0
    ) {

        await addPhoto(
            0,
            false,
            true
        );

    }

}


/* =========================================================
   DECIDE WHAT TO GENERATE
========================================================= */

function decideGeneration() {

    /*
       =====================================================
       ONE PHOTO
       =====================================================
    */

    if (
        active.length === 1
    ) {

        /*
           32% → try two photos.
        */

        if (
            Math.random() <
            ONE_TO_TWO_CHANCE
        ) {

            return {

                amount: 2,

                overlap:
                    SECOND_OVERLAP_CHANCE,

                third: false

            };

        }


        return {

            amount: 1,

            overlap: 0,

            third: false

        };

    }


    /*
       =====================================================
       TWO PHOTOS
       =====================================================
    */

    if (
        active.length === 2
    ) {

        /*
           12% → try a third.
        */

        if (
            Math.random() <
            TWO_TO_THREE_CHANCE
        ) {

            return {

                amount: 1,

                overlap:
                    THIRD_OVERLAP_CHANCE,

                third: true

            };

        }


        /*
           Otherwise:

           Don't automatically add anything.
        */

        return {

            amount: 0,

            overlap: 0,

            third: false

        };

    }


    /*
       =====================================================
       THREE PHOTOS
       =====================================================
    */

    return {

        amount: 0,

        overlap: 0,

        third: false

    };

}


/* =========================================================
   MAIN DICE LOOP
========================================================= */

function roll() {

    /*
       First random number:

       how long before the next
       decision?
    */

    const delay =
        random(
            MIN_ROLL,
            MAX_ROLL
        );


    setTimeout(
        async () => {


            /*
               =================================================
               DICE #1
               =================================================

               Do we want to generate?
            */

            const wantsGeneration =
                Math.random() <
                GENERATE_CHANCE;


            if (
                !wantsGeneration
            ) {

                /*
                   Nothing happens.
                */

                roll();

                return;

            }


            /*
               =================================================
               DICE #2
               =================================================

               What are we trying to create?
            */

            const decision =
                decideGeneration();


            if (
                decision.amount <= 0
            ) {

                /*
                   Three photos already exist,
                   or two photos decided not to
                   receive a third.

                   Nothing forced here.
                */

                roll();

                return;

            }


            /*
               =================================================
               DICE #3
               =================================================

               Spatial analysis.

               But the result of that analysis
               does NOT automatically end the
               decision.

               There is another random chance
               to force it.
               =================================================
            */


            /*
               -----------------------------------------------
               FIRST PHOTO
               -----------------------------------------------
            */

            if (
                decision.amount >= 1
            ) {

                let force = false;


                /*
                   If the composition is already
                   difficult, there is still a
                   small chance of forcing.
                */

                if (
                    Math.random() <
                    FORCE_GENERATION_CHANCE
                ) {

                    force = true;

                }


                await addPhoto(
                    decision.overlap,
                    decision.third,
                    force
                );

            }


            /*
               -----------------------------------------------
               SECOND PHOTO
               -----------------------------------------------

               If the decision asked for TWO photos,
               we now run the spatial calculation AGAIN.

               It sees the first newly-created photo.
               */

            if (
                decision.amount >= 2 &&
                active.length <
                MAX_PHOTOS
            ) {

                let force = false;


                if (
                    Math.random() <
                    FORCE_GENERATION_CHANCE
                ) {

                    force = true;

                }


                await addPhoto(
                    SECOND_OVERLAP_CHANCE,
                    false,
                    force
                );

            }


            /*
               =================================================
               FINAL SAFETY
               =================================================
            */

            if (
                active.length === 0
            ) {

                await addPhoto(
                    0,
                    false,
                    true
                );

            }


            /*
               =================================================
               NEXT DICE ROLL
               =================================================
            */

            roll();


        },
        delay
    );

}


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreenButton =
    document.getElementById(
        "fullscreen"
    );


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document
                    .documentElement
                    .requestFullscreen();

            }

            else {

                await document
                    .exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPhotos();
