<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    touch-action: none;
}

#journal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.photo {
    position: absolute;
    display: block;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

#fullscreen {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    background: transparent;
    opacity: 0.07;
    z-index: 1000;
    cursor: pointer;
}

#fullscreen:hover {
    opacity: 0.25;
}

#fullscreen svg {
    width: 18px;
    height: 18px;
}

:fullscreen #fullscreen {
    opacity: 0;
}

</style>

</head>

<body>

<div id="journal"></div>

<button id="fullscreen">

<svg viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5">

<path d="M4 9V4h5"/>
<path d="M20 9V4h-5"/>
<path d="M4 15v5h5"/>
<path d="M20 15v5h-5"/>

</svg>

</button>


<script>


/* =========================================================
   GITHUB
========================================================= */

const API =
"https://api.github.com/repos/" +
"guillaumelupin/" +
"guillaumelupin.github.io/" +
"contents/photos/journal?ref=main";


/* =========================================================
   GENERAL
========================================================= */

const MAX_PHOTOS = 3;


/* =========================================================
   PHOTO LIFETIME
========================================================= */

const MIN_LIFETIME = 4200;
const MAX_LIFETIME = 9000;

const RARE_LONG_CHANCE = 0.055;

const VERY_RARE_LONG_CHANCE = 0.008;


/* =========================================================
   EVENT FREQUENCY
========================================================= */

const MIN_EVENT_DELAY = 1400;
const MAX_EVENT_DELAY = 3300;


/* =========================================================
   OVERLAP
========================================================= */

/*
   When adding the SECOND photo:
   7% chance of overlap.
*/

const SECOND_PHOTO_OVERLAP = 0.07;


/*
   When adding the THIRD photo:
   30% chance of overlap.
*/

const THIRD_PHOTO_OVERLAP = 0.30;


/*
   Extremely rare exceptional overlap.
*/

const RARE_OVERLAP_CHANCE = 0.004;


/* =========================================================
   VARIABLES
========================================================= */

const journal =
document.getElementById("journal");

let photos = [];

let activePhotos = [];

let recentPhotos = [];

let busy = false;


/* =========================================================
   RANDOM
========================================================= */

function random(min, max) {

    return Math.random() *
        (max - min) + min;

}

function randomInt(min, max) {

    return Math.floor(
        random(min, max + 1)
    );

}


/* =========================================================
   PRELOAD
========================================================= */

function preloadImage(src) {

    return new Promise(resolve => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = () => resolve(null);

        img.src = src;

    });

}


/* =========================================================
   LOAD PHOTOS
========================================================= */

async function loadPhotos() {

    try {

        const response =
            await fetch(API);

        if (!response.ok) {
            throw new Error("GitHub API error");
        }

        const files =
            await response.json();


        photos = files

            .filter(file =>
                file.type === "file" &&
                /\.(jpg|jpeg|png|webp|gif)$/i
                    .test(file.name)
            )

            .map(file =>
                "https://raw.githubusercontent.com/" +
                "guillaumelupin/" +
                "guillaumelupin.github.io/" +
                "main/photos/journal/" +
                encodeURIComponent(file.name)
            );


        await initialComposition();

        scheduleEvent();

    }

    catch (error) {

        console.error(
            "Journal error:",
            error
        );

    }

}


/* =========================================================
   CHOOSE PHOTO
========================================================= */

function choosePhoto() {

    if (!photos.length) {
        return null;
    }


    const candidates = [];


    for (const src of photos) {

        let weight = 100;


        /*
           Strongly discourage the last photo.
        */

        if (
            recentPhotos.length >= 1 &&
            src === recentPhotos[
                recentPhotos.length - 1
            ]
        ) {

            weight = 3;

        }


        /*
           Discourage the previous one.
        */

        else if (
            recentPhotos.length >= 2 &&
            src === recentPhotos[
                recentPhotos.length - 2
            ]
        ) {

            weight = 20;

        }


        for (
            let i = 0;
            i < weight;
            i++
        ) {

            candidates.push(src);

        }

    }


    return candidates[
        randomInt(
            0,
            candidates.length - 1
        )
    ];

}


/* =========================================================
   COLLISION
========================================================= */

function overlaps(a, b) {

    return (

        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y

    );

}


/* =========================================================
   POSITION
========================================================= */

function findPosition(
    width,
    height,
    overlapChance
) {


    /*
       Rare exceptional overlap.
    */

    if (
        Math.random() <
        RARE_OVERLAP_CHANCE
    ) {

        overlapChance = 0.25;

    }


    const mayOverlap =
        Math.random() <
        overlapChance;


    for (
        let attempt = 0;
        attempt < 700;
        attempt++
    ) {

        const position = {

            x: random(
                2,
                98 - width
            ),

            y: random(
                2,
                98 - height
            ),

            w: width,
            h: height

        };


        /*
           Intentional overlap.
        */

        if (mayOverlap) {

            return position;

        }


        let collision = false;


        for (
            const active
            of activePhotos
        ) {

            if (
                overlaps(
                    position,
                    active.position
                )
            ) {

                collision = true;
                break;

            }

        }


        if (!collision) {

            return position;

        }

    }


    return null;

}


/* =========================================================
   SIZE
========================================================= */

function getSize() {

    const mobile =
        window.innerWidth < 600;


    /*
       THIRD PHOTO:
       considerably smaller so that
       three images can coexist.
    */

    if (
        activePhotos.length >= 2
    ) {

        return {

            width: mobile
                ? random(25, 39)
                : random(22, 36),

            height: mobile
                ? random(25, 42)
                : random(23, 40)

        };

    }


    /*
       Most photos are large.
    */

    const r = Math.random();


    /*
       12% medium.
    */

    if (r < 0.12) {

        return {

            width: mobile
                ? random(43, 58)
                : random(34, 49),

            height: mobile
                ? random(42, 60)
                : random(35, 55)

        };

    }


    /*
       88% large.
    */

    return {

        width: mobile
            ? random(55, 82)
            : random(42, 70),

        height: mobile
            ? random(52, 79)
            : random(43, 74)

    };

}


/* =========================================================
   LIFETIME
========================================================= */

function getLifetime() {

    /*
       Extremely rare:
       15–20 seconds.
    */

    if (
        Math.random() <
        VERY_RARE_LONG_CHANCE
    ) {

        return random(
            15000,
            20000
        );

    }


    /*
       Rare:
       9–15 seconds.
    */

    if (
        Math.random() <
        RARE_LONG_CHANCE
    ) {

        return random(
            9000,
            15000
        );

    }


    /*
       Normal:
       4.2–9 seconds.
    */

    return random(
        MIN_LIFETIME,
        MAX_LIFETIME
    );

}


/* =========================================================
   SPAWN PHOTO
========================================================= */

async function spawnPhoto(
    overlapChance = 0
) {

    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const src =
        choosePhoto();


    if (!src) {
        return false;
    }


    /*
       FULL PRELOAD.

       Nothing is displayed before
       the image is completely loaded.
    */

    const loaded =
        await preloadImage(src);


    if (!loaded) {
        return false;
    }


    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const size =
        getSize();


    const position =
        findPosition(
            size.width,
            size.height,
            overlapChance
        );


    if (!position) {
        return false;
    }


    const img =
        document.createElement("img");


    img.className =
        "photo";

    img.src =
        loaded.src;

    img.draggable =
        false;


    img.style.left =
        position.x + "%";

    img.style.top =
        position.y + "%";

    img.style.width =
        position.w + "%";

    img.style.height =
        position.h + "%";


    journal.appendChild(img);


    const active = {

        element: img,

        src: src,

        position: position

    };


    activePhotos.push(active);


    recentPhotos.push(src);


    if (
        recentPhotos.length > 3
    ) {

        recentPhotos.shift();

    }


    /*
       Timer begins AFTER loading.
    */

    const lifetime =
        getLifetime();


    setTimeout(() => {

        img.remove();


        activePhotos =
            activePhotos.filter(
                item =>
                    item !== active
            );


        /*
           Never allow a blank screen.
        */

        if (
            activePhotos.length === 0
        ) {

            spawnPhoto();

        }

    }, lifetime);


    return true;

}


/* =========================================================
   INITIAL COMPOSITION
========================================================= */

async function initialComposition() {

    const r =
        Math.random();


    /*
       50% = one photo
       47% = two photos
       3%  = three photos
    */

    let amount;


    if (r < 0.50) {

        amount = 1;

    }

    else if (r < 0.97) {

        amount = 2;

    }

    else {

        amount = 3;

    }


    const jobs = [];


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        /*
           Initial second/third photos
           use the same overlap rules.
        */

        let overlap = 0;


        if (i === 1) {

            overlap =
                SECOND_PHOTO_OVERLAP;

        }


        if (i === 2) {

            overlap =
                THIRD_PHOTO_OVERLAP;

        }


        jobs.push(
            spawnPhoto(overlap)
        );

    }


    await Promise.all(jobs);


    if (
        activePhotos.length === 0
    ) {

        await spawnPhoto();

    }

}


/* =========================================================
   EVENT SYSTEM
========================================================= */

async function runEvent() {

    if (busy) {
        return;
    }


    busy = true;


    const count =
        activePhotos.length;


    /* =====================================================
       ONE PHOTO → POSSIBLY TWO
    ===================================================== */

    if (count === 1) {

        const r =
            Math.random();


        /*
           30% chance of adding
           a second photo.
        */

        if (r < 0.30) {

            await spawnPhoto(
                SECOND_PHOTO_OVERLAP
            );

        }


        /*
           Rare simultaneous creation
           of TWO additional photos.

           This creates a three-photo
           composition.
        */

        else if (r < 0.34) {

            await Promise.all([

                spawnPhoto(
                    SECOND_PHOTO_OVERLAP
                ),

                spawnPhoto(
                    THIRD_PHOTO_OVERLAP
                )

            ]);

        }

    }


    /* =====================================================
       TWO PHOTOS → POSSIBLY THREE
    ===================================================== */

    else if (count === 2) {

        const r =
            Math.random();


        /*
           10% chance of a third photo.
        */

        if (r < 0.10) {

            await spawnPhoto(
                THIRD_PHOTO_OVERLAP
            );

        }


        /*
           Additional organic change.

           Sometimes one photo disappears
           and is immediately replaced.
        */

        else if (r < 0.25) {

            const victim =
                activePhotos[
                    randomInt(
                        0,
                        activePhotos.length - 1
                    )
                ];


            if (victim) {

                victim.element.remove();


                activePhotos =
                    activePhotos.filter(
                        item =>
                            item !== victim
                    );

            }


            await spawnPhoto(
                SECOND_PHOTO_OVERLAP
            );

        }

    }


    /* =====================================================
       THREE PHOTOS
    ===================================================== */

    else {

        /*
           Do not add a fourth.

           Photos disappear naturally,
           allowing the composition to
           evolve back toward 1 or 2.
        */

    }


    /*
       Safety.
    */

    if (
        activePhotos.length === 0
    ) {

        await spawnPhoto();

    }


    busy = false;

}


/* =========================================================
   EVENT SCHEDULER
========================================================= */

function scheduleEvent() {

    const delay =
        random(
            MIN_EVENT_DELAY,
            MAX_EVENT_DELAY
        );


    setTimeout(async () => {

        await runEvent();

        scheduleEvent();

    }, delay);

}


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreenButton =
    document.getElementById(
        "fullscreen"
    );


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            }

            else {

                await document.exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen unavailable:",
                error
            );

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPhotos();

</script>

</body>

</html>
