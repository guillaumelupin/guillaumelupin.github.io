<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
}

#journal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.photo {
    position: absolute;
    display: block;

    object-fit: contain;

    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}


/* ================================
   FULLSCREEN BUTTON
================================ */

#fullscreen {
    position: fixed;

    top: 12px;
    right: 12px;

    width: 28px;
    height: 28px;

    padding: 0;

    border: none;

    background: transparent;

    opacity: 0.16;

    z-index: 1000;

    cursor: pointer;

    transition: opacity 0.4s;
}

#fullscreen:hover {
    opacity: 0.4;
}

#fullscreen svg {
    width: 18px;
    height: 18px;
}

:fullscreen #fullscreen {
    opacity: 0;
}

</style>

</head>

<body>

<div id="journal"></div>


<button id="fullscreen"
        aria-label="Fullscreen">

<svg viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5">

<path d="M4 9V4h5"/>
<path d="M20 9V4h-5"/>
<path d="M4 15v5h5"/>
<path d="M20 15v5h-5"/>

</svg>

</button>


<script>


/* =========================================
   SETTINGS
========================================= */

const API =
"https://api.github.com/repos/" +
"guillaumelupin/" +
"guillaumelupin.github.io/" +
"contents/photos/journal?ref=main";


/*
   Maximum number of photos visible.
*/

const MAX_PHOTOS = 3;


/*
   How long each photo stays visible
   AFTER it has finished loading.
*/

const MIN_LIFETIME = 4000;

const MAX_LIFETIME = 12000;


/*
   Delay before trying to introduce
   another photo.
*/

const MOBILE_MIN_DELAY = 2000;
const MOBILE_MAX_DELAY = 5000;

const DESKTOP_MIN_DELAY = 2000;
const DESKTOP_MAX_DELAY = 7000;


/*
   Probability of allowing overlap.
*/

const OVERLAP_CHANCE = 0.15;


/*
   We prefer keeping the screen populated.

   If there is only one photo,
   the next appearance is almost guaranteed.

   If there are two photos,
   the probability is still high.

   If there are three,
   nothing is added.
*/

const ONE_PHOTO_CHANCE = 0.95;
const TWO_PHOTO_CHANCE = 0.75;


/* =========================================
   VARIABLES
========================================= */

const journal =
document.getElementById("journal");

let photos = [];

let activePhotos = [];

let recentPhotos = [];


/*
   Prevent several spawn operations
   from happening simultaneously.
*/

let loadingPhoto = false;


/* =========================================
   RANDOM
========================================= */

function random(min, max) {

    return Math.random() *
    (max - min) + min;

}


function randomInt(min, max) {

    return Math.floor(
        random(min, max + 1)
    );

}


/* =========================================
   PRELOAD
========================================= */

function preloadImage(src) {

    return new Promise(resolve => {

        const img =
        new Image();


        img.onload = () => {

            resolve(img);

        };


        img.onerror = () => {

            /*
               Don't remove the image
               from the collection.
            */

            resolve(null);

        };


        img.src = src;

    });

}


/* =========================================
   LOAD PHOTO LIST
========================================= */

async function loadPhotos() {

    try {

        const response =
        await fetch(API);


        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }


        const files =
        await response.json();


        photos = files

        .filter(file =>
            file.type === "file" &&
            /\.(jpg|jpeg|png|webp|gif)$/i
            .test(file.name)
        )

        .map(file =>
            "https://raw.githubusercontent.com/" +
            "guillaumelupin/" +
            "guillaumelupin.github.io/" +
            "main/photos/journal/" +
            encodeURIComponent(file.name)
        );


        /*
           Immediately populate the screen.
        */

        await populateInitialScreen();


        /*
           Then begin the organic cycle.
        */

        scheduleNextSpawn();


    } catch (error) {

        console.error(
            "Could not load Journal:",
            error
        );

    }

}


/* =========================================
   CHOOSE PHOTO
========================================= */

function choosePhoto() {

    if (photos.length === 0) {

        return null;

    }


    /*
       Avoid the same photo being selected
       three times consecutively.
    */

    let candidates =
    photos.filter(src =>
        !recentPhotos.includes(src)
    );


    /*
       If the collection is very small,
       relax the restriction.
    */

    if (candidates.length === 0) {

        candidates = [...photos];

    }


    return candidates[
        randomInt(
            0,
            candidates.length - 1
        )
    ];

}


/* =========================================
   OVERLAP
========================================= */

function overlaps(a, b) {

    return (

        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y

    );

}


/* =========================================
   FIND POSITION
========================================= */

function findPosition(width, height) {

    /*
       Sometimes overlap is intentionally
       permitted.
    */

    const allowOverlap =
    Math.random() < OVERLAP_CHANCE;


    for (
        let attempt = 0;
        attempt < 100;
        attempt++
    ) {


        const position = {

            x: random(
                2,
                98 - width
            ),

            y: random(
                2,
                98 - height
            ),

            w: width,
            h: height

        };


        /*
           Allow occasional overlap.
        */

        if (allowOverlap) {

            return position;

        }


        let collision = false;


        for (const active of activePhotos) {

            if (
                overlaps(
                    position,
                    active.position
                )
            ) {

                collision = true;

                break;

            }

        }


        if (!collision) {

            return position;

        }

    }


    /*
       If no position can be found,
       allow overlap.
    */

    return {

        x: random(
            2,
            98 - width
        ),

        y: random(
            2,
            98 - height
        ),

        w: width,
        h: height

    };

}


/* =========================================
   CREATE PHOTO
========================================= */

async function spawnPhoto() {

    if (
        loadingPhoto ||
        activePhotos.length >= MAX_PHOTOS
    ) {

        return;

    }


    loadingPhoto = true;


    const src =
    choosePhoto();


    if (!src) {

        loadingPhoto = false;

        return;

    }


    /*
       Load the entire image BEFORE
       displaying it.
    */

    const loaded =
    await preloadImage(src);


    loadingPhoto = false;


    /*
       Failed loading is simply ignored
       for this attempt.

       The photo remains in the list.
    */

    if (!loaded) {

        return;

    }


    /*
       Another photo might have appeared
       while this one was loading.
    */

    if (
        activePhotos.length >= MAX_PHOTOS
    ) {

        return;

    }


    /* =====================================
       RANDOM SIZE
    ===================================== */

    const mobile =
    window.innerWidth < 600;


    let width;
    let height;


    if (mobile) {

        /*
           Larger average size on phones.
        */

        width =
        random(42, 72);

        height =
        random(35, 65);

    } else {

        width =
        random(30, 55);

        height =
        random(30, 65);

    }


    /*
       Never let the bounding box exceed
       the screen.
    */

    width =
    Math.min(width, 88);

    height =
    Math.min(height, 88);


    const position =
    findPosition(
        width,
        height
    );


    /* =====================================
       CREATE ELEMENT
    ===================================== */

    const img =
    document.createElement("img");


    img.className =
    "photo";


    /*
       Already completely loaded.
    */

    img.src =
    loaded.src;


    img.draggable =
    false;


    img.style.left =
    position.x + "%";


    img.style.top =
    position.y + "%";


    img.style.width =
    position.w + "%";


    img.style.height =
    position.h + "%";


    /*
       Insert into page.

       It appears immediately.
    */

    journal.appendChild(img);


    /* =====================================
       REGISTER
    ===================================== */

    const active = {

        element: img,

        src: src,

        position: position

    };


    activePhotos.push(active);


    /*
       Remember last two photos.
    */

    recentPhotos.push(src);


    if (
        recentPhotos.length > 2
    ) {

        recentPhotos.shift();

    }


    /* =====================================
       RANDOM LIFETIME
    ===================================== */

    const lifetime =
    random(
        MIN_LIFETIME,
        MAX_LIFETIME
    );


    /*
       Countdown begins HERE,
       after the image is visible.
    */

    setTimeout(() => {

        img.remove();


        activePhotos =
        activePhotos.filter(
            item =>
            item !== active
        );


    }, lifetime);

}


/* =========================================
   INITIAL SCREEN
========================================= */

async function populateInitialScreen() {

    /*
       Start with 2 or 3 photos.

       They are loaded one by one,
       but each appears only when complete.
    */

    const target =
    Math.min(
        photos.length,
        Math.random() < 0.75 ? 3 : 2
    );


    for (
        let i = 0;
        i < target;
        i++
    ) {

        await spawnPhoto();

    }

}


/* =========================================
   SHOULD SPAWN?
========================================= */

function shouldSpawn() {

    const count =
    activePhotos.length;


    /*
       3 photos = no new photo.
    */

    if (
        count >= MAX_PHOTOS
    ) {

        return false;

    }


    /*
       0 photos = always spawn.
    */

    if (count === 0) {

        return true;

    }


    /*
       1 photo = very likely to add one.
    */

    if (count === 1) {

        return (
            Math.random() <
            ONE_PHOTO_CHANCE
        );

    }


    /*
       2 photos = likely to add one,
       but not guaranteed.
    */

    if (count === 2) {

        return (
            Math.random() <
            TWO_PHOTO_CHANCE
        );

    }


    return false;

}


/* =========================================
   SCHEDULE NEXT SPAWN
========================================= */

function scheduleNextSpawn() {

    const mobile =
    window.innerWidth < 600;


    let delay;


    if (mobile) {

        delay =
        random(
            MOBILE_MIN_DELAY,
            MOBILE_MAX_DELAY
        );

    } else {

        delay =
        random(
            DESKTOP_MIN_DELAY,
            DESKTOP_MAX_DELAY
        );

    }


    setTimeout(async () => {


        /*
           If there is room, decide randomly
           whether to add another photo.
        */

        if (
            shouldSpawn()
        ) {

            await spawnPhoto();

        }


        /*
           Schedule the next independent
           decision.
        */

        scheduleNextSpawn();


    }, delay);

}


/* =========================================
   FULLSCREEN
========================================= */

const fullscreenButton =
document.getElementById(
    "fullscreen"
);


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                .requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Fullscreen unavailable:",
                error
            );

        }

    }
);


/* =========================================
   START
========================================= */

loadPhotos();

</script>

</body>
</html>
