<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #ffffff;

    touch-action: none;
}

#journal {
    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}

.photo {

    position: absolute;

    display: block;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

    pointer-events: none;
}

#fullscreen {

    position: fixed;

    top: 12px;
    right: 12px;

    width: 28px;
    height: 28px;

    padding: 0;

    border: 0;

    background: transparent;

    opacity: 0.06;

    z-index: 9999;

    cursor: pointer;
}

#fullscreen:hover {
    opacity: 0.20;
}

#fullscreen svg {

    width: 18px;
    height: 18px;
}

:fullscreen #fullscreen {
    opacity: 0;
}

</style>

</head>


<body>


<div id="journal"></div>


<button id="fullscreen">

    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.5">

        <path d="M4 9V4h5"/>
        <path d="M20 9V4h-5"/>
        <path d="M4 15v5h5"/>
        <path d="M20 15v5h-5"/>

    </svg>

</button>


<script>


/* =========================================================
   GITHUB FOLDER
========================================================= */

const API =
    "https://api.github.com/repos/" +
    "guillaumelupin/" +
    "guillaumelupin.github.io/" +
    "contents/photos/journal?ref=main";


/* =========================================================
   BASIC SETTINGS
========================================================= */

const MAX_PHOTOS = 3;


/*
   The system makes a new decision every
   5–9 seconds.

   This is deliberately calmer.
*/

const MIN_ROLL = 5000;
const MAX_ROLL = 9000;


/*
   Most rolls can generate something,
   but not every roll has to.
*/

const GENERATE_CHANCE = 0.82;


/* =========================================================
   NUMBER OF PHOTOS
========================================================= */


/*
   With one photo:

   32% chance that TWO new photos
   arrive together.

   Otherwise one.
*/

const ONE_TO_TWO_CHANCE = 0.32;


/*
   With two photos:

   12% chance of a third.
*/

const TWO_TO_THREE_CHANCE = 0.12;


/* =========================================================
   OVERLAP
========================================================= */


/*
   VERY RARE.

   Second photo:
   almost always separate.
*/

const SECOND_OVERLAP_CHANCE = 0.01;


/*
   Third photo:
   somewhat more likely to overlap,
   but still rare.
*/

const THIRD_OVERLAP_CHANCE = 0.05;


/*
   Very rare special event.
*/

const RARE_OVERLAP_CHANCE = 0.002;


/*
   Maximum actual overlap.

   Even if overlap is selected,
   it cannot become a giant collision.
*/

const MAX_NORMAL_OVERLAP = 0.04;

const MAX_THIRD_OVERLAP = 0.10;


/* =========================================================
   PHOTO LIFETIME
========================================================= */


/*
   Normal:

   5.5–11 seconds.
*/

const NORMAL_MIN = 5500;
const NORMAL_MAX = 11000;


/*
   Rare:

   11–16 seconds.
*/

const LONG_CHANCE = 0.04;

const LONG_MIN = 11000;
const LONG_MAX = 16000;


/*
   Extremely rare:

   16–22 seconds.
*/

const VERY_LONG_CHANCE = 0.006;

const VERY_LONG_MIN = 16000;
const VERY_LONG_MAX = 22000;


/* =========================================================
   PHOTO MEMORY
========================================================= */

const viewCount = new Map();

let recent = [];

let displayedSinceCheck = 0;


/*
   Roughly every 35–45 displayed photos,
   unseen photos are given priority.
*/

const MIN_FORCED_CHECK = 35;
const MAX_FORCED_CHECK = 45;

let nextForcedCheck =
    randomInt(
        MIN_FORCED_CHECK,
        MAX_FORCED_CHECK
    );


/* =========================================================
   VARIABLES
========================================================= */

let photos = [];

let active = [];


/* =========================================================
   RANDOM FUNCTIONS
========================================================= */

function random(min, max) {

    return Math.random() *
        (max - min) + min;

}


function randomInt(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImage(src) {

    return new Promise(resolve => {

        const image =
            new Image();


        image.onload = () => {

            resolve(image);

        };


        image.onerror = () => {

            /*
               NEVER remove the photo
               from the archive.
            */

            resolve(null);

        };


        image.src = src;

    });

}


/* =========================================================
   LOAD FILE LIST
========================================================= */

async function loadPhotos() {

    try {

        const response =
            await fetch(API);


        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }


        const files =
            await response.json();


        photos = files

            .filter(file =>

                file.type === "file" &&

                /\.(jpg|jpeg|png|webp|gif)$/i
                    .test(file.name)

            )

            .map(file =>

                "https://raw.githubusercontent.com/" +
                "guillaumelupin/" +
                "guillaumelupin.github.io/" +
                "main/photos/journal/" +
                encodeURIComponent(
                    file.name
                )

            );


        for (
            const src of photos
        ) {

            viewCount.set(
                src,
                0
            );

        }


        console.log(
            "Journal:",
            photos.length,
            "photos found."
        );


        await createInitialComposition();


        roll();

    }

    catch (error) {

        console.error(
            "Journal error:",
            error
        );

    }

}


/* =========================================================
   PHOTO SELECTION
========================================================= */

function choosePhoto() {

    if (
        photos.length === 0
    ) {

        return null;

    }


    /*
       ================================================
       FORCED ARCHIVE ROTATION
       ================================================
    */

    if (
        displayedSinceCheck >=
        nextForcedCheck
    ) {


        const unseen =
            photos.filter(
                src =>
                    (viewCount.get(src) || 0)
                    === 0
            );


        if (
            unseen.length > 0
        ) {

            return unseen[
                randomInt(
                    0,
                    unseen.length - 1
                )
            ];

        }


        /*
           If everything has been seen,
           favour the least-viewed photos.
        */

        let minimum =
            Infinity;


        for (
            const src of photos
        ) {

            const count =
                viewCount.get(src) || 0;


            if (
                count < minimum
            ) {

                minimum = count;

            }

        }


        const leastSeen =
            photos.filter(
                src =>
                    (viewCount.get(src) || 0)
                    === minimum
            );


        if (
            leastSeen.length > 0
        ) {

            return leastSeen[
                randomInt(
                    0,
                    leastSeen.length - 1
                )
            ];

        }

    }


    /*
       ================================================
       NORMAL WEIGHTED RANDOM
       ================================================
    */

    const pool = [];


    for (
        const src of photos
    ) {

        let weight = 100;


        const count =
            viewCount.get(src) || 0;


        /*
           Photos never seen get a bonus.
        */

        if (
            count === 0
        ) {

            weight = 180;

        }


        /*
           Never allow three consecutive
           appearances of the same photo.
        */

        if (

            recent.length >= 2 &&

            recent[
                recent.length - 1
            ] === src &&

            recent[
                recent.length - 2
            ] === src

        ) {

            weight = 0;

        }


        /*
           Twice consecutively is possible,
           but very unlikely.
        */

        else if (

            recent.length >= 1 &&

            recent[
                recent.length - 1
            ] === src

        ) {

            weight *= 0.08;

        }


        /*
           Recently seen photos are discouraged.
        */

        else if (

            recent.length >= 2 &&

            recent[
                recent.length - 2
            ] === src

        ) {

            weight *= 0.30;

        }


        /*
           Balance the archive over time.
        */

        if (
            count > 0
        ) {

            weight *=
                1 /
                Math.sqrt(count);

        }


        for (
            let i = 0;
            i < Math.max(
                0,
                Math.round(weight)
            );
            i++
        ) {

            pool.push(src);

        }

    }


    if (
        pool.length === 0
    ) {

        return photos[
            randomInt(
                0,
                photos.length - 1
            )
        ];

    }


    return pool[
        randomInt(
            0,
            pool.length - 1
        )
    ];

}


/* =========================================================
   PHOTO SIZE
========================================================= */

function getSize(
    numberOfPhotos
) {

    const mobile =
        window.innerWidth < 600;


    /*
       Three-photo compositions
       are necessarily smaller.
    */

    if (
        numberOfPhotos >= 3
    ) {

        return {

            w: mobile
                ? random(25, 40)
                : random(22, 38),

            h: mobile
                ? random(26, 42)
                : random(23, 40)

        };

    }


    /*
       Large photos are dominant.
    */

    if (
        Math.random() < 0.88
    ) {

        return {

            w: mobile
                ? random(54, 84)
                : random(44, 72),

            h: mobile
                ? random(54, 82)
                : random(44, 75)

        };

    }


    /*
       Occasional medium photo.
    */

    return {

        w: mobile
            ? random(42, 60)
            : random(34, 52),

        h: mobile
            ? random(42, 60)
            : random(35, 54)

    };

}


/* =========================================================
   INTERSECTION
========================================================= */

function intersection(a, b) {

    const x =
        Math.max(
            0,
            Math.min(
                a.x + a.w,
                b.x + b.w
            ) -
            Math.max(
                a.x,
                b.x
            )
        );


    const y =
        Math.max(
            0,
            Math.min(
                a.y + a.h,
                b.y + b.h
            ) -
            Math.max(
                a.y,
                b.y
            )
        );


    return x * y;

}


/* =========================================================
   FIND SAFE POSITION
========================================================= */

function findPosition(
    w,
    h,
    overlapChance,
    isThirdPhoto
) {


    /*
       Extremely rare overlap event.
    */

    if (
        Math.random() <
        RARE_OVERLAP_CHANCE
    ) {

        overlapChance = 1;

    }


    const wantsOverlap =
        Math.random() <
        overlapChance;


    let best = null;

    let bestOverlap =
        Infinity;


    /*
       A large number of attempts
       makes the algorithm genuinely
       aware of existing photos.
    */

    for (
        let i = 0;
        i < 2500;
        i++
    ) {


        const candidate = {

            x: random(
                2,
                98 - w
            ),

            y: random(
                2,
                98 - h
            ),

            w: w,

            h: h

        };


        let totalOverlap = 0;


        /*
           Compare with every active photo.
        */

        for (
            const item of active
        ) {

            totalOverlap +=
                intersection(
                    candidate,
                    item.position
                );

        }


        const ratio =
            totalOverlap /
            (w * h);


        /*
           ==============================================
           NORMAL
           ==============================================
        */

        if (!wantsOverlap) {

            /*
               Perfectly empty space.
            */

            if (
                totalOverlap === 0
            ) {

                return candidate;

            }


            if (
                ratio <
                bestOverlap
            ) {

                bestOverlap =
                    ratio;

                best =
                    candidate;

            }

        }


        /*
           ==============================================
           RARE OVERLAP
           ==============================================
        */

        else {

            const maximum =
                isThirdPhoto
                    ? MAX_THIRD_OVERLAP
                    : MAX_NORMAL_OVERLAP;


            if (

                ratio > 0 &&

                ratio <= maximum

            ) {

                return candidate;

            }

        }

    }


    /*
       If no perfect position was found,
       use the safest one.

       We do not deliberately create
       a pile of photos.
    */

    if (
        best &&
        bestOverlap < 0.03
    ) {

        return best;

    }


    /*
       Absolute safest fallback.
    */

    let safest = null;

    let safestOverlap =
        Infinity;


    for (
        let i = 0;
        i < 1500;
        i++
    ) {


        const candidate = {

            x: random(
                2,
                98 - w
            ),

            y: random(
                2,
                98 - h
            ),

            w: w,

            h: h

        };


        let totalOverlap = 0;


        for (
            const item of active
        ) {

            totalOverlap +=
                intersection(
                    candidate,
                    item.position
                );

        }


        const ratio =
            totalOverlap /
            (w * h);


        if (
            ratio <
            safestOverlap
        ) {

            safestOverlap =
                ratio;

            safest =
                candidate;

        }

    }


    return safest;

}


/* =========================================================
   LIFETIME
========================================================= */

function getLifetime() {


    /*
       Extremely rare:
       16–22 seconds.
    */

    if (
        Math.random() <
        VERY_LONG_CHANCE
    ) {

        return random(
            VERY_LONG_MIN,
            VERY_LONG_MAX
        );

    }


    /*
       Rare:
       11–16 seconds.
    */

    if (
        Math.random() <
        LONG_CHANCE
    ) {

        return random(
            LONG_MIN,
            LONG_MAX
        );

    }


    /*
       Normal:
       5.5–11 seconds.
    */

    return random(
        NORMAL_MIN,
        NORMAL_MAX
    );

}


/* =========================================================
   ADD PHOTO
========================================================= */

async function addPhoto(
    overlapChance = 0,
    isThirdPhoto = false
) {


    if (
        active.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const src =
        choosePhoto();


    if (!src) {

        return false;

    }


    /*
       FULL IMAGE LOAD BEFORE DISPLAY
    */

    const loaded =
        await loadImage(src);


    if (!loaded) {

        /*
           Keep the photo eligible.
        */

        return false;

    }


    const size =
        getSize(
            active.length + 1
        );


    const position =
        findPosition(
            size.w,
            size.h,
            overlapChance,
            isThirdPhoto
        );


    const img =
        document.createElement("img");


    img.className =
        "photo";


    img.src =
        loaded.src;


    img.draggable =
        false;


    img.style.left =
        position.x + "%";


    img.style.top =
        position.y + "%";


    img.style.width =
        position.w + "%";


    img.style.height =
        position.h + "%";


    journal.appendChild(img);


    const item = {

        element: img,

        src: src,

        position: position

    };


    active.push(item);


    /*
       ================================================
       MEMORY
       ================================================
    */

    const count =
        viewCount.get(src) || 0;


    viewCount.set(
        src,
        count + 1
    );


    displayedSinceCheck++;


    recent.push(src);


    if (
        recent.length > 3
    ) {

        recent.shift();

    }


    if (
        displayedSinceCheck >=
        nextForcedCheck
    ) {

        displayedSinceCheck = 0;


        nextForcedCheck =
            randomInt(
                MIN_FORCED_CHECK,
                MAX_FORCED_CHECK
            );

    }


    /*
       ================================================
       PHOTO LIFETIME
       ================================================
    */

    const lifetime =
        getLifetime();


    setTimeout(
        () => {

            removePhoto(item);

        },
        lifetime
    );


    return true;

}


/* =========================================================
   REMOVE PHOTO — ANTI BLANK SYSTEM
========================================================= */

async function removePhoto(item) {


    /*
       If this is NOT the last photo,
       removal is completely normal.
    */

    if (
        active.length > 1
    ) {

        item.element.remove();


        active =
            active.filter(
                x =>
                    x !== item
            );

        return;

    }


    /*
       =====================================================
       THIS IS THE IMPORTANT PART
       =====================================================

       There is only ONE photo left.

       We absolutely do NOT remove it
       until another photo is ready.
    */


    const src =
        choosePhoto();


    if (!src) {

        /*
           If there is somehow no photo
           available, keep the existing one.
        */

        setTimeout(
            () => removePhoto(item),
            2000
        );

        return;

    }


    /*
       Load the replacement FIRST.
    */

    const loaded =
        await loadImage(src);


    /*
       If loading fails:

       KEEP THE OLD PHOTO.

       Try again later.

       Therefore there is no white screen.
    */

    if (!loaded) {

        setTimeout(
            () => removePhoto(item),
            2000
        );

        return;

    }


    /*
       Determine new size and position.
    */

    const size =
        getSize(1);


    const position =
        findPosition(
            size.w,
            size.h,
            0,
            false
        );


    const newImg =
        document.createElement("img");


    newImg.className =
        "photo";


    newImg.src =
        loaded.src;


    newImg.draggable =
        false;


    newImg.style.left =
        position.x + "%";


    newImg.style.top =
        position.y + "%";


    newImg.style.width =
        position.w + "%";


    newImg.style.height =
        position.h + "%";


    /*
       Put the replacement on screen
       BEFORE removing the old photo.
    */

    journal.appendChild(
        newImg
    );


    /*
       Now it is safe to remove
       the old photo.
    */

    item.element.remove();


    active =
        active.filter(
            x =>
                x !== item
        );


    const newItem = {

        element: newImg,

        src: src,

        position: position

    };


    active.push(
        newItem
    );


    /*
       Memory.
    */

    const count =
        viewCount.get(src) || 0;


    viewCount.set(
        src,
        count + 1
    );


    displayedSinceCheck++;


    recent.push(src);


    if (
        recent.length > 3
    ) {

        recent.shift();

    }


    if (
        displayedSinceCheck >=
        nextForcedCheck
    ) {

        displayedSinceCheck = 0;


        nextForcedCheck =
            randomInt(
                MIN_FORCED_CHECK,
                MAX_FORCED_CHECK
            );

    }


    /*
       Start the lifetime ONLY NOW,
       once the replacement is actually
       visible.
    */

    const lifetime =
        getLifetime();


    setTimeout(
        () => {

            removePhoto(
                newItem
            );

        },
        lifetime
    );

}


/* =========================================================
   INITIAL COMPOSITION
========================================================= */

async function createInitialComposition() {


    /*
       Initial composition:

       45% → one
       48% → two
       7%  → three
    */

    const r =
        Math.random();


    let amount;


    if (
        r < 0.45
    ) {

        amount = 1;

    }

    else if (
        r < 0.93
    ) {

        amount = 2;

    }

    else {

        amount = 3;

    }


    const jobs = [];


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        if (
            i === 0
        ) {

            jobs.push(
                addPhoto(
                    0,
                    false
                )
            );

        }

        else if (
            i === 1
        ) {

            jobs.push(
                addPhoto(
                    SECOND_OVERLAP_CHANCE,
                    false
                )
            );

        }

        else {

            jobs.push(
                addPhoto(
                    THIRD_OVERLAP_CHANCE,
                    true
                )
            );

        }

    }


    await Promise.all(
        jobs
    );


    /*
       Absolute initial safety.
    */

    if (
        active.length === 0
    ) {

        await addPhoto(0);

    }

}


/* =========================================================
   DECIDE WHAT HAPPENS
========================================================= */

function decideGeneration() {


    /*
       ================================================
       ZERO
       ================================================
    */

    if (
        active.length === 0
    ) {

        return {

            amount: 1,

            overlap: 0,

            third: false

        };

    }


    /*
       ================================================
       ONE
       ================================================
    */

    if (
        active.length === 1
    ) {


        /*
           Sometimes two photos arrive together.
        */

        if (
            Math.random() <
            ONE_TO_TWO_CHANCE
        ) {

            return {

                amount: 2,

                overlap:
                    SECOND_OVERLAP_CHANCE,

                third: false

            };

        }


        return {

            amount: 1,

            overlap: 0,

            third: false

        };

    }


    /*
       ================================================
       TWO
       ================================================
    */

    if (
        active.length === 2
    ) {


        /*
           Occasionally create a third.
        */

        if (
            Math.random() <
            TWO_TO_THREE_CHANCE
        ) {

            return {

                amount: 1,

                overlap:
                    THIRD_OVERLAP_CHANCE,

                third: true

            };

        }


        /*
           Sometimes don't add anything.
        */

        return {

            amount: 0,

            overlap: 0,

            third: false

        };

    }


    /*
       ================================================
       THREE
       ================================================

       No fourth photo.
    */

    return {

        amount: 0,

        overlap: 0,

        third: false

    };

}


/* =========================================================
   RANDOM GENERATION LOOP
========================================================= */

function roll() {


    /*
       Calm random interval:
       5–9 seconds.
    */

    const delay =
        random(
            MIN_ROLL,
            MAX_ROLL
        );


    setTimeout(
        async () => {


            /*
               ==========================================
               DICE #1
               ==========================================
            */

            const generate =
                Math.random() <
                GENERATE_CHANCE;


            if (!generate) {

                roll();

                return;

            }


            /*
               ==========================================
               DICE #2
               ==========================================
            */

            const decision =
                decideGeneration();


            if (
                decision.amount <= 0
            ) {

                roll();

                return;

            }


            /*
               ==========================================
               GENERATE
               ==========================================
            */

            const jobs = [];


            for (
                let i = 0;
                i < decision.amount;
                i++
            ) {


                if (
                    i === 0
                ) {

                    jobs.push(
                        addPhoto(
                            decision.overlap,
                            decision.third === true
                        )
                    );

                }

                else {

                    jobs.push(
                        addPhoto(
                            decision.overlap,
                            false
                        )
                    );

                }

            }


            await Promise.all(
                jobs
            );


            /*
               Absolute safety.
            */

            if (
                active.length === 0
            ) {

                await addPhoto(0);

            }


            roll();


        },
        delay
    );

}


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreenButton =
    document.getElementById(
        "fullscreen"
    );


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            }

            else {

                await document.exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPhotos();

</script>

</body>

</html>
