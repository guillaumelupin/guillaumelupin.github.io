<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
}

#journal {
    position: fixed;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* =========================================================
   PHOTOS
   ========================================================= */

.photo {
    position: absolute;
    display: block;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

/* =========================================================
   FULLSCREEN
   ========================================================= */

#fullscreen {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    opacity: 0.05;
    z-index: 9999;
    cursor: pointer;
}

#fullscreen:hover {
    opacity: 0.18;
}

#fullscreen svg {
    width: 18px;
    height: 18px;
}

:fullscreen #fullscreen {
    opacity: 0;
}

</style>
</head>


<body>

<div id="journal"></div>

<button id="fullscreen" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.5">
        <path d="M4 9V4h5"/>
        <path d="M20 9V4h-5"/>
        <path d="M4 15v5h5"/>
        <path d="M20 15v5h-5"/>
    </svg>
</button>


<script>

/* =========================================================
   GITHUB
   ========================================================= */

const API =
    "https://api.github.com/repos/" +
    "guillaumelupin/" +
    "guillaumelupin.github.io/" +
    "contents/photos/journal?ref=main";


/* =========================================================
   GENERAL RULES
   ========================================================= */

const MAX_PHOTOS = 3;


/*
    The "dice" are thrown every 4–7 seconds.

    This is deliberately slower than before.
*/

const MIN_ROLL = 4000;
const MAX_ROLL = 7000;


/*
    Usually something happens,
    but sometimes the system simply waits.
*/

const GENERATE_CHANCE = 0.88;


/*
    IMPORTANT:

    If the screen already contains photos,
    we don't blindly add another one.

    The composition itself is taken into account.
*/


/* =========================================================
   HOW MANY PHOTOS CAN APPEAR
   ========================================================= */


/*
    With one photo already visible:

    30% → try to add TWO photos together
    70% → try to add ONE photo

    This makes two-photo moments genuinely common.
*/

const ONE_TO_TWO_CHANCE = 0.30;


/*
    With two photos visible:

    12% → try to add a third
    88% → don't add another one

    Three-photo compositions remain rare.
*/

const TWO_TO_THREE_CHANCE = 0.12;


/* =========================================================
   OVERLAP
   ========================================================= */


/*
    OVERLAP IS NOW VERY RARE.

    Second photo:
    only 3% chance of overlap.

    Third photo:
    8% chance.

    There is also an extremely rare 1% emergency
    override when the system really wants to place
    something despite space restrictions.
*/

const SECOND_OVERLAP_CHANCE = 0.03;
const THIRD_OVERLAP_CHANCE = 0.08;

const RARE_OVERLAP_OVERRIDE = 0.01;


/*
    Even when overlap is allowed,
    it must remain small.
*/

const MAX_NORMAL_OVERLAP = 0.045;
const MAX_THIRD_OVERLAP = 0.08;


/* =========================================================
   PHOTO LIFETIME
   ========================================================= */


/*
    NORMAL:

    Most photos stay around 6–9 seconds.
*/

const NORMAL_MIN = 6000;
const NORMAL_MAX = 9000;


/*
    Rare short appearance.

    Around 7% of photos can disappear sooner.
*/

const SHORT_CHANCE = 0.07;

const SHORT_MIN = 3500;
const SHORT_MAX = 6000;


/*
    Rare long appearance.

    Around 5% of photos can stay for 10–15 seconds.
*/

const LONG_CHANCE = 0.05;

const LONG_MIN = 10000;
const LONG_MAX = 15000;


/*
    Very rare "shiny".

    Around 0.8% can stay for 15–20 seconds.
*/

const VERY_LONG_CHANCE = 0.008;

const VERY_LONG_MIN = 15000;
const VERY_LONG_MAX = 20000;


/* =========================================================
   PHOTO MEMORY
   ========================================================= */


/*
    Keeps track of how often each photo has appeared.

    This prevents a small selection of photos from
    dominating the entire journal.
*/

const viewCount = new Map();

let recent = [];


/*
    Every 35–45 displayed photos,
    the system actively looks for a photo
    that has never been displayed.
*/

let displayedSinceCheck = 0;

const MIN_FORCED_CHECK = 35;
const MAX_FORCED_CHECK = 45;

let nextForcedCheck = randomInt(
    MIN_FORCED_CHECK,
    MAX_FORCED_CHECK
);


/* =========================================================
   VARIABLES
   ========================================================= */

let photos = [];
let active = [];


/* =========================================================
   RANDOM FUNCTIONS
   ========================================================= */

function random(min, max) {

    return Math.random() *
        (max - min) +
        min;
}


function randomInt(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;
}


/* =========================================================
   IMAGE LOADING
   ========================================================= */


/*
    The image is completely loaded BEFORE
    being inserted into the page.

    This prevents the visible
    top-to-bottom loading effect.
*/

function loadImage(src) {

    return new Promise(resolve => {

        const image = new Image();

        image.onload = () => {
            resolve(image);
        };

        image.onerror = () => {

            /*
                IMPORTANT:

                We DO NOT remove the photo
                from the archive.

                It can be retried later.
            */

            resolve(null);
        };

        image.src = src;
    });
}


/* =========================================================
   LOAD ALL PHOTOS FROM GITHUB
   ========================================================= */

async function loadPhotos() {

    try {

        const response =
            await fetch(API);

        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );
        }

        const files =
            await response.json();


        photos = files

            .filter(file =>
                file.type === "file" &&
                /\.(jpg|jpeg|png|webp|gif)$/i
                    .test(file.name)
            )

            .map(file =>
                "https://raw.githubusercontent.com/" +
                "guillaumelupin/" +
                "guillaumelupin.github.io/" +
                "main/photos/journal/" +
                encodeURIComponent(
                    file.name
                )
            );


        /*
            Initialise memory.
        */

        for (const src of photos) {

            viewCount.set(
                src,
                0
            );
        }


        console.log(
            "Journal:",
            photos.length,
            "photos found."
        );


        /*
            Start with a proper composition.
        */

        await createInitialComposition();


        /*
            Start the dice.
        */

        roll();

    }

    catch (error) {

        console.error(
            "Journal error:",
            error
        );
    }
}


/* =========================================================
   CHOOSE PHOTO
   ========================================================= */

function choosePhoto() {

    if (photos.length === 0) {
        return null;
    }


    /*
        Forced archive rotation.

        If we've shown enough photos,
        favour images that haven't appeared.
    */

    if (
        displayedSinceCheck >=
        nextForcedCheck
    ) {

        const unseen =
            photos.filter(
                src =>
                    (viewCount.get(src) || 0)
                    === 0
            );


        if (unseen.length > 0) {

            return unseen[
                randomInt(
                    0,
                    unseen.length - 1
                )
            ];
        }


        /*
            Everything has been seen.

            Find the least-viewed photos.
        */

        let minimum = Infinity;

        for (const src of photos) {

            const count =
                viewCount.get(src) || 0;

            if (count < minimum) {
                minimum = count;
            }
        }


        const leastSeen =
            photos.filter(
                src =>
                    (viewCount.get(src) || 0)
                    === minimum
            );


        if (leastSeen.length > 0) {

            return leastSeen[
                randomInt(
                    0,
                    leastSeen.length - 1
                )
            ];
        }
    }


    /*
        Normal weighted random selection.
    */

    const pool = [];


    for (const src of photos) {

        let weight = 100;

        const count =
            viewCount.get(src) || 0;


        /*
            Never-seen photos are strongly favoured.
        */

        if (count === 0) {
            weight = 220;
        }


        /*
            Never allow a photo to appear
            three times consecutively.
        */

        if (
            recent.length >= 2 &&
            recent[recent.length - 1] === src &&
            recent[recent.length - 2] === src
        ) {

            weight = 0;
        }


        /*
            Same photo twice consecutively
            is possible but rare.
        */

        else if (
            recent.length >= 1 &&
            recent[recent.length - 1] === src
        ) {

            weight *= 0.06;
        }


        /*
            Recently displayed photos
            are discouraged.
        */

        else if (
            recent.length >= 2 &&
            recent[recent.length - 2] === src
        ) {

            weight *= 0.25;
        }


        /*
            Photos that have appeared many times
            gradually become less likely.
        */

        if (count > 0) {

            weight *=
                1 /
                Math.sqrt(count);
        }


        for (
            let i = 0;
            i < Math.max(
                0,
                Math.round(weight)
            );
            i++
        ) {

            pool.push(src);
        }
    }


    if (pool.length === 0) {

        return photos[
            randomInt(
                0,
                photos.length - 1
            )
        ];
    }


    return pool[
        randomInt(
            0,
            pool.length - 1
        )
    ];
}


/* =========================================================
   PHOTO SIZE
   ========================================================= */

function getSize(numberOfPhotos) {

    const mobile =
        window.innerWidth < 600;


    /*
        THREE PHOTOS:

        They must be small enough to coexist.
    */

    if (numberOfPhotos >= 3) {

        return {

            w: mobile
                ? random(25, 38)
                : random(22, 35),

            h: mobile
                ? random(27, 42)
                : random(24, 40)
        };
    }


    /*
        TWO PHOTOS:

        Still fairly large.
    */

    if (numberOfPhotos === 2) {

        return {

            w: mobile
                ? random(42, 66)
                : random(36, 58),

            h: mobile
                ? random(44, 68)
                : random(38, 60)
        };
    }


    /*
        ONE PHOTO:

        LARGE images dominate.

        This remains the visual foundation
        of the journal.
    */

    if (Math.random() < 0.90) {

        return {

            w: mobile
                ? random(60, 88)
                : random(48, 76),

            h: mobile
                ? random(60, 88)
                : random(48, 78)
        };
    }


    /*
        Occasional medium image.
    */

    return {

        w: mobile
            ? random(45, 62)
            : random(36, 52),

        h: mobile
            ? random(45, 64)
            : random(36, 54)
    };
}


/* =========================================================
   RECTANGLE INTERSECTION
   ========================================================= */

function intersection(a, b) {

    const x =
        Math.max(
            0,
            Math.min(
                a.x + a.w,
                b.x + b.w
            )
            -
            Math.max(
                a.x,
                b.x
            )
        );


    const y =
        Math.max(
            0,
            Math.min(
                a.y + a.h,
                b.y + b.h
            )
            -
            Math.max(
                a.y,
                b.y
            )
        );


    return x * y;
}


/* =========================================================
   FIND POSITION
   ========================================================= */


/*
    THIS IS THE IMPORTANT PART.

    The system first tries very hard
    to find completely empty space.

    It does NOT simply accept overlap
    because overlap was requested.

    Overlap is a secondary possibility.
*/

function findPosition(
    w,
    h,
    overlapChance,
    isThirdPhoto
) {


    /*
        Small random chance to enter
        the overlap branch.

        Even here, it is still constrained.
    */

    let allowOverlap =
        Math.random() <
        overlapChance;


    /*
        1% emergency random event.

        This does NOT force huge overlap.
        It simply allows the algorithm
        to consider overlapping positions.
    */

    if (
        Math.random() <
        RARE_OVERLAP_OVERRIDE
    ) {

        allowOverlap = true;
    }


    /*
        =====================================================
        STEP 1
        SEARCH FOR COMPLETELY EMPTY SPACE
        =====================================================
    */

    let bestFree = null;


    for (
        let i = 0;
        i < 2500;
        i++
    ) {

        const candidate = {

            x: random(
                2,
                98 - w
            ),

            y: random(
                2,
                98 - h
            ),

            w: w,
            h: h
        };


        let totalOverlap = 0;


        for (
            const item of active
        ) {

            totalOverlap +=
                intersection(
                    candidate,
                    item.position
                );
        }


        /*
            Absolutely free space.
        */

        if (
            totalOverlap === 0
        ) {

            return candidate;
        }
    }


    /*
        =====================================================
        STEP 2
        NO FREE SPACE FOUND

        Only now do we consider overlap.
        =====================================================
    */

    if (allowOverlap) {

        const maximum =
            isThirdPhoto
                ? MAX_THIRD_OVERLAP
                : MAX_NORMAL_OVERLAP;


        let best = null;
        let bestRatio = Infinity;


        for (
            let i = 0;
            i < 2500;
            i++
        ) {

            const candidate = {

                x: random(
                    2,
                    98 - w
                ),

                y: random(
                    2,
                    98 - h
                ),

                w: w,
                h: h
            };


            let totalOverlap = 0;


            for (
                const item of active
            ) {

                totalOverlap +=
                    intersection(
                        candidate,
                        item.position
                    );
            }


            const ratio =
                totalOverlap /
                (w * h);


            /*
                Keep only small overlap.
            */

            if (
                ratio > 0 &&
                ratio <= maximum &&
                ratio < bestRatio
            ) {

                bestRatio = ratio;
                best = candidate;
            }
        }


        if (best) {
            return best;
        }
    }


    /*
        =====================================================
        STEP 3
        ABSOLUTE SAFETY

        If there genuinely isn't enough free space,
        choose the position with the smallest
        possible overlap.

        This prevents the algorithm from getting stuck.
        =====================================================
    */

    let safest = null;
    let safestOverlap = Infinity;


    for (
        let i = 0;
        i < 1500;
        i++
    ) {

        const candidate = {

            x: random(
                2,
                98 - w
            ),

            y: random(
                2,
                98 - h
            ),

            w: w,
            h: h
        };


        let totalOverlap = 0;


        for (
            const item of active
        ) {

            totalOverlap +=
                intersection(
                    candidate,
                    item.position
                );
        }


        const ratio =
            totalOverlap /
            (w * h);


        if (
            ratio <
            safestOverlap
        ) {

            safestOverlap = ratio;
            safest = candidate;
        }
    }


    return safest;
}


/* =========================================================
   LIFETIME
   ========================================================= */

function getLifetime() {


    /*
        VERY RARE SHINY
    */

    if (
        Math.random() <
        VERY_LONG_CHANCE
    ) {

        return random(
            VERY_LONG_MIN,
            VERY_LONG_MAX
        );
    }


    /*
        RARE LONG PHOTO
    */

    if (
        Math.random() <
        LONG_CHANCE
    ) {

        return random(
            LONG_MIN,
            LONG_MAX
        );
    }


    /*
        RARE SHORT PHOTO
    */

    if (
        Math.random() <
        SHORT_CHANCE
    ) {

        return random(
            SHORT_MIN,
            SHORT_MAX
        );
    }


    /*
        NORMAL
    */

    return random(
        NORMAL_MIN,
        NORMAL_MAX
    );
}


/* =========================================================
   ADD PHOTO
   ========================================================= */

async function addPhoto(
    overlapChance = 0,
    isThirdPhoto = false
) {


    /*
        Absolute maximum.
    */

    if (
        active.length >=
        MAX_PHOTOS
    ) {

        return false;
    }


    const src =
        choosePhoto();


    if (!src) {
        return false;
    }


    /*
        LOAD FIRST.
    */

    const loaded =
        await loadImage(src);


    /*
        If loading fails,
        keep the photo in the archive.
    */

    if (!loaded) {
        return false;
    }


    /*
        Determine size AFTER loading.
    */

    const size =
        getSize(
            active.length + 1
        );


    /*
        Position is calculated
        against ALL current photos.
    */

    const position =
        findPosition(
            size.w,
            size.h,
            overlapChance,
            isThirdPhoto
        );


    const img =
        document.createElement("img");


    img.className =
        "photo";


    img.src =
        loaded.src;


    img.draggable =
        false;


    img.style.left =
        position.x + "%";


    img.style.top =
        position.y + "%";


    img.style.width =
        position.w + "%";


    img.style.height =
        position.h + "%";


    journal.appendChild(img);


    const item = {

        element: img,

        src: src,

        position: position
    };


    active.push(item);


    /* =====================================================
       MEMORY
       ===================================================== */

    const count =
        viewCount.get(src) || 0;


    viewCount.set(
        src,
        count + 1
    );


    displayedSinceCheck++;


    recent.push(src);


    if (
        recent.length > 3
    ) {

        recent.shift();
    }


    /*
        Reset forced archive rotation.
    */

    if (
        displayedSinceCheck >=
        nextForcedCheck
    ) {

        displayedSinceCheck = 0;

        nextForcedCheck =
            randomInt(
                MIN_FORCED_CHECK,
                MAX_FORCED_CHECK
            );
    }


    /* =====================================================
       LIFETIME

       Countdown starts ONLY NOW,
       after the image is fully loaded
       and actually visible.
       ===================================================== */

    const lifetime =
        getLifetime();


    setTimeout(() => {

        img.remove();


        active =
            active.filter(
                x => x !== item
            );


        /*
            NEVER allow a blank page.

            If this was the last image,
            immediately replace it.
        */

        if (
            active.length === 0
        ) {

            addPhoto(0);
        }

    }, lifetime);


    return true;
}


/* =========================================================
   INITIAL COMPOSITION
   ========================================================= */

async function createInitialComposition() {


    /*
        Initial distribution:

        45% → one
        48% → two
        7%  → three
    */

    const r =
        Math.random();


    let amount;


    if (
        r < 0.45
    ) {

        amount = 1;

    }

    else if (
        r < 0.93
    ) {

        amount = 2;

    }

    else {

        amount = 3;
    }


    /*
        We create them sequentially.

        Therefore each new photo is aware
        of the previous ones.
    */

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        if (
            i === 0
        ) {

            await addPhoto(
                0,
                false
            );
        }

        else if (
            i === 1
        ) {

            await addPhoto(
                SECOND_OVERLAP_CHANCE,
                false
            );
        }

        else {

            await addPhoto(
                THIRD_OVERLAP_CHANCE,
                true
            );
        }
    }


    /*
        Absolute safety.
    */

    if (
        active.length === 0
    ) {

        await addPhoto(0);
    }
}


/* =========================================================
   GENERATION DECISION
   ========================================================= */

function decideGeneration() {


    /*
        =====================================================
        ZERO PHOTOS

        Impossible state.

        Immediately regenerate one.
        =====================================================
    */

    if (
        active.length === 0
    ) {

        return {

            amount: 1,

            overlap: 0
        };
    }


    /*
        =====================================================
        ONE PHOTO
        =====================================================
    */

    if (
        active.length === 1
    ) {


        /*
            30% chance:

            TWO photos arrive together.

            This is deliberately common.
        */

        if (
            Math.random() <
            ONE_TO_TWO_CHANCE
        ) {

            return {

                amount: 2,

                overlap:
                    SECOND_OVERLAP_CHANCE
            };
        }


        /*
            Otherwise one photo.
        */

        return {

            amount: 1,

            overlap: 0
        };
    }


    /*
        =====================================================
        TWO PHOTOS
        =====================================================
    */

    if (
        active.length === 2
    ) {


        /*
            12% chance of third photo.

            The third photo has a slightly higher
            overlap possibility, but the position
            algorithm still strongly prefers free space.
        */

        if (
            Math.random() <
            TWO_TO_THREE_CHANCE
        ) {

            return {

                amount: 1,

                overlap:
                    THIRD_OVERLAP_CHANCE,

                third: true
            };
        }


        /*
            Otherwise no new photo.
        */

        return {

            amount: 0,

            overlap: 0
        };
    }


    /*
        =====================================================
        THREE PHOTOS

        No fourth photo.
        =====================================================
    */

    return {

        amount: 0,

        overlap: 0
    };
}


/* =========================================================
   RANDOM ROLL
   ========================================================= */

function roll() {


    /*
        Random time before next decision.

        4–7 seconds.
    */

    const delay =
        random(
            MIN_ROLL,
            MAX_ROLL
        );


    setTimeout(
        async () => {


            /*
                =================================================
                DICE #1

                Should something happen?
                =================================================
            */

            const generate =
                Math.random() <
                GENERATE_CHANCE;


            if (!generate) {

                /*
                    Nothing happens.

                    The existing composition simply
                    continues living.
                */

                roll();

                return;
            }


            /*
                =================================================
                DICE #2

                What should happen given the
                CURRENT composition?
                =================================================
            */

            const decision =
                decideGeneration();


            if (
                decision.amount <= 0
            ) {

                /*
                    Nothing can be added.

                    This is intentional.
                */

                roll();

                return;
            }


            /*
                =================================================
                CREATE NEW PHOTO(S)

                IMPORTANT:

                Each photo is added sequentially.

                Therefore the second photo sees
                the first one.

                The third sees BOTH previous photos.

                This is the main anti-chaos mechanism.
                =================================================
            */

            for (
                let i = 0;
                i < decision.amount;
                i++
            ) {


                /*
                    Never exceed three.
                */

                if (
                    active.length >=
                    MAX_PHOTOS
                ) {

                    break;
                }


                let overlap =
                    0;


                let third =
                    false;


                /*
                    First photo of a two-photo event.
                */

                if (
                    i === 0
                ) {

                    overlap =
                        decision.overlap;

                    third =
                        decision.third === true;
                }


                /*
                    Second photo arriving
                    at the same time.

                    It gets its OWN positioning
                    decision.

                    It still considers the existing
                    composition.
                */

                else {

                    overlap =
                        SECOND_OVERLAP_CHANCE;

                    third =
                        false;
                }


                await addPhoto(
                    overlap,
                    third
                );
            }


            /*
                Absolute safety.

                If somehow the composition disappeared
                during loading, restore one photo.
            */

            if (
                active.length === 0
            ) {

                await addPhoto(0);
            }


            /*
                Continue throwing the dice.
            */

            roll();

        },

        delay
    );
}


/* =========================================================
   FULLSCREEN
   ========================================================= */

const fullscreenButton =
    document.getElementById(
        "fullscreen"
    );


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document
                    .documentElement
                    .requestFullscreen();

            }

            else {

                await document
                    .exitFullscreen();
            }

        }

        catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );
        }
    }
);


/* =========================================================
   START
   ========================================================= */

loadPhotos();

</script>
