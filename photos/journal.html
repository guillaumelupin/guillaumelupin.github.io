const urls=NAMES.map(n=>'/photos/images/'+encodeURIComponent(n));
const journal=document.getElementById('journal');
const mobile=()=>innerWidth<768;
let bag=[],nextReady=null,preparing=null,timer=null,last='',token=0;
const cache=new Map();
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function take(){if(!bag.length){bag=shuffle(urls);if(bag.length>1&&bag[0]===last)[bag[0],bag[1]]=[bag[1],bag[0]]}return bag.pop()}
function load(src){if(cache.has(src))return cache.get(src);const promise=new Promise(resolve=>{const im=new Image();im.onload=()=>resolve({src,im,portrait:im.naturalHeight>im.naturalWidth});im.onerror=()=>resolve(null);im.src=src});cache.set(src,promise);if(cache.size>24)cache.delete(cache.keys().next().value);return promise}
async function build(){let first=null;for(let n=0;n<urls.length&&!first;n++)first=await load(take());if(!first)return null;const p=mobile()?(first.portrait?0:.25):(first.portrait?.20:.15);const imgs=[first];if(Math.random()<p){const candidate=await load(take());if(candidate&&candidate.portrait===first.portrait)imgs.push(candidate)}return imgs}
function prepare(){if(nextReady)return Promise.resolve(nextReady);if(!preparing)preparing=build().then(x=>(nextReady=x,x)).finally(()=>preparing=null);return preparing}
function show(imgs){const wrap=document.createElement('div');wrap.className='composition '+(imgs.length===2?'double ':'single ')+(mobile()?'mobile':'desktop');const scale=imgs.length===2?.90+Math.random()*.08:.82+Math.random()*.17;wrap.style.width=(scale*100)+'%';wrap.style.height=(scale*100)+'%';for(const item of imgs){const slot=document.createElement('div');slot.className='slot';const img=document.createElement('img');img.src=item.src;img.alt='';img.draggable=false;slot.append(img);wrap.append(slot)}journal.replaceChildren(wrap);last=imgs[imgs.length-1].src}
async function advance(){clearTimeout(timer);const id=++token;const imgs=nextReady||await prepare();if(id!==token||!imgs)return;nextReady=null;show(imgs);prepare();timer=setTimeout(advance,10000)}
journal.addEventListener('click',advance);document.getElementById('fullscreen').addEventListener('click',async e=>{e.stopPropagation();try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}});advance();
