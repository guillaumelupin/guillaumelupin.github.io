<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal</title>
<style>
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:white; }
body { font-family:Arial,sans-serif; }
#journal { position:fixed; inset:0; padding:4vmin; display:flex; align-items:center; justify-content:center; cursor:pointer; touch-action:manipulation; }
#journal { -webkit-tap-highlight-color: transparent; }
.composition { width:100%; height:100%; display:flex; align-items:center; justify-content:center; gap:3vmin; }
.composition.double.mobile { flex-direction:column; }
.composition.double.desktop { flex-direction:row; }
.slot { min-width:0; min-height:0; display:flex; justify-content:center; align-items:center; flex:1; width:100%; height:100%; }
.slot img { display:block; max-width:100%; max-height:100%; object-fit:contain; width:auto; height:auto; pointer-events:none; user-select:none; -webkit-user-drag:none; }
#status { position:fixed; left:14px; bottom:12px; font:12px Arial,sans-serif; color:#777; pointer-events:none; }
</style>
</head>
<body>
<main id="journal" role="button" tabindex="0" aria-label="Photo suivante"></main>
<div id="status" aria-live="polite"></div>

const INTERVAL = 10000;
const MOBILE_MAX = 700;
const journal = document.getElementById('journal');
const status = document.getElementById('status');
let catalog = [], queue = [], history = [], timer = null, generation = 0;
const dimensions = new Map();
const random = (a,b) => a + Math.random()*(b-a);
const mobile = () => window.innerWidth <= MOBILE_MAX;
function shuffle(items) {
  const a=[...items];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function nextFile() {
  if(!queue.length) {
    queue=shuffle(catalog);
    if(history.length && queue.length>1 && queue[0]===history[history.length-1]) [queue[0],queue[1]]=[queue[1],queue[0]];
  }
  return queue.shift();
}
function load(src) {
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Image introuvable : '+src));
    img.src = src;
  });
}
async function dimensionsOf(src) {
  if(dimensions.has(src)) return dimensions.get(src);
  const img=await load(src);
  const d={width:img.naturalWidth,height:img.naturalHeight, orientation:img.naturalWidth>=img.naturalHeight?'horizontal':'vertical'};
  dimensions.set(src,d);
  return d;
}
function sizeFactor(double) {
  if(double) return random(.90,.98);
  const r=Math.random();
  if(r<.01) return random(.065,.10); // very rare thumb-size miniature
  if(r<.06) return random(.22,.40); // small
  if(r<.25) return random(.57,.75); // medium
  return random(.88,.99); // usually large
}
function makeComposition(images, scale) {
  const comp=document.createElement('div');
  const isDouble=images.length===2;
  comp.className='composition '+(isDouble?'double ':'single ')+(mobile()?'mobile':'desktop');
  const margin=(1-scale)*50;
  comp.style.width=(scale*100)+'%';
  comp.style.height=(scale*100)+'%';
  // Both slots share the same available space: no overlap or cropping.
  for(const {src} of images){
    const slot=document.createElement('div'); slot.className='slot';
    const img=document.createElement('img'); img.src=src; img.alt=''; img.draggable=false;
    slot.appendChild(img); comp.appendChild(slot);
  }
  return comp;
}
async function selectComposition(token) {
  if(!catalog.length) return;
  const initial=nextFile();
  let first, firstData;
  try{firstData=await dimensionsOf(initial); first={src:initial, data:firstData};}
  catch(e){console.warn(e); if(token===generation) schedule(1000); return;}
  if(token!==generation) return;
  const wantDouble=Math.random() < (mobile() ? (firstData.orientation==='horizontal'?.25:0) : (firstData.orientation==='vertical'?.20:.15));
  let chosen=[first];
  if(wantDouble && catalog.length>1){
    // Search a matching orientation; restore skipped entries into the queue.
    const skipped=[];
    for(let i=0;i<catalog.length-1;i++){
      const candidate=nextFile();
      if(candidate===initial){skipped.push(candidate);continue;}
      try{
        const d=await dimensionsOf(candidate);
        if(token!==generation) return;
        if(d.orientation===firstData.orientation){chosen.push({src:candidate,data:d}); break;}
      }catch(e){console.warn(e);}
      skipped.push(candidate);
    }
    queue=skipped.concat(queue);
  }
  if(token!==generation) return;
  const comp=makeComposition(chosen,sizeFactor(chosen.length===2));
  journal.replaceChildren(comp);
  status.textContent='';
  for(const p of chosen){ history.push(p.src); if(history.length>5)history.shift(); }
  schedule(INTERVAL);
}
function schedule(ms){clearTimeout(timer);timer=setTimeout(advance,ms);}
function advance(){clearTimeout(timer);const token=++generation;selectComposition(token).catch(e=>{console.error(e);status.textContent='Erreur lors du chargement des photos';schedule(3000);});}
journal.addEventListener('click',advance);
journal.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();}});
async function start(){
  catalog = IMAGE_NAMES.map(name => IMAGE_BASE + encodeURIComponent(name));
  if (!catalog.length) { status.textContent='Aucune photo dans le catalogue'; return; }
  advance();
}
start();
