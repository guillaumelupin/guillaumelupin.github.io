<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    touch-action: none;
}

#journal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.photo {
    position: absolute;
    display: block;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

#fullscreen {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    background: transparent;
    opacity: 0.08;
    z-index: 1000;
    cursor: pointer;
}

#fullscreen:hover {
    opacity: 0.3;
}

#fullscreen svg {
    width: 18px;
    height: 18px;
}

:fullscreen #fullscreen {
    opacity: 0;
}

</style>

</head>

<body>

<div id="journal"></div>

<button id="fullscreen" aria-label="Fullscreen">

<svg viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5">

<path d="M4 9V4h5"/>
<path d="M20 9V4h-5"/>
<path d="M4 15v5h5"/>
<path d="M20 15v5h-5"/>

</svg>

</button>


<script>


/* =========================================================
   GITHUB FOLDER
========================================================= */

const API =
"https://api.github.com/repos/" +
"guillaumelupin/" +
"guillaumelupin.github.io/" +
"contents/photos/journal?ref=main";


/* =========================================================
   GENERAL
========================================================= */

const MAX_PHOTOS = 3;


/* =========================================================
   PHOTO LIFETIME
========================================================= */

const MIN_LIFETIME = 5500;
const MAX_LIFETIME = 15000;


/*
   Extremely rare long lifetime.
*/

const RARE_LIFETIME_CHANCE = 0.02;
const RARE_MAX_LIFETIME = 20000;


/* =========================================================
   TIME BETWEEN EVENTS
========================================================= */

const MOBILE_MIN_DELAY = 2500;
const MOBILE_MAX_DELAY = 5500;

const DESKTOP_MIN_DELAY = 2800;
const DESKTOP_MAX_DELAY = 6500;


/* =========================================================
   NUMBER OF PHOTOS
========================================================= */

/*
   One photo is deliberately dominant.

   Two photos are common.

   Three photos are rare.
*/

const DOUBLE_CHANCE = 0.25;
const TRIPLE_CHANCE = 0.025;


/* =========================================================
   OVERLAP
========================================================= */

/*
   Almost everything should NOT overlap.
*/

const BASE_OVERLAP_CHANCE = 0.025;


/*
   Slightly higher when trying to fit
   a third photo.
*/

const THREE_PHOTO_OVERLAP_CHANCE = 0.07;


/*
   Extremely rare "shiny" overlap.
*/

const RARE_OVERLAP_CHANCE = 0.004;


/* =========================================================
   RARE COMPOSITIONS
========================================================= */

const RARE_COMPOSITION_CHANCE = 0.02;


/* =========================================================
   VARIABLES
========================================================= */

const journal =
document.getElementById("journal");

let photos = [];

let activePhotos = [];

let recentPhotos = [];

let previousBatchSize = 0;

let loading = false;


/* =========================================================
   RANDOM
========================================================= */

function random(min, max) {

    return Math.random() *
    (max - min) + min;

}


function randomInt(min, max) {

    return Math.floor(
        random(min, max + 1)
    );

}


/* =========================================================
   PRELOAD
========================================================= */

function preloadImage(src) {

    return new Promise(resolve => {

        const img = new Image();

        img.onload = () => {
            resolve(img);
        };

        img.onerror = () => {
            resolve(null);
        };

        img.src = src;

    });

}


/* =========================================================
   LOAD PHOTOS
========================================================= */

async function loadPhotos() {

    try {

        const response =
        await fetch(API);

        if (!response.ok) {

            throw new Error(
                "GitHub API error"
            );

        }

        const files =
        await response.json();


        photos = files

        .filter(file =>
            file.type === "file" &&
            /\.(jpg|jpeg|png|webp|gif)$/i
            .test(file.name)
        )

        .map(file =>
            "https://raw.githubusercontent.com/" +
            "guillaumelupin/" +
            "guillaumelupin.github.io/" +
            "main/photos/journal/" +
            encodeURIComponent(file.name)
        );


        await fillInitialScreen();

        scheduleNextEvent();


    } catch (error) {

        console.error(
            "Could not load Journal:",
            error
        );

    }

}


/* =========================================================
   CHOOSE PHOTO
========================================================= */

function choosePhoto() {

    if (photos.length === 0) {
        return null;
    }


    /*
       Every photo remains available.

       Recent photos receive a probability
       penalty rather than being excluded.
    */

    const weighted = [];


    for (const src of photos) {

        let weight = 100;


        /*
           Last displayed photo:
           very unlikely.
        */

        if (
            recentPhotos.length >= 1 &&
            src ===
            recentPhotos[
                recentPhotos.length - 1
            ]
        ) {

            weight = 1;

        }


        /*
           Previous photo:
           somewhat unlikely.
        */

        else if (
            recentPhotos.length >= 2 &&
            src ===
            recentPhotos[
                recentPhotos.length - 2
            ]
        ) {

            weight = 12;

        }


        for (
            let i = 0;
            i < weight;
            i++
        ) {

            weighted.push(src);

        }

    }


    /*
       Extremely rare immediate repetition.

       Three consecutive repetitions
       remain impossible.
    */

    if (
        recentPhotos.length > 0 &&
        Math.random() < 0.015
    ) {

        const previous =
        recentPhotos[
            recentPhotos.length - 1
        ];


        if (
            recentPhotos.length < 2 ||
            recentPhotos[
                recentPhotos.length - 2
            ] !== previous
        ) {

            return previous;

        }

    }


    return weighted[
        randomInt(
            0,
            weighted.length - 1
        )
    ];

}


/* =========================================================
   RECTANGLE COLLISION
========================================================= */

function overlaps(a, b) {

    return (

        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y

    );

}


/* =========================================================
   FIND POSITION
========================================================= */

function findPosition(
    width,
    height,
    thirdPhoto = false
) {


    /*
       Normal overlap probability.
    */

    let overlapChance =
    BASE_OVERLAP_CHANCE;


    /*
       Third photos get slightly more
       tolerance because available space
       is naturally smaller.
    */

    if (thirdPhoto) {

        overlapChance =
        THREE_PHOTO_OVERLAP_CHANCE;

    }


    /*
       Extremely rare unusual overlap.
    */

    if (
        Math.random() <
        RARE_OVERLAP_CHANCE
    ) {

        overlapChance = 0.30;

    }


    const intentionalOverlap =
    Math.random() <
    overlapChance;


    /*
       =====================================================
       MOST IMPORTANT PART:

       Try MANY positions.

       The existing photos create protected
       zones.

       We therefore strongly prefer completely
       empty white space.
       =====================================================
    */

    for (
        let attempt = 0;
        attempt < 600;
        attempt++
    ) {


        const position = {

            x: random(
                2,
                98 - width
            ),

            y: random(
                2,
                98 - height
            ),

            w: width,
            h: height

        };


        /*
           Intentional rare overlap.
        */

        if (intentionalOverlap) {

            return position;

        }


        let collision = false;


        for (
            const active of activePhotos
        ) {

            if (
                overlaps(
                    position,
                    active.position
                )
            ) {

                collision = true;

                break;

            }

        }


        /*
           Only accept if the entire
           rectangle is in free space.
        */

        if (!collision) {

            return position;

        }

    }


    /*
       If the screen genuinely has no room,
       don't force a new image.
    */

    return null;

}


/* =========================================================
   PHOTO SIZE
========================================================= */

function getPhotoSize(
    isThirdPhoto = false
) {

    const mobile =
    window.innerWidth < 600;


    /*
       =====================================
       VERY RARE GIANT PHOTO
       =====================================
    */

    if (
        Math.random() <
        RARE_COMPOSITION_CHANCE &&
        activePhotos.length === 0
    ) {

        return {

            width: mobile
                ? random(78, 91)
                : random(68, 88),

            height: mobile
                ? random(75, 92)
                : random(68, 90)

        };

    }


    /*
       =====================================
       THIRD PHOTO
       =====================================

       Three photos should only happen
       when they can remain relatively
       small and separated.
    */

    if (isThirdPhoto) {

        return {

            width: mobile
                ? random(25, 38)
                : random(22, 35),

            height: mobile
                ? random(24, 40)
                : random(23, 39)

        };

    }


    /*
       =====================================
       NORMAL MOBILE
       =====================================
    */

    if (mobile) {

        /*
           Larger average size.
        */

        return {

            width: random(52, 79),

            height: random(45, 73)

        };

    }


    /*
       =====================================
       NORMAL DESKTOP
       =====================================
    */

    return {

        width: random(38, 64),

        height: random(38, 72)

    };

}


/* =========================================================
   LIFETIME
========================================================= */

function getLifetime() {

    /*
       Rare long-lasting photo.
    */

    if (
        Math.random() <
        RARE_LIFETIME_CHANCE
    ) {

        return random(
            MAX_LIFETIME,
            RARE_MAX_LIFETIME
        );

    }


    return random(
        MIN_LIFETIME,
        MAX_LIFETIME
    );

}


/* =========================================================
   CREATE PHOTO
========================================================= */

async function spawnPhoto(
    isThirdPhoto = false
) {

    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const src =
    choosePhoto();


    if (!src) {
        return false;
    }


    /*
       Fully load before displaying.
    */

    const loaded =
    await preloadImage(src);


    if (!loaded) {

        /*
           Keep the image in the collection.
        */

        return false;

    }


    if (
        activePhotos.length >=
        MAX_PHOTOS
    ) {

        return false;

    }


    const size =
    getPhotoSize(
        isThirdPhoto
    );


    const position =
    findPosition(
        size.width,
        size.height,
        isThirdPhoto
    );


    /*
       No suitable white space.
       Do nothing rather than forcing
       overlap.
    */

    if (!position) {

        return false;

    }


    const img =
    document.createElement("img");


    img.className =
    "photo";


    img.src =
    loaded.src;


    img.draggable =
    false;


    img.style.left =
    position.x + "%";


    img.style.top =
    position.y + "%";


    img.style.width =
    position.w + "%";


    img.style.height =
    position.h + "%";


    journal.appendChild(img);


    const active = {

        element: img,

        src: src,

        position: position

    };


    activePhotos.push(active);


    /*
       Remember recently displayed photos.
    */

    recentPhotos.push(src);


    if (
        recentPhotos.length > 2
    ) {

        recentPhotos.shift();

    }


    /*
       The timer starts ONLY once
       the image is actually visible.
    */

    const lifetime =
    getLifetime();


    setTimeout(() => {

        img.remove();


        activePhotos =
        activePhotos.filter(
            item =>
            item !== active
        );

    }, lifetime);


    return true;

}


/* =========================================================
   INITIAL SCREEN
========================================================= */

async function fillInitialScreen() {

    const r =
    Math.random();


    /*
       1 LARGE PHOTO: 62%

       2 PHOTOS: 35%

       3 PHOTOS: 3%
    */

    let target;


    if (r < 0.62) {

        target = 1;

    }

    else if (r < 0.97) {

        target = 2;

    }

    else {

        target = 3;

    }


    for (
        let i = 0;
        i < target;
        i++
    ) {

        await spawnPhoto(
            i === 2
        );

    }


    previousBatchSize =
    target;

}


/* =========================================================
   DETERMINE NEXT EVENT
========================================================= */

function determineBatchSize() {

    const count =
    activePhotos.length;


    /*
       EMPTY SCREEN

       Strongly favour one large photo.
    */

    if (count === 0) {

        const r =
        Math.random();


        /*
           Rare 3-photo event.
        */

        if (
            r < TRIPLE_CHANCE
        ) {

            return 3;

        }


        /*
           Two photos.
        */

        if (
            r < 0.40
        ) {

            return 2;

        }


        /*
           One large photo.
        */

        return 1;

    }


    /*
       =====================================
       ONE PHOTO
       =====================================
    */

    if (count === 1) {

        let doubleChance =
        DOUBLE_CHANCE;


        /*
           Avoid endlessly generating
           the same two-photo rhythm.
        */

        if (
            previousBatchSize === 2
        ) {

            doubleChance *= 0.35;

        }


        if (
            previousBatchSize === 3
        ) {

            doubleChance *= 0.20;

        }


        const r =
        Math.random();


        /*
           Very rare event that attempts
           to bring two more photos.
        */

        if (
            r < TRIPLE_CHANCE
        ) {

            return 2;

        }


        /*
           Normal second photo.
        */

        if (
            r <
            TRIPLE_CHANCE +
            doubleChance
        ) {

            return 1;

        }


        /*
           Otherwise wait.

           This lets the large image
           remain contemplative.
        */

        return 0;

    }


    /*
       =====================================
       TWO PHOTOS
       =====================================
    */

    if (count === 2) {

        /*
           Usually don't immediately add
           a third photo.
        */

        if (
            Math.random() < 0.30
        ) {

            return 1;

        }


        return 0;

    }


    /*
       =====================================
       THREE PHOTOS
       =====================================
    */

    return 0;

}


/* =========================================================
   RUN EVENT
========================================================= */

async function runEvent() {

    if (loading) {
        return;
    }


    loading = true;


    let amount =
    determineBatchSize();


    amount =
    Math.min(
        amount,
        MAX_PHOTOS -
        activePhotos.length
    );


    /*
       Create simultaneous photos
       independently.
    */

    const tasks = [];


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const isThird =
        activePhotos.length + i >= 2;


        tasks.push(
            spawnPhoto(isThird)
        );

    }


    await Promise.all(tasks);


    previousBatchSize =
    amount;


    loading = false;

}


/* =========================================================
   SCHEDULER
========================================================= */

function scheduleNextEvent() {

    const mobile =
    window.innerWidth < 600;


    const delay =
    mobile

    ? random(
        MOBILE_MIN_DELAY,
        MOBILE_MAX_DELAY
    )

    : random(
        DESKTOP_MIN_DELAY,
        DESKTOP_MAX_DELAY
    );


    setTimeout(async () => {


        /*
           If somehow completely empty,
           immediately rebuild.
        */

        if (
            activePhotos.length === 0
        ) {

            await fillInitialScreen();

        }

        else {

            await runEvent();

        }


        scheduleNextEvent();


    }, delay);

}


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreenButton =
document.getElementById(
    "fullscreen"
);


fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                .requestFullscreen();

            }

            else {

                await document.exitFullscreen();

            }

        }

        catch (error) {

            console.error(
                "Fullscreen unavailable:",
                error
            );

        }

    }
);


/* =========================================================
   START
========================================================= */

loadPhotos();

</script>

</body>
</html>
