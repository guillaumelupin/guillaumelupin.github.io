<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #fff; overflow: hidden; }
  body { font-family: Arial, sans-serif; }
  #journal { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; padding: 4vmin; cursor: pointer; touch-action: manipulation; }
  .composition { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 3vmin; }
  .composition.double.mobile { flex-direction: column; }
  .composition.double.desktop { flex-direction: row; }
  .slot { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; flex: 1; width: 100%; height: 100%; }
  .composition.double.mobile .slot { height: 50%; }
  .composition.double.desktop .slot { width: 50%; }
  .slot img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  #status { position: fixed; left: 12px; bottom: 12px; font-size: 12px; color: #888; pointer-events: none; }
</style>
</head>
<body>
<main id="journal" role="button" tabindex="0" aria-label="Afficher la photographie suivante"></main>
<div id="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  // Ce dossier doit être à la racine du dépôt public GitHub Pages.
  const OWNER = 'guillaumelupin';
  const REPO = 'guillaumelupin.github.io';
  const BRANCH = 'main';
  const FOLDER = 'image';
  const INTERVAL = 10000;
  const MOBILE_MAX = 700;
  const journal = document.getElementById('journal');
  const status = document.getElementById('status');
  const imagePattern = /\.(jpe?g|png|webp|gif|avif)$/i;
  let catalog = [];
  let remaining = [];
  let lastShown = new Set();
  let timer = null;
  let generation = 0;
  let busy = false;
  const dimensions = new Map();

  function shuffle(items) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }
  function replenish() {
    remaining = shuffle(catalog);
    // Évite de recommencer un cycle avec la dernière image montrée, si possible.
    if (remaining.length > 1 && lastShown.has(remaining[remaining.length - 1].url)) {
      const candidate = remaining.findIndex(item => !lastShown.has(item.url));
      if (candidate !== -1) [remaining[candidate], remaining[remaining.length - 1]] = [remaining[remaining.length - 1], remaining[candidate]];
    }
  }
  function take(exclude = new Set(), orientation = null) {
    if (!remaining.length) replenish();
    let index = -1;
    for (let i = remaining.length - 1; i >= 0; i--) {
      const item = remaining[i];
      if (exclude.has(item.url)) continue;
      if (orientation && dimensions.get(item.url)?.orientation !== orientation) continue;
      index = i; break;
    }
    if (index < 0) return null;
    return remaining.splice(index, 1)[0];
  }
  function preload(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('Image inaccessible : ' + url));
      img.src = url;
    });
  }
  async function inspect(item) {
    if (dimensions.has(item.url)) return dimensions.get(item.url);
    const img = await preload(item.url);
    const info = { orientation: img.naturalHeight > img.naturalWidth ? 'vertical' : 'horizontal' };
    dimensions.set(item.url, info);
    return info;
  }
  function isMobile() { return window.innerWidth <= MOBILE_MAX; }
  function doubleChance(orientation) {
    if (isMobile()) return orientation === 'horizontal' ? 0.25 : 0;
    return orientation === 'vertical' ? 0.20 : 0.15;
  }
  function singleScale() {
    const r = Math.random();
    if (r < 0.01) return 0.10 + Math.random() * 0.035; // miniature 1 %
    if (r < 0.06) return 0.28 + Math.random() * 0.15;  // petite 5 %
    if (r < 0.25) return 0.58 + Math.random() * 0.16;  // moyenne 19 %
    return 0.88 + Math.random() * 0.12;                // grande 75 %
  }
  function build(items, scale) {
    const double = items.length === 2;
    const composition = document.createElement('div');
    composition.className = `composition ${double ? 'double' : 'single'} ${isMobile() ? 'mobile' : 'desktop'}`;
    for (const item of items) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      const img = document.createElement('img');
      img.src = item.url;
      img.alt = '';
      img.draggable = false;
      // Même facteur de taille pour les deux photos ; proportions préservées.
      img.style.maxWidth = `${scale * 100}%`;
      img.style.maxHeight = `${scale * 100}%`;
      slot.appendChild(img);
      composition.appendChild(slot);
    }
    return composition;
  }
  async function next() {
    if (busy || !catalog.length) return;
    busy = true;
    clearTimeout(timer);
    const token = ++generation;
    const rejected = new Set();
    try {
      let first = null, orientation = null;
      for (let attempt = 0; attempt < catalog.length; attempt++) {
        const candidate = take(new Set([...lastShown, ...rejected])) || take(rejected);
        if (!candidate) break;
        try { const info = await inspect(candidate); first = candidate; orientation = info.orientation; break; }
        catch (error) { console.warn(error); rejected.add(candidate.url); }
      }
      if (!first) { status.textContent = 'Impossible de charger les photographies.'; return; }
      const selected = [first];
      if (Math.random() < doubleChance(orientation)) {
        // On examine les orientations inconnues sans consommer l'ordre aléatoire.
        const candidates = shuffle(remaining.filter(x => x.url !== first.url && !lastShown.has(x.url)));
        for (const candidate of candidates) {
          try {
            const info = await inspect(candidate);
            if (info.orientation === orientation) {
              const i = remaining.findIndex(x => x.url === candidate.url);
              if (i >= 0) remaining.splice(i, 1);
              selected.push(candidate);
              break;
            }
          } catch (error) { console.warn(error); }
        }
      }
      if (token !== generation) return;
      const scale = selected.length === 2 ? 0.92 + Math.random() * 0.08 : singleScale();
      journal.replaceChildren(build(selected, scale));
      lastShown = new Set(selected.map(x => x.url));
      status.textContent = '';
    } finally {
      busy = false;
      timer = setTimeout(next, INTERVAL);
    }
  }
  async function start() {
    status.textContent = 'Chargement…';
    try {
      const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}?ref=${BRANCH}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error('Réponse GitHub : ' + response.status);
      const files = await response.json();
      if (!Array.isArray(files)) throw new Error('Dossier introuvable');
      catalog = files.filter(f => f.type === 'file' && imagePattern.test(f.name)).map(f => ({url: `./${FOLDER}/${encodeURIComponent(f.name)}`}));
      if (!catalog.length) throw new Error('Aucune image dans le dossier');
      replenish();
      await next();
    } catch (error) {
      console.error(error);
      status.textContent = 'Impossible de lire le dossier image/ sur GitHub.';
    }
  }
  journal.addEventListener('click', next);
  journal.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); next(); }
  });
  start();
})();
</script>
</body>
</html>
