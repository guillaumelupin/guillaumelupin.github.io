```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Photos</title>

<style>

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: white;
}

#gallery {
  width: 100vw;
  height: 100vh;

  display: flex;

  align-items: center;
  justify-content: center;
}

#photo {

  max-width: 88vw;
  max-height: 88vh;

  width: auto;
  height: auto;

  object-fit: contain;

  user-select: none;

  -webkit-user-drag: none;

  transition:
    opacity 0.5s ease,
    transform 0.6s ease;
}


/* Invisible navigation areas */

.nav {

  position: fixed;

  top: 0;

  width: 20vw;
  height: 100vh;

  border: none;

  background: transparent;

  cursor: pointer;

  z-index: 10;
}

#previous {
  left: 0;
}

#next {
  right: 0;
}


/* Mobile */

@media (max-width: 600px) {

  #photo {

    max-width: 92vw;
    max-height: 86vh;

  }

  .nav {
    width: 25vw;
  }

}

</style>

</head>


<body>


<div id="gallery">

  <img
    id="photo"
    src=""
    alt=""
  >

</div>


<button
  id="previous"
  class="nav"
  aria-label="Previous photo"
></button>


<button
  id="next"
  class="nav"
  aria-label="Next photo"
></button>


<script>


/* --------------------------------
   PHOTOS
-------------------------------- */

const photos = [

  "photo-files/215403813.jpg",

  "photo-files/215542180.jpg",

  "photo-files/220347599.jpg"

];


/* --------------------------------
   VARIABLES
-------------------------------- */

const image = document.getElementById("photo");

const previous =
  document.getElementById("previous");

const next =
  document.getElementById("next");

let current = 0;

let timer;


/* --------------------------------
   RANDOM
-------------------------------- */

function random(min, max) {

  return Math.random() *
    (max - min) + min;

}


/* --------------------------------
   SHOW PHOTO
-------------------------------- */

function showPhoto(index) {

  current =
    (index + photos.length)
    % photos.length;


  image.style.opacity = "0";


  setTimeout(() => {

    image.src =
      photos[current];


    const scale =
      random(0.90, 1.00);


    const x =
      random(-2, 2);


    const y =
      random(-2, 2);


    const rotation =
      random(-1.5, 1.5);


    image.style.transform =

      "translate(" +
      x + "vw, " +
      y + "vh) " +

      "rotate(" +
      rotation + "deg) " +

      "scale(" +
      scale + ")";


    image.onload = () => {

      image.style.opacity = "1";

    };


  }, 250);


  clearTimeout(timer);


  timer = setTimeout(

    () => {

      showPhoto(current + 1);

    },

    random(5000, 10000)

  );

}


/* --------------------------------
   BUTTONS
-------------------------------- */

next.onclick = () => {

  showPhoto(current + 1);

};


previous.onclick = () => {

  showPhoto(current - 1);

};


/* --------------------------------
   SWIPE
-------------------------------- */

let startX = 0;

document.addEventListener(

  "touchstart",

  event => {

    startX =
      event.touches[0].clientX;

  }

);


document.addEventListener(

  "touchend",

  event => {

    const endX =
      event.changedTouches[0].clientX;


    const distance =
      endX - startX;


    if (Math.abs(distance) < 50) {

      return;

    }


    if (distance < 0) {

      showPhoto(current + 1);

    } else {

      showPhoto(current - 1);

    }

  }

);


/* --------------------------------
   START
-------------------------------- */

showPhoto(0);

</script>


</body>

</html>
```
