<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}body{font-family:Arial,sans-serif}#gallery{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}#gallery img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.composition{position:absolute;inset:5%;display:flex;align-items:center;justify-content:center;gap:2.5%}.composition.double{flex-direction:column}.composition.double img{max-height:46%;max-width:85%}#fullscreen{position:fixed;bottom:15px;right:15px;width:28px;height:28px;border:0;background:transparent;color:#ddd;cursor:pointer;z-index:10;padding:4px}#fullscreen svg{width:100%;height:100%}
</style>
</head>
<body>
<div id="gallery"></div>
<button id="fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
<script>
const OWNER='guillaumelupin';
const REPO='guillaumelupin.github.io';
const FOLDER='photos/images';
const INTERVAL=10000;
const PRELOAD_COUNT=3;
const gallery=document.getElementById('gallery');
let files=[],remaining=[],queue=[],loading=new Map(),timer=null,current=[],generation=0;
const mobile=()=>window.innerWidth<768;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextFile(){if(!remaining.length)remaining=shuffle(files);return remaining.pop()||null}
function getComposition(){if(!files.length)return null;const first=nextFile();if(!first)return null;const portrait=first.portrait;const chance=mobile()?(portrait?0:0.25):(portrait?0.20:0.15);const result=[first];if(Math.random()<chance&&files.length>1){const second=nextFile();if(second&&second.url!==first.url)result.push(second)}return result}
function loadImage(file){if(loading.has(file.url))return loading.get(file.url);const promise=new Promise(resolve=>{const img=new Image();img.onload=()=>{file.portrait=img.naturalHeight>img.naturalWidth;resolve(img)};img.onerror=()=>resolve(null);img.src=file.url;if(img.complete&&img.naturalWidth){file.portrait=img.naturalHeight>img.naturalWidth;resolve(img)}});loading.set(file.url,promise);return promise}
function prepare(){while(queue.length<PRELOAD_COUNT&&files.length){const composition=getComposition();if(!composition)break;queue.push(composition);composition.forEach(loadImage)}}
async function advance(){clearTimeout(timer);const id=++generation;if(!queue.length)prepare();const composition=queue.shift();if(!composition)return;current=composition;prepare();timer=setTimeout(advance,INTERVAL);const images=await Promise.all(composition.map(loadImage));if(id!==generation)return;const container=document.createElement('div');container.className='composition';if(composition.length>1)container.classList.add('double');images.forEach((loaded,index)=>{if(!loaded)return;const img=document.createElement('img');img.src=composition[index].url;img.draggable=false;const scale=0.88+Math.random()*0.12;img.style.transform=`scale(${scale})`;container.appendChild(img)});gallery.replaceChildren(container);if(loading.size>16){const keep=new Set([...current.map(f=>f.url),...queue.flat().map(f=>f.url)]);for(const key of loading.keys()){if(!keep.has(key))loading.delete(key)}}}
async function init(){try{const api=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`;const response=await fetch(api);if(!response.ok)throw new Error('Image list unavailable');const data=await response.json();files=data.filter(f=>/\.(jpg|jpeg|png|webp)$/i.test(f.name)).map(f=>({url:'/'+FOLDER+'/'+f.name.split('/').map(encodeURIComponent).join('/'),portrait:false}));remaining=shuffle(files);prepare();advance()}catch(error){console.error('Journal:',error)}}
gallery.addEventListener('click',advance);
document.getElementById('fullscreen').addEventListener('click',async e=>{e.stopPropagation();if(document.fullscreenElement){await document.exitFullscreen()}else{await document.documentElement.requestFullscreen()}});
init();
</script>
</body>
</html>
