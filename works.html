<!doctype html>

  <link rel="stylesheet" href="style.css" />

  <style>
    /* Ensemble vidéo + légende */
    .video {
      width: 100%;
      max-width: 600px;
      margin: 0 auto 3rem;
      text-align: center;
    }

    /* Conteneur vidéo horizontal 16:9 */
    .video-responsive {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #f2f2f2;
    }

    .video-responsive iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;

      /* Ombre volontairement discrète */
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* Vidéo verticale */
    .video.vertical {
      max-width: 340px;
    }

    .video-responsive.shorts {
      aspect-ratio: 9 / 16;
    }

    /* Légendes */
    .caption {
      margin-top: 0.65rem;
      font-size: 0.85rem;
      font-weight: 400;
      line-height: 1.4;
      color: #666;
      text-align: left;
    }

    /* Mobile */
    @media (max-width: 767px) {
      .video {
        max-width: 100%;
        margin-bottom: 2.5rem;
      }

      .video.vertical {
        max-width: min(78vw, 340px);
      }

      .caption {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
